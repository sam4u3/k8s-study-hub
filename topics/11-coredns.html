<script>
// Resolver simulator: applies resolv.conf search list + ndots like glibc/musl do.
const SERVICES = { "nginx-service.default": "10.96.0.100", "postgres-rw.crash-course": "10.96.14.2", "auth-service.crash-course": "10.96.33.8", "kube-dns.kube-system": "10.96.0.10" };
const dnsHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>Pod's namespace<select class="input" id="pns"><option>default</option><option>crash-course</option></select></label>
    <label>Name the app looks up<input class="input" id="qname" value="postgres-rw.crash-course" spellcheck="false"></label>
    <button class="btn primary" id="resolve">Resolve</button>
  </div>
  <div class="ctrl" style="margin:-4px 0 12px">${["nginx-service", "postgres-rw", "postgres-rw.crash-course", "auth-service.crash-course.svc.cluster.local.", "google.com"].map(q => `<button class="btn small" data-q="${q}">${q}</button>`).join("")}</div>
  <div class="pipe-out" id="dnsOut"></div>
</div>`;
function initDns(el) {
  const out = el.querySelector("#dnsOut"), q = el.querySelector("#qname"), ns = el.querySelector("#pns");
  let t;
  const run = () => {
    clearTimeout(t);
    const name = q.value.trim(), n = ns.value;
    const search = [`${n}.svc.cluster.local`, "svc.cluster.local", "cluster.local"];
    const dots = (name.replace(/\.$/, "").match(/\./g) || []).length;
    let tries;
    if (name.endsWith(".")) tries = [name.slice(0, -1)];
    else if (dots >= 5) tries = [name, ...search.map(s => `${name}.${s}`)];
    else tries = [...search.map(s => `${name}.${s}`), name];
    out.innerHTML = `<span class="faint">search ${search.join(" ")} · options ndots:5 · "${name}" has ${dots} dot(s) ${name.endsWith(".") ? "(absolute: no search)" : dots >= 5 ? "(≥5: try as-is first)" : "(<5: search list first)"}</span><br>`;
    let i = 0;
    const step = () => {
      if (i >= tries.length) { out.innerHTML += `<span style="color:var(--red)">✗ NXDOMAIN for all candidates</span>`; return; }
      const fq = tries[i];
      const m = fq.match(/^(.+?)\.(.+?)\.svc\.cluster\.local$/);
      const hit = m && SERVICES[`${m[1]}.${m[2]}`];
      const ext = !fq.includes("cluster.local") && /\.(com|org|io|net)$/.test(fq);
      if (hit) { out.innerHTML += `${i + 1}. A? ${fq} → <span style="color:var(--green)">${hit}</span> ✓ (CoreDNS kubernetes plugin)<br>`; return; }
      if (ext) { out.innerHTML += `${i + 1}. A? ${fq} → <span style="color:var(--green)">142.250.74.46</span> ✓ (forwarded upstream)<br>`; return; }
      out.innerHTML += `${i + 1}. A? ${fq} → <span style="color:var(--amber)">NXDOMAIN</span><br>`;
      i++; t = setTimeout(step, 550);
    };
    t = setTimeout(step, 300);
  };
  el.querySelector("#resolve").onclick = run;
  el.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { q.value = b.dataset.q; run(); });
  run();
}

K8S_RENDER({
  id: "11-coredns", group: "networking", minutes: 15, video: 7974, videoLabel: "CoreDNS", repo: "Module1",
  title: '<span class="grad-text">CoreDNS</span> & service discovery',
  lead: "Apps don't use Service IPs; they use names like postgres-rw. CoreDNS turns those names into ClusterIPs by watching the API server.",
  parts: [["Names", "What records exist"], ["Resolver", "search paths & ndots"], ["Corefile", "Plugins chain"], ["Debug", "busybox nslookup"]],
  sections: [
    { id: "names", title: "DNS names Kubernetes creates", toc: "DNS names",
      blocks: [
        { type: "table", head: ["Object", "Record", "Example"], rows: [
          ["Service (ClusterIP)", "A/AAAA → ClusterIP", "<code>nginx-service.default.svc.cluster.local</code> → 10.96.0.100"],
          ["Headless Service", "A → each ready Pod IP", "<code>postgres.default.svc.cluster.local</code> → 10.244.1.4, 10.244.2.8"],
          ["StatefulSet Pod via headless", "A → that Pod", "<code>postgres-0.postgres.default.svc.cluster.local</code>"],
          ["Named port", "SRV", "<code>_http._tcp.nginx-service.default.svc.cluster.local</code>"],
          ["ExternalName Service", "CNAME", "<code>external-db</code> → <code>my-db.database-ns.svc.cluster.local</code>"],
          ["Pod (if enabled)", "A", "<code>10-244-1-5.default.pod.cluster.local</code>"]
        ] },
        { type: "callout", kind: "info", html: "Format: <code>&lt;service&gt;.&lt;namespace&gt;.svc.&lt;cluster-domain&gt;</code>. The cluster domain is usually <code>cluster.local</code>. Within the same namespace, the short name <code>nginx-service</code> is enough." }
      ] },
    { id: "resolver", title: "How a Pod resolves a name", toc: "Resolver",
      lead: "The kubelet writes /etc/resolv.conf into every Pod (dnsPolicy: ClusterFirst). The search list and ndots decide which names are tried, in order.",
      blocks: [
        { type: "code", title: "/etc/resolv.conf inside a Pod in namespace crash-course", code: "nameserver 10.96.0.10          # kube-dns Service ClusterIP (CoreDNS Pods behind it)\nsearch crash-course.svc.cluster.local svc.cluster.local cluster.local\noptions ndots:5" },
        { type: "custom", html: dnsHtml, init: initDns },
        { type: "callout", kind: "warn", html: "<b>ndots:5 costs queries.</b> <code>google.com</code> has 1 dot, so three cluster suffixes are tried (and fail) before the real name. For chatty external calls use a trailing dot (<code>api.stripe.com.</code>) or set <code>dnsConfig.options ndots: 2</code> on the Pod." }
      ] },
    { id: "corefile", title: "The Corefile", toc: "Corefile",
      lead: "CoreDNS is a chain of plugins configured in the coredns ConfigMap.",
      blocks: [
        { type: "yaml", title: "kubectl -n kube-system get cm coredns -o yaml", lines: [
          [".:53 {", "<b>Server block</b> for all zones on port 53."],
          ["    errors", "Log errors to stdout."],
          ["    health {", "<code>:8080/health</code> liveness endpoint."],
          ["       lameduck 5s", "Keep answering 5 s during shutdown so in-flight queries succeed."],
          ["    }", ""],
          ["    ready", "<code>:8181/ready</code> readiness: ready once plugins (incl. kubernetes) have synced."],
          ["    kubernetes cluster.local in-addr.arpa ip6.arpa {", "<b>The key plugin.</b> Watches Services and EndpointSlices and answers for cluster.local plus reverse lookups."],
          ["       pods insecure", "Answer pod A records without checking the Pod exists (legacy compatibility)."],
          ["       fallthrough in-addr.arpa ip6.arpa", "Unknown reverse lookups go to the next plugin."],
          ["       ttl 30", "Cache TTL for answers."],
          ["    }", ""],
          ["    prometheus :9153", "Metrics for Prometheus (queries, latency, cache hits)."],
          ["    forward . /etc/resolv.conf {", "<b>Everything not in cluster.local</b> goes to the node's upstream resolvers."],
          ["       max_concurrent 1000", ""],
          ["    }", ""],
          ["    cache 30", "Cache responses for up to 30 s."],
          ["    loop", "Detects forwarding loops (common with systemd-resolved 127.0.0.53) and crashes loudly."],
          ["    reload", "Reload the Corefile automatically when the ConfigMap changes."],
          ["    loadbalance", "Shuffle A records for simple round-robin."],
          ["}", ""]
        ] },
        { type: "code", title: "add a custom zone (e.g. corporate DNS)", code: "    example.internal:53 {\n        errors\n        cache 30\n        forward . 10.0.0.53\n    }" }
      ] },
    { id: "debug", title: "Debug DNS like the course", toc: "Debug",
      blocks: [
        { type: "term", title: "course demo", lines: [
          "$ kubectl get pods -n kube-system -l k8s-app=kube-dns",
          "coredns-668d6bf9bc-4xk8n   1/1   Running",
          "coredns-668d6bf9bc-tr2zq   1/1   Running",
          "$ kubectl apply -f nginx.yaml         # Deployment + Service nginx-service",
          "$ kubectl run -it --rm busybox --image=busybox:1.36 --restart=Never -- sh",
          "/ # nslookup nginx-service",
          "Server:    10.96.0.10",
          "Name:      nginx-service.default.svc.cluster.local",
          "Address:   10.96.0.100",
          "/ # cat /etc/resolv.conf",
          "/ # wget -qO- nginx-service | head -1",
          "$ kubectl logs -n kube-system -l k8s-app=kube-dns --tail=20",
          "✓ name resolves → DNS works; if wget still fails, look at Service endpoints"
        ] },
        { type: "table", head: ["Symptom", "Likely cause"], rows: [
          ["Timeouts for every name", "CoreDNS Pods not running, NetworkPolicy blocking UDP/TCP 53, or CNI broken"],
          ["Cluster names OK, external names fail", "Upstream in node /etc/resolv.conf unreachable"],
          ["CoreDNS CrashLoopBackOff with 'Loop detected'", "Node resolv.conf points at 127.0.0.53; set kubelet resolvConf to /run/systemd/resolve/resolv.conf"],
          ["NXDOMAIN for a Service in another namespace", "Used the short name; use <code>svc.namespace</code>"]
        ] }
      ] }
  ],
  summary: {
    takeaways: [
      ["📛", "svc.ns.svc.cluster.local", "Short name works within the namespace."],
      ["🧭", "Search list + ndots:5", "Short names try cluster suffixes first."],
      ["🔌", "kubernetes plugin", "Watches Services/EndpointSlices to answer."],
      ["➡️", "forward plugin", "Sends external names upstream."],
      ["👤", "Headless = Pod IPs", "Plus per-Pod names for StatefulSets."],
      ["🐞", "busybox nslookup", "Fastest way to test from inside the cluster."]
    ],
    cheat: `kubectl get pods,svc -n kube-system -l k8s-app=kube-dns
kubectl -n kube-system get cm coredns -o yaml
kubectl run -it --rm dns --image=busybox:1.36 --restart=Never -- nslookup <svc>.<ns>
kubectl exec <pod> -- cat /etc/resolv.conf
kubectl -n kube-system logs -l k8s-app=kube-dns
kubectl -n kube-system rollout restart deploy coredns`,
    quiz: [
      ["Full DNS name of Service auth-service in namespace crash-course?", ["auth-service.cluster.local", "auth-service.crash-course.svc.cluster.local", "crash-course.auth-service.svc", "svc.auth-service.crash-course"], 1, "service.namespace.svc.cluster-domain"],
      ["Why does google.com trigger extra DNS queries in a Pod?", ["CoreDNS is slow", "ndots:5 makes the resolver try search suffixes first", "Google blocks Pods", "TTL is 0"], 1, "Names with fewer than 5 dots get search domains appended first."],
      ["Which Corefile plugin sends external queries upstream?", ["kubernetes", "forward", "cache", "loop"], 1, "forward . /etc/resolv.conf"],
      ["What does a headless Service's DNS name return?", ["The ClusterIP", "The IPs of ready Pods", "NXDOMAIN", "The node IP"], 1, "clusterIP: None → A records for each endpoint."]
    ]
  }
});
</script>
