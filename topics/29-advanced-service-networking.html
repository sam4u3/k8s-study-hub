<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Service Networking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
// Traffic routing simulator: zones, nodes, policies.
const EPS = [{ id: "a1", zone: "zone-a", node: "n1" }, { id: "a2", zone: "zone-a", node: "n2" }, { id: "b1", zone: "zone-b", node: "n3" }, { id: "c1", zone: "zone-c", node: "n4" }];
const trHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>Client Pod location<select class="input" id="tClient"><option value="n1">node n1 (zone-a)</option><option value="n3">node n3 (zone-b)</option><option value="n5">node n5 (zone-b, no endpoint on node)</option><option value="n6">node n6 (zone-d, no endpoints in zone)</option></select></label>
    <label>Service setting<select class="input" id="tPol">
      <option value="none">default (cluster-wide)</option>
      <option value="PreferClose">trafficDistribution: PreferClose</option>
      <option value="PreferSameZone">trafficDistribution: PreferSameZone</option>
      <option value="PreferSameNode">trafficDistribution: PreferSameNode</option>
      <option value="itpLocal">internalTrafficPolicy: Local</option></select></label>
  </div>
  <div id="tEps" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"></div>
  <div class="pipe-out" id="tOut"></div>
</div>`;
function initTr(el) {
  const $ = s => el.querySelector(s);
  if (innerWidth < 760) $("#tEps").style.gridTemplateColumns = "1fr 1fr";
  const zoneOf = n => ({ n1: "zone-a", n2: "zone-a", n3: "zone-b", n4: "zone-c", n5: "zone-b", n6: "zone-d" })[n];
  const go = () => {
    const c = $("#tClient").value, p = $("#tPol").value, z = zoneOf(c);
    let set = EPS, note = "";
    if (p === "PreferClose" || p === "PreferSameZone") { const s = EPS.filter(e => e.zone === z); if (s.length) { set = s; note = `same-zone endpoints only (${z})`; } else note = "no endpoint in this zone → falls back to all endpoints"; }
    if (p === "PreferSameNode") { const s = EPS.filter(e => e.node === c); if (s.length) { set = s; note = "same-node endpoint"; } else { const zz = EPS.filter(e => e.zone === z); set = zz.length ? zz : EPS; note = zz.length ? "no endpoint on this node → falls back to same zone" : "no endpoint on node or zone → all endpoints"; } }
    if (p === "itpLocal") { set = EPS.filter(e => e.node === c); note = set.length ? "node-local endpoint only" : "<span style='color:var(--red)'>no endpoint on this node → traffic is DROPPED (no fallback)</span>"; }
    $("#tEps").innerHTML = EPS.map(e => `<div class="box" style="border-color:${set.includes(e) ? "var(--green)" : "var(--border)"};opacity:${set.includes(e) ? 1 : .4}"><b style="font:600 12.5px var(--mono)">pod-${e.id}</b><div class="faint" style="font-size:12px">${e.zone} · ${e.node}</div></div>`).join("");
    $("#tOut").innerHTML = `client on ${c} (${z}) → candidates: <b>${set.map(e => "pod-" + e.id).join(", ") || "none"}</b><br><span class="muted">${note || "any ready endpoint in the cluster, possibly cross-zone (latency + egress cost)"}</span>`;
  };
  el.querySelectorAll("select").forEach(s => s.onchange = go); go();
}

K8S_RENDER({
  id: "29-svc-advanced", group: "networking", minutes: 25,
  title: 'Advanced <span class="grad-text">Service networking</span>',
  lead: "Behind every Service are EndpointSlices, a ClusterIP allocator, and routing preferences that decide whether traffic stays on the node, stays in the zone, or crosses the cluster.",
  parts: [["EndpointSlices", "Scalable endpoint lists"], ["Traffic policies", "Local vs Cluster"], ["Traffic distribution", "Zone- and node-aware routing"], ["ClusterIP allocation", "ServiceCIDRs"], ["Dual-stack", "IPv4 + IPv6"]],
  sections: [
    { id: "slices", title: "EndpointSlices", toc: "EndpointSlices",
      blocks: [
        { type: "yaml", title: "kubectl get endpointslice -l kubernetes.io/service-name=game-service -o yaml", lines: [
          ["apiVersion: discovery.k8s.io/v1", ""],
          ["kind: EndpointSlice", "Replaced the old <code>Endpoints</code> object, which put every IP in one huge object (rewritten on every change). Slices hold up to 100 endpoints each by default."],
          ["metadata:", ""],
          ["  name: game-service-x7k2p", ""],
          ["  labels: {kubernetes.io/service-name: game-service}", "Links the slice to its Service."],
          ["addressType: IPv4", "One address family per slice; dual-stack Services get two sets."],
          ["ports: [{name: http-metrics, port: 8081, protocol: TCP}]", ""],
          ["endpoints:", ""],
          ["- addresses: [\"10.244.1.12\"]", ""],
          ["  conditions: {ready: true, serving: true, terminating: false}", "<b>ready</b>: send new traffic. <b>serving</b>/<b>terminating</b> let proxies drain gracefully: a terminating but still-serving Pod can finish requests if nothing else is ready."],
          ["  nodeName: wk1", "Used for node-local routing."],
          ["  zone: zone-a", "Used for zone-aware routing."],
          ["  hints: {forZones: [{name: zone-a}]}", "Routing hints written by the EndpointSlice controller for topology-aware routing."]
        ] }
      ] },
    { id: "policies", title: "External and internal traffic policy", toc: "Traffic policies",
      blocks: [
        { type: "compare", cols: [
          { title: "externalTrafficPolicy", chip: "NodePort / LoadBalancer", chipClass: "blue", color: "var(--k8s-2)", items: ["<b>Cluster</b> (default): any node forwards to any Pod; client IP is SNATed to the node IP; extra hop", "<b>Local</b>: only nodes with a local Pod accept traffic; <b>client source IP preserved</b>; LB health checks (<code>healthCheckNodePort</code>) skip empty nodes", "Local can unbalance load if Pods are unevenly spread"] },
          { title: "internalTrafficPolicy", chip: "in-cluster clients", chipClass: "violet", color: "var(--violet)", items: ["<b>Cluster</b> (default): any endpoint", "<b>Local</b>: only endpoints on the client's node", "If the node has none, traffic is <b>dropped</b>", "Good for node agents: talk to the DaemonSet Pod on your own node"] }
        ] }
      ] },
    { id: "distribution", title: "Traffic distribution and topology-aware routing", toc: "Traffic distribution",
      lead: "Cross-zone traffic adds latency and often costs money. <code>spec.trafficDistribution</code> expresses a preference; kube-proxy (or your CNI) applies it and falls back when nothing local is available.",
      blocks: [
        { type: "custom", html: trHtml, init: initTr },
        { type: "table", head: ["Setting", "Status", "Behaviour"], rows: [
          ["<code>trafficDistribution: PreferClose</code>", "stable v1.33", "Prefer endpoints in the client's zone (same as PreferSameZone)"],
          ["<code>trafficDistribution: PreferSameZone</code>", "stable v1.35", "Explicit name for the zone preference"],
          ["<code>trafficDistribution: PreferSameNode</code>", "stable v1.35", "Prefer the same node, then fall back"],
          ["<code>service.kubernetes.io/topology-mode: Auto</code>", "annotation (topology-aware routing)", "Controller assigns zone hints proportionally to CPU capacity; disabled when too few endpoints"],
          ["<code>internalTrafficPolicy: Local</code>", "stable", "Node-only, no fallback"]
        ] },
        { type: "callout", kind: "warn", html: "Zone preferences can overload a zone that has few Pods but many clients. Spread replicas evenly across zones (topologySpreadConstraints) before turning them on." }
      ] },
    { id: "cidr", title: "ClusterIP allocation and ServiceCIDRs", toc: "ClusterIP allocation",
      blocks: [
        { type: "cards", cols: 3, items: [
          ["🎯", "Static vs dynamic", "You can request a specific <code>clusterIP</code>. The range is split: the lower band is preferred for static picks, dynamic allocation prefers the upper band, reducing collisions."],
          ["📈", "ServiceCIDR objects", "Ranges are API objects (<code>networking.k8s.io/v1</code> ServiceCIDR, stable since v1.33). Add a new range when the old one fills up, without restarting the API server."],
          ["🧾", "IPAddress objects", "Each allocated ClusterIP is an <code>IPAddress</code> object, so conflicts and leaks are visible with kubectl."]
        ] },
        { type: "code", title: "extend Service IP space", code: `kubectl get servicecidr
NAME         CIDRS          AGE
kubernetes   10.96.0.0/28   20d        # tiny range, full

cat <<EOF | kubectl apply -f -
apiVersion: networking.k8s.io/v1
kind: ServiceCIDR
metadata:
  name: extra
spec:
  cidrs: ["10.96.100.0/24"]
EOF
kubectl get ipaddresses | head` }
      ] },
    { id: "dualstack", title: "IPv4/IPv6 dual-stack", toc: "Dual-stack",
      blocks: [
        { type: "yaml", title: "dual-stack Service", lines: [
          ["apiVersion: v1", ""],
          ["kind: Service", ""],
          ["metadata: {name: web}", ""],
          ["spec:", ""],
          ["  ipFamilyPolicy: PreferDualStack", "<b>SingleStack</b> (default), <b>PreferDualStack</b> (both if the cluster supports it), <b>RequireDualStack</b> (fail otherwise)."],
          ["  ipFamilies: [IPv6, IPv4]", "Order sets the primary family: the first is <code>.spec.clusterIP</code>."],
          ["  selector: {app: web}", ""],
          ["  ports: [{port: 80}]", ""]
        ] },
        { type: "callout", kind: "info", html: "Dual-stack (stable since v1.23) needs dual-stack Pod and Service CIDRs on the control plane (<code>--service-cluster-ip-range=10.96.0.0/16,fd00:10:96::/112</code>), kubelet node IPs for both families, and a CNI that supports it (Calico, Cilium). Pods then get <code>status.podIPs</code> with two entries." }
      ] }
  ],
  summary: {
    takeaways: [
      ["🧩", "EndpointSlices scale", "≤100 endpoints per slice; ready/serving/terminating conditions."],
      ["🏠", "externalTrafficPolicy: Local", "Keeps client IP; only nodes with Pods receive traffic."],
      ["📍", "internalTrafficPolicy: Local", "Node-only; drops if none local."],
      ["🗺️", "trafficDistribution", "PreferClose/SameZone/SameNode with fallback."],
      ["📈", "ServiceCIDR objects", "Grow ClusterIP space at runtime (GA v1.33)."],
      ["🌐", "Dual-stack", "ipFamilyPolicy + ipFamilies per Service."]
    ],
    cheat: `kubectl get endpointslices -l kubernetes.io/service-name=<svc> -o wide
kubectl get svc <svc> -o jsonpath='{.spec.trafficDistribution}'
kubectl patch svc <svc> -p '{"spec":{"externalTrafficPolicy":"Local"}}'
kubectl get servicecidr; kubectl get ipaddresses
kubectl get pod <p> -o jsonpath='{.status.podIPs}'`,
    quiz: [
      ["Why use externalTrafficPolicy: Local?", ["Faster DNS", "Preserve client source IP and avoid an extra hop", "More replicas", "TLS"], 1, "Traffic only lands on nodes with local endpoints."],
      ["internalTrafficPolicy: Local and no endpoint on the client's node. Result?", ["Falls back to cluster", "Traffic dropped", "DNS error", "Uses another zone"], 1, "No fallback by design."],
      ["PreferClose and no endpoints in the client's zone?", ["Dropped", "Falls back to all endpoints", "Error", "Waits"], 1, "It's a preference, not a requirement."],
      ["Service IP range is exhausted. Modern fix?", ["Rebuild cluster", "Create an extra ServiceCIDR object", "Use NodePorts", "Delete kube-dns"], 1, "ServiceCIDR is GA since v1.33."]
    ]
  }
});
</script>
</body>
</html>
