<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>CSI Container Storage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
K8S_RENDER({
  id: "storage-csi", group: "storage", minutes: 15,
  title: '<span class="grad-text">CSI</span>: the Container Storage Interface',
  lead: "CSI is to storage what CRI is to runtimes and CNI is to networks: a standard plug so any storage vendor can integrate without changing Kubernetes itself.",
  parts: [["Why CSI", "In-tree vs out-of-tree"], ["Components", "Controller + node plugins"], ["Lifecycle", "Provision → attach → mount"], ["Inspect", "CSIDriver, VolumeAttachment"]],
  sections: [
    { id: "why", title: "Why storage moved out of tree", toc: "Why CSI",
      blocks: [
        { type: "compare", cols: [
          { title: "In-tree (old)", chip: "removed", chipClass: "red", color: "var(--red)", items: ["Drivers for AWS EBS, GCE PD, Azure Disk… compiled into Kubernetes", "Vendor bug fix = wait for a Kubernetes release", "Bloated binaries, security surface for everyone", "Migrated to CSI; in-tree cloud code removed by 1.31"] },
          { title: "CSI (now)", chip: "standard", chipClass: "green", color: "var(--green)", items: ["Driver ships as containers (Deployment + DaemonSet)", "Vendors release on their own schedule", "Same spec used by Nomad, Mesos, Cloud Foundry", "Snapshots, resize, cloning, topology support"] }
        ] },
        { type: "callout", kind: "info", html: "Your manifests barely change: you still write a <code>PersistentVolumeClaim</code> that names a <code>StorageClass</code>. The StorageClass <code>provisioner</code> field now names a CSI driver, e.g. <code>ebs.csi.aws.com</code>." }
      ] },
    { id: "components", title: "Anatomy of a CSI driver", toc: "Components",
      lead: "Every CSI driver has two halves plus Kubernetes-maintained sidecars that translate API objects into CSI gRPC calls.",
      blocks: [
        { type: "cards", cols: 2, items: [
          ["🧠", "Controller plugin (Deployment)", "Talks to the storage backend's API. Implements CreateVolume, DeleteVolume, ControllerPublish (attach), snapshots, expand. Usually 1–2 replicas."],
          ["🖥️", "Node plugin (DaemonSet)", "Runs privileged on every node. Implements NodeStage (format + mount to a global path) and NodePublish (bind-mount into the Pod)."],
          ["🧩", "Sidecars (controller side)", "<code>external-provisioner</code> (watches PVCs), <code>external-attacher</code> (watches VolumeAttachments), <code>external-resizer</code>, <code>external-snapshotter</code>."],
          ["🔌", "Sidecars (node side)", "<code>node-driver-registrar</code> registers the driver socket with the kubelet; <code>livenessprobe</code> health-checks it."]
        ] },
        { type: "layers", items: [
          ["Pod volumeMount /var/lib/postgresql/data", "what your app sees", "#34d399"],
          ["kubelet → NodePublishVolume / NodeStageVolume", "node plugin via unix socket", "#22d3ee"],
          ["VolumeAttachment → ControllerPublishVolume", "external-attacher → controller plugin", "#8b5cf6"],
          ["PVC → CreateVolume", "external-provisioner → controller plugin", "#5b8cff"],
          ["Storage backend API", "Exoscale SBS, AWS EBS, Ceph, NFS server…", "#fbbf24"]
        ] }
      ] },
    { id: "lifecycle", title: "Volume lifecycle, animated", toc: "Lifecycle",
      blocks: [
        { type: "flow", interval: 3400, nodes: [
          ["📝", "PVC", "You create a PVC", "<code>storageClassName: standard</code>, <code>10Gi</code>, <code>ReadWriteOnce</code>. With <code>WaitForFirstConsumer</code> nothing happens until a Pod uses it."],
          ["📍", "Schedule", "Pod is scheduled", "The scheduler picks a node; the PVC gets the annotation <code>volume.kubernetes.io/selected-node</code> so the disk is created in the right zone."],
          ["🧱", "CreateVolume", "Provision", "external-provisioner sees the PVC and calls CreateVolume. The backend creates a disk; a <code>PersistentVolume</code> is created and bound to the PVC."],
          ["🔗", "Attach", "ControllerPublishVolume", "attach/detach controller creates a <code>VolumeAttachment</code>; external-attacher calls the backend to attach the disk to the node VM."],
          ["💽", "Stage", "NodeStageVolume", "Node plugin formats the block device (ext4/xfs) if new and mounts it to a global staging path on the node."],
          ["📂", "Publish", "NodePublishVolume", "Bind-mounts the staged path into the Pod's volume directory. The container starts with the data in place."],
          ["♻️", "Release", "Pod deleted / PVC deleted", "Unpublish → unstage → detach. If the PVC is deleted and reclaimPolicy is Delete, DeleteVolume removes the disk."]
        ] }
      ] },
    { id: "inspect", title: "Inspect CSI on a cluster", toc: "Inspect",
      blocks: [
        { type: "term", title: "kubectl", lines: [
          "$ kubectl get csidrivers",
          "NAME                 ATTACHREQUIRED   PODINFOONMOUNT   MODES",
          "ebs.csi.aws.com     true             false            Persistent",
          "$ kubectl get storageclass",
          "NAME                      PROVISIONER          RECLAIMPOLICY   VOLUMEBINDINGMODE",
          "standard (default)    ebs.csi.aws.com     Delete          WaitForFirstConsumer",
          "$ kubectl get csinodes",
          "$ kubectl get volumeattachments",
          "$ kubectl get pods -n kube-system -l app=ebs-csi-controller",
          "$ kubectl describe pvc data-postgres-1     # Events show provisioning errors",
          "✓ PVC Pending + 'waiting for first consumer' is normal until a Pod uses it"
        ] },
        { type: "callout", kind: "tip", html: "Volumes in the same topic family: <code>emptyDir</code>, <code>hostPath</code>, ConfigMap and Secret volumes are handled by the kubelet itself, not CSI. CSI is for real external storage. Hands-on with PV/PVC is in the <a href=\"storage-volumes-pv-pvc.html\">Volumes topic</a>." }
      ] }
  ],
  summary: {
    takeaways: [
      ["🔌", "CSI = storage plug", "Vendors ship drivers independently of Kubernetes releases."],
      ["🧠", "Controller plugin", "Create/delete/attach volumes via the backend API."],
      ["🖥️", "Node plugin", "Format and mount on every node (DaemonSet)."],
      ["🧩", "Sidecars translate", "external-provisioner/attacher turn API objects into gRPC calls."],
      ["⏳", "WaitForFirstConsumer", "Disk is created after scheduling, in the Pod's zone."],
      ["♻️", "reclaimPolicy", "Delete removes the disk; Retain keeps it."]
    ],
    cheat: `kubectl get csidrivers,csinodes
kubectl get sc
kubectl get pv,pvc -A
kubectl get volumeattachments
kubectl describe pvc <name>
kubectl logs -n kube-system <csi-controller-pod> -c csi-provisioner`,
    quiz: [
      ["Which sidecar watches PVCs and calls CreateVolume?", ["node-driver-registrar", "external-provisioner", "external-attacher", "livenessprobe"], 1, "external-provisioner handles dynamic provisioning."],
      ["Where does the CSI node plugin run?", ["Only on control plane", "As a DaemonSet on every node", "Inside each Pod", "In etcd"], 1, "Each node must be able to mount volumes."],
      ["What does WaitForFirstConsumer achieve?", ["Faster PVCs", "Creates the disk only after a Pod is scheduled, in the right zone", "Skips attach", "Enables RWX"], 1, "Topology-aware provisioning."],
      ["Is emptyDir handled by CSI?", ["Yes", "No, kubelet handles it locally", "Only on cloud", "Only for memory medium"], 1, "emptyDir, hostPath, ConfigMap and Secret volumes are built in."]
    ]
  }
});
</script>
</body>
</html>
