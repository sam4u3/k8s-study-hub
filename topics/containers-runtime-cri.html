<script>
K8S_RENDER({
  id: "containers-cri", group: "containers", minutes: 20,
  title: '<span class="grad-text">CRI</span>: the Container Runtime Interface',
  lead: "The kubelet does not know how to run a container. It asks a runtime over a standard gRPC API. That single interface is why Kubernetes could drop Docker without breaking anyone's images.",
  parts: [["The stack", "kubelet → containerd → runc"], ["RunPodSandbox", "The pause container"], ["dockershim", "What really changed in 1.24"], ["crictl", "Debug the node"]],
  sections: [
    { id: "stack", title: "The runtime stack", toc: "The stack",
      lead: "Three layers with three standards: CRI (kubelet ↔ runtime), OCI image spec (what an image is), OCI runtime spec (how to start a container).",
      blocks: [
        { type: "layers", items: [
          ["kubelet", "speaks CRI (gRPC) on unix:///run/containerd/containerd.sock", "#5b8cff"],
          ["CRI runtime: containerd (CRI plugin) or CRI-O", "image pull, snapshots, sandbox and container lifecycle", "#8b5cf6"],
          ["containerd-shim-runc-v2", "one shim per Pod; keeps containers alive if containerd restarts", "#22d3ee"],
          ["OCI runtime: runc (or crun, gVisor runsc, Kata)", "creates namespaces + cgroups, execs the process, then exits", "#34d399"],
          ["Linux kernel", "namespaces · cgroups · seccomp · AppArmor/SELinux", "#fbbf24"]
        ] },
        { type: "compare", cols: [
          { title: "containerd", chip: "CNCF graduated", chipClass: "blue", color: "var(--k8s-2)", items: ["Default in kubeadm docs, EKS, GKE, AKS, k3s", "Came out of Docker; Docker still uses it underneath", "CLI for humans: <code>nerdctl</code>; low-level: <code>ctr</code>"] },
          { title: "CRI-O", chip: "CNCF graduated", chipClass: "violet", color: "var(--violet)", items: ["Built only for Kubernetes CRI", "Versions track Kubernetes minors", "Default in OpenShift"] }
        ] }
      ] },
    { id: "sandbox", title: "How the kubelet starts a Pod via CRI", toc: "Pod via CRI",
      lead: "A Pod is first a sandbox (shared network namespace), then containers that join it.",
      blocks: [
        { type: "flow", nodes: [
          ["🤖", "kubelet", "Pod assigned to node", "The kubelet sees a new Pod bound to its node and starts syncing it."],
          ["📦", "RunPodSandbox", "RunPodSandbox()", "CRI call 1. containerd starts the tiny <b>pause</b> container (<code>registry.k8s.io/pause</code>). It does nothing but hold the Pod's network/IPC namespaces open."],
          ["🌐", "CNI ADD", "Network the sandbox", "The runtime calls the CNI plugin with the sandbox's netns path. The plugin creates a veth pair and assigns the Pod IP."],
          ["📥", "PullImage", "PullImage()", "CRI image service pulls each container image (unless present and pull policy allows)."],
          ["🧱", "CreateContainer", "CreateContainer() + StartContainer()", "Each app container is created via runc and joins the pause container's namespaces. That's why containers in a Pod share localhost."],
          ["🩺", "Status", "ContainerStatus() loop", "kubelet polls statuses (or receives events), runs probes and reports to the API server."]
        ] },
        { type: "callout", kind: "info", html: "If an app container crashes, the sandbox (pause) survives, so the Pod keeps its IP. If the sandbox dies, the whole Pod is recreated with a new IP." }
      ] },
    { id: "dockershim", title: "Dockershim: what really changed", toc: "dockershim",
      lead: "Kubernetes 1.24 removed dockershim. Panic followed; almost nothing broke.",
      blocks: [
        { type: "timeline", items: [
          ["2014–2016", "Docker hard-wired", "The kubelet talked to Docker directly. Supporting rkt or others meant changing kubelet code."],
          ["2016 (1.5)", "CRI introduced", "A plugin API so any runtime could integrate. Docker did not implement CRI, so Kubernetes kept an adapter inside kubelet: <b>dockershim</b>."],
          ["Dec 2020 (1.20)", "Deprecation announced", "Maintaining dockershim was a burden; containerd was already inside Docker anyway."],
          ["May 2022 (1.24)", "dockershim removed", "Nodes must run a CRI runtime. Mirantis maintains <code>cri-dockerd</code> for those who still need Docker Engine on nodes."]
        ] },
        { type: "compare", cols: [
          { title: "Still works", chip: "unchanged", chipClass: "green", color: "var(--green)", items: ["Images built with <code>docker build</code> (they are OCI images)", "Pushing to and pulling from Docker Hub", "Docker on your laptop for development"] },
          { title: "Breaks", chip: "node-level only", chipClass: "red", color: "var(--red)", items: ["Mounting <code>/var/run/docker.sock</code> into Pods (old CI agents, monitoring)", "Running <code>docker ps</code> on nodes to debug: use <code>crictl</code>", "Node setups that assumed dockerd"] }
        ] }
      ] },
    { id: "crictl", title: "Debug the node with crictl", toc: "crictl",
      lead: "crictl talks CRI directly, the same way the kubelet does. Use it when kubectl can't help (API down, Pod stuck creating).",
      blocks: [
        { type: "term", title: "on a node", lines: [
          "$ sudo crictl --runtime-endpoint unix:///run/containerd/containerd.sock info | head",
          "$ sudo crictl pods                     # Pod sandboxes",
          "POD ID        CREATED      STATE  NAME                      NAMESPACE    ATTEMPT",
          "2f1c0a…       3 min ago    Ready  web-6d4cf56db6-7xk2p      default      0",
          "$ sudo crictl ps -a                    # containers incl. exited",
          "$ sudo crictl images",
          "$ sudo crictl logs <container-id>",
          "$ sudo crictl inspectp 2f1c0a | grep -i netns",
          "$ sudo ctr -n k8s.io containers list   # containerd's own view, namespace k8s.io",
          "$ sudo ps -ef | grep pause             # one pause process per Pod",
          "✓ docker ps shows nothing on a containerd node, that's expected"
        ] },
        { type: "h3", text: "Different runtimes per Pod: RuntimeClass" },
        { type: "code", title: "runtimeclass.yaml", code: `apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc            # must match a runtime handler configured in containerd
---
apiVersion: v1
kind: Pod
metadata:
  name: untrusted
spec:
  runtimeClassName: gvisor   # sandboxed kernel for untrusted code
  containers:
  - name: app
    image: nginx` },
        { type: "callout", kind: "tip", html: "cgroup driver mismatch is the #1 runtime issue on kubeadm clusters: kubelet uses <code>systemd</code>, containerd must have <code>SystemdCgroup = true</code>. Symptom: Pods randomly restarting, kubelet logs about cgroups." }
      ] }
  ],
  summary: {
    takeaways: [
      ["🔌", "CRI = gRPC contract", "kubelet ↔ containerd/CRI-O; runtimes are pluggable."],
      ["⏸️", "pause container", "Holds the Pod's namespaces; app containers join it."],
      ["🐳", "Docker images still work", "Only dockershim (node integration) was removed in 1.24."],
      ["🔧", "crictl for nodes", "crictl pods / ps / logs / inspectp."],
      ["🏃", "runc does the work", "Creates namespaces/cgroups then exits; shim babysits."],
      ["🛡️", "RuntimeClass", "Pick gVisor/Kata per Pod for stronger isolation."]
    ],
    cheat: `sudo crictl pods
sudo crictl ps -a
sudo crictl logs <id>
sudo crictl inspectp <pod-id>
sudo ctr -n k8s.io images ls
grep SystemdCgroup /etc/containerd/config.toml
journalctl -u containerd -f`,
    quiz: [
      ["What is the job of the pause container?", ["Pauses the Pod during upgrades", "Holds the Pod's shared namespaces", "Runs probes", "Pulls images"], 1, "App containers join its network/IPC namespaces."],
      ["After dockershim removal, can you deploy images built with docker build?", ["No", "Yes, they are standard OCI images", "Only with cri-dockerd", "Only on GKE"], 1, "The image format didn't change."],
      ["Which tool mirrors what the kubelet sees on a node?", ["docker ps", "crictl", "kubectl top", "etcdctl"], 1, "crictl speaks CRI to the runtime socket."],
      ["Which CRI call happens first for a new Pod?", ["CreateContainer", "PullImage", "RunPodSandbox", "StartContainer"], 2, "The sandbox (and its network) is set up before app containers."]
    ]
  }
});
</script>
