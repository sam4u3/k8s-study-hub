  <div class="sim-row"><label>Cluster type<select class="input" id="ctype">

  ["etcd backups and HA", ["you", "cloud", "cloud", "none"]],

  ["CNI / CSI / CoreDNS add-ons", ["you", "shared", "cloud", "tool"]],
  ["RBAC, namespaces, policies", ["you", "you", "you", "you"]],
  ["Your apps, images, data", ["you", "you", "you", "you"]]

function initResp(el) {
  const sel = el.querySelector("#ctype"), box = el.querySelector("#resp");
  const idx = { self: 0, managed: 1, auto: 2, local: 3 };
  const draw = () => {
    const k = idx[sel.value];

    }).join("");
  };
  sel.onchange = draw; draw();
}

K8S_RENDER({

          { title: "Self-managed", chip: "full control", chipClass: "amber", color: "var(--amber)", items: ["<b>kubeadm</b> on VMs or bare metal", "Also: Talos, RKE2, kOps, Kubespray", "You own etcd, upgrades, certificates", "Best way to learn internals (CKA)"] },

      blocks: [
        { type: "steps", steps: [
          { title: "Install kube tools (pinned)", where: "Node", why: "Pins exact package versions (<code>1.33.0-1.1</code>) and holds them, so the cluster version is reproducible.", code: "curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg\necho 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /' | sudo tee /etc/apt/sources.list.d/kubernetes.list\nsudo apt-get update -y\nsudo apt-get install -y kubelet=1.33.0-1.1 kubeadm=1.33.0-1.1 kubectl=1.33.0-1.1\nsudo apt-mark hold kubelet kubeadm kubectl" },

          { title: "containerd with systemd cgroups", where: "Node", why: "Installs <code>containerd.io</code> from Docker's apt repo and flips <code>SystemdCgroup = true</code>.", code: "containerd config default | sudo tee /etc/containerd/config.toml > /dev/null\nsudo sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml\nsudo systemctl restart containerd && sudo systemctl enable containerd" },
          { title: "kubeadm init", where: "Node", whereClass: "violet", why: "<code>--upload-certs</code> and <code>--control-plane-endpoint</code> prepare for adding more control-plane nodes later. <code>--ignore-preflight-errors=all</code> is a lab shortcut: never use it in production; it hides real problems.", code: "sudo kubeadm init \\\n  --pod-network-cidr=10.244.0.0/16 \\\n  --upload-certs \\\n  --kubernetes-version=v1.33.0 \\\n  --control-plane-endpoint=\"$(hostname)\" \\\n  --cri-socket unix:///run/containerd/containerd.sock" },

        ] },
        { type: "callout", kind: "tip", html: "Full explanation of every kubeadm phase, ports and joining workers: <a href=\"01-history-kubeadm-api-access.html#kubeadm\">Topic 01 → kubeadm install</a>." }
      ] },
    { id: "managed", title: "Managed: creating an SKS cluster", toc: "Managed (SKS)",
      lead: "The course uses Exoscale SKS. The same pattern applies to EKS, GKE and AKS: create the cluster (control plane), add a node pool (workers), download a kubeconfig.",
      blocks: [
        { type: "flow", nodes: [
          ["☁️", "Cluster", "Create the control plane", "Choose Kubernetes version, zone and CNI (Calico or Cilium). The provider starts an HA API server and etcd you never SSH into."],
          ["🖥️", "Node pool", "Add a node pool", "Pick instance type, disk and size (e.g. 3 nodes). Nodes are VMs that join automatically with kubelet configured."],
          ["🔑", "kubeconfig", "Get credentials", "Download a kubeconfig scoped to a user/group with an expiry. Merge it into ~/.kube/config or point KUBECONFIG at it."],
          ["✅", "Verify", "Check and use", "<code>kubectl get nodes</code> shows only workers: managed control-plane nodes are hidden from you."]
        ] },
        { type: "tabs", tabs: [
          { label: "Exoscale SKS", blocks: [{ type: "code", title: "exo CLI (per Exoscale SKS quick start)", code: "# security group must allow NodePorts, kubelet (10250) and CNI traffic between nodes: see the SKS quick start\nexo compute sks create crash-course \\\n  --zone ch-gva-2 \\\n  --service-level pro \\\n  --nodepool-name pool \\\n  --nodepool-size 3 \\\n  --nodepool-security-group sks-security-group\n\nexo compute sks kubeconfig crash-course kube-admin \\\n  --zone ch-gva-2 \\\n  --group system:masters > sks.kubeconfig\nexport KUBECONFIG=$PWD/sks.kubeconfig\nkubectl get nodes" }] },
          { label: "AWS EKS", blocks: [{ type: "code", title: "eksctl", code: "eksctl create cluster --name crash-course --region eu-west-1 --nodes 3\naws eks update-kubeconfig --name crash-course --region eu-west-1\nkubectl get nodes" }] },
          { label: "Google GKE", blocks: [{ type: "code", title: "gcloud", code: "gcloud container clusters create crash-course --zone europe-west1-b --num-nodes 3\ngcloud container clusters get-credentials crash-course --zone europe-west1-b\nkubectl get nodes" }] },

          { label: "kind (local)", blocks: [{ type: "code", title: "kind", code: "cat <<EOF > kind.yaml\nkind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nnodes:\n- role: control-plane\n- role: worker\n- role: worker\nEOF\nkind create cluster --name crash-course --config kind.yaml\nkubectl get nodes" }] }
        ] },
        { type: "callout", kind: "warn", html: "Commands and flags differ by CLI version and region; check your provider's docs before running them. A <code>system:masters</code> kubeconfig is full admin that bypasses RBAC: keep it short-lived and never share it." }
      ] },
    { id: "choose", title: "How to choose", toc: "Choose",
      blocks: [
        { type: "table", head: ["Situation", "Pick", "Why"], rows: [
          ["Learning, CKA prep", "kubeadm on 2–3 VMs + kind", "You see and break every component"],
          ["Production on a public cloud", "Managed (SKS/EKS/GKE/AKS)", "HA control plane and etcd are someone else's pager"],

          ["CI pipelines", "kind", "Seconds to create and destroy"]
        ] }
      ] }
  ],
  summary: {
    takeaways: [
      ["🔌", "Same API everywhere", "Manifests work on kubeadm, SKS, EKS, GKE, AKS and kind."],
      ["🧑‍🔧", "Self-managed = you own etcd", "Backups, certificate rotation, upgrades and HA are your job."],
      ["☁️", "Managed hides the control plane", "kubectl get nodes shows only workers."],

      ["🧪", "kind for speed", "Disposable multi-node clusters in Docker for tests and CI."]
    ],
    cheat: `# local

    quiz: [
      ["In a managed cluster, who backs up etcd?", ["You, with etcdctl", "The provider", "Nobody; etcd is not used", "The kubelet"], 1, "The control plane, including etcd, is operated by the provider."],

    ]
  }
