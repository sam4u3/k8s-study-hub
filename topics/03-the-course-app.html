<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameHub Course App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
const archHtml = `
<div class="sim glass">
  <div style="display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:14px;align-items:center" class="arch3">
    <div class="box" style="text-align:center"><div style="font-size:30px">🧑‍💻</div><b>Browser</b><div class="muted" style="font-size:12.5px">https://gamehub.example.com</div></div>
    <div class="box">
      <div class="faint" style="font-size:12px;margin-bottom:8px">namespace: crash-course</div>
      <div style="display:grid;gap:8px">
        <span class="pill b" data-n="fe">🖼️ frontend · React + nginx :80</span>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <span class="pill v" data-n="auth">🔐 auth-service · Flask :8080</span>
          <span class="pill v" data-n="game">🎮 game-service · Flask :8081</span>
        </div>
        <span class="pill a" data-n="db">🐘 PostgreSQL (CloudNativePG) :5432</span>
      </div>
    </div>
    <div class="box"><b style="font-size:13px">Routes</b><div class="muted" style="font: 12px/1.8 var(--mono)">/ → frontend<br>/api/auth/* → auth-service<br>/api/game/* → game-service</div></div>
  </div>
  <div class="ctrl"><button class="btn small primary" data-r="login">▶ Trace: log in</button><button class="btn small" data-r="score">▶ Trace: save snake score</button><button class="btn small" data-r="page">▶ Trace: load page</button></div>
  <div class="pipe-out" id="trace"><span class="faint"># choose a request to trace</span></div>
</div>`;
const ROUTES = {
  page: [["fe", "GET / → nginx in the frontend Pod serves the built React files (index.html, JS, CSS)."]],
  login: [["fe", "POST /api/auth/login hits nginx in the frontend Pod."], ["auth", "nginx proxy_pass strips /api/auth and forwards to auth-service:8080/login."], ["db", "auth-service queries the users table and checks the bcrypt password hash."], ["auth", "auth-service returns a signed JWT token to the browser."]],
  score: [["fe", "POST /api/game/snake/score with the JWT in the Authorization header."], ["game", "nginx forwards to game-service:8081/snake/score; the service validates the JWT."], ["db", "game-service upserts the row in snake_high_scores for that user_id."], ["game", "200 OK with the new high score."]]
};
function initArch(el) {
  const pills = el.querySelectorAll("[data-n]"), out = el.querySelector("#trace");
  let timer;
  el.querySelectorAll("[data-r]").forEach(b => b.onclick = () => {
    clearTimeout(timer);
    el.querySelectorAll("[data-r]").forEach(x => x.classList.toggle("primary", x === b));
    const steps = ROUTES[b.dataset.r]; let i = 0; out.innerHTML = "";
    const tick = () => {
      pills.forEach(p => p.classList.remove("glow"));
      if (i >= steps.length) { out.innerHTML += '<span style="color:var(--green)">✓ done</span>'; return; }
      const [n, txt] = steps[i];
      el.querySelector(`[data-n="${n}"]`).classList.add("glow");
      out.innerHTML += `${i + 1}. ${txt}<br>`; i++; timer = setTimeout(tick, 1300);
    };
    tick();
  });
  if (innerWidth < 760) el.querySelector(".arch3").style.gridTemplateColumns = "1fr";
}

K8S_RENDER({
  id: "03-app", group: "foundations", minutes: 20, video: 1914, videoLabel: "The Application", repo: "manifests",
  title: 'The course app: <span class="grad-text">GameHub</span>',
  lead: "Every later topic deploys part of one real application. Knowing its shape now makes each Kubernetes object feel concrete: a Deployment is the game-service, a Secret is the database password, an HTTPRoute is the public URL.",
  parts: [["Architecture", "Four components, one namespace"], ["Request paths", "Trace real requests"], ["Build images", "buildx and ttl.sh"], ["Kubernetes map", "Which object does what"]],
  sections: [
    { id: "arch", title: "Architecture at a glance", toc: "Architecture",
      lead: "GameHub is a small game portal: sign up, log in, then play Snake, Tic-Tac-Toe, Rock-Paper-Scissors or a memory game. Scores and stats are stored per user.",
      blocks: [
        { type: "custom", html: archHtml, init: initArch },
        { type: "cards", cols: 4, items: [
          ["🖼️", "frontend", "React + Tailwind, built to static files and served by <b>nginx</b>. nginx also reverse-proxies <code>/api/auth</code> and <code>/api/game</code>."],
          ["🔐", "auth-service", "Python Flask on <b>8080</b>. <code>/register</code> and <code>/login</code>, bcrypt password hashes, JWT tokens."],
          ["🎮", "game-service", "Python Flask on <b>8081</b>. <code>/snake/score</code>, <code>/game/stats</code>, <code>/users/scores</code>."],
          ["🐘", "PostgreSQL", "Tables <code>users</code>, <code>snake_high_scores</code>, <code>games_stats</code>. Run by the CloudNativePG operator with 3 instances."]
        ] }
      ] },
    { id: "data", title: "Data model and configuration", toc: "Data & config",
      lead: "Both backend services read the same four environment variables. That design makes them easy to configure from Kubernetes Secrets later.",
      blocks: [
        { type: "yaml", title: "auth-deploy.yaml (container part)", intro: "Simplified from the course manifests. Click a line.", lines: [
          ["containers:", ""],
          ["- name: auth-service", "Container name inside the Pod. Used by <code>kubectl logs -c</code>."],
          ["  image: saiyam911/auth-service:final", "Image built from <code>./auth-service</code>. In your own run use the tag you pushed."],
          ["  ports:", ""],
          ["  - containerPort: 8080", "Documentation of the listening port; the Service <code>targetPort</code> must match it."],
          ["  env:", ""],
          ["  - name: POSTGRES_HOST", ""],
          ["    value: postgres-rw.crash-course.svc.cluster.local", "<b>DNS name of the read-write Service</b> that CloudNativePG creates for the primary database. CoreDNS resolves it."],
          ["  - name: POSTGRES_USER", ""],
          ["    valueFrom:", ""],
          ["      secretKeyRef: {name: postgres-app, key: username}", "<b>Credentials come from a Secret</b> generated by the operator. No password in the manifest."],
          ["  resources:", ""],
          ["    requests: {cpu: 250m, memory: 64Mi}", "<b>Requests</b> drive scheduling: the node must have this much free."],
          ["    limits: {cpu: 500m, memory: 128Mi}", "<b>Limits</b> become cgroup caps. Exceeding memory gets the container OOMKilled."]
        ] },
        { type: "code", title: "init.sql (loaded through a ConfigMap)", code: `CREATE TABLE IF NOT EXISTS users (
  id SERIAL PRIMARY KEY,
  username VARCHAR(255) UNIQUE NOT NULL,
  password_hash BYTEA NOT NULL
);
CREATE TABLE IF NOT EXISTS snake_high_scores (
  id SERIAL PRIMARY KEY,
  user_id INTEGER REFERENCES users(id),
  score INTEGER DEFAULT 0
);
CREATE TABLE IF NOT EXISTS games_stats (
  id SERIAL PRIMARY KEY,
  user_id INTEGER REFERENCES users(id),
  game_type VARCHAR(50) NOT NULL,
  wins INTEGER DEFAULT 0,
  losses INTEGER DEFAULT 0
);` }
      ] },
    { id: "build", title: "Build and push the images", toc: "Build images",
      lead: "Each service has its own Dockerfile. Build for amd64 nodes and push to a registry the cluster can reach.",
      blocks: [
        { type: "steps", steps: [
          { title: "Clone the course repo", where: "Laptop", why: "All manifests and source live in one MIT-licensed repository.", code: "git clone https://github.com/saiyam1814/Kubernetes-crash-course-2025\ncd Kubernetes-crash-course-2025" },
          { title: "Run locally (optional)", where: "Laptop", why: "The repo ships scripts to run Postgres in Docker and the services on your machine, so you can see the app before Kubernetes.", code: "./start-local.sh     # frontend :3000, auth :8080, game :8081\n./test-local.sh\n./stop-local.sh" },
          { title: "Build all three images", where: "Laptop", why: "<code>--platform linux/amd64</code> avoids exec-format errors on cloud nodes. ttl.sh images expire after the tag's duration.", code: "docker buildx build --platform linux/amd64 -t ttl.sh/game-service:1h --push ./game-service\ndocker buildx build --platform linux/amd64 -t ttl.sh/auth-service:1h --push ./auth-service\ndocker buildx build --platform linux/amd64 -t ttl.sh/frontend:1h     --push ./frontend" },
          { title: "Point manifests at your images", where: "Laptop", why: "Replace the image in each Deployment with your tag, or use <code>kubectl set image</code> after applying.", code: "kubectl set image deploy/auth-service auth-service=ttl.sh/auth-service:1h -n crash-course" }
        ] }
      ] },
    { id: "map", title: "How the app maps to Kubernetes", toc: "Kubernetes map",
      lead: "This is the whole course on one table. Every row is a later topic.",
      blocks: [
        { type: "table", head: ["Need", "Kubernetes object", "Course file"], rows: [
          ["Group everything", "<code>Namespace</code> crash-course", "—"],
          ["Run 3 services with replicas", "<code>Deployment</code> ×3", "auth-deploy.yaml, game-deploy.yaml, frontend.yaml"],
          ["Stable internal addresses", "<code>Service</code> (ClusterIP) ×3", "auth-service.yaml, game-service.yaml, frontend-service.yaml"],
          ["Highly available Postgres", "CloudNativePG <code>Cluster</code> (CRD)", "pgcluster.yaml"],
          ["DB schema at bootstrap", "<code>ConfigMap</code> init-sql", "configmap.yaml"],
          ["DB credentials", "<code>Secret</code> postgres-app (created by operator)", "—"],
          ["Public HTTPS entry point", "<code>Gateway</code> + <code>HTTPRoute</code>", "gateway.yaml, httproute.yaml, httpredirect.yaml"],
          ["TLS certificate", "cert-manager <code>ClusterIssuer</code>", "cluster-issuer.yaml"],
          ["Metrics scraping", "<code>ServiceMonitor</code>", "servicemonitor.yaml"]
        ] },
        { type: "callout", kind: "tip", html: "Keep this table open. When a later topic feels abstract, find its row here and look at the real manifest in the course repo." }
      ] }
  ],
  summary: {
    takeaways: [
      ["🧩", "4 components", "nginx-served React frontend, two Flask APIs, PostgreSQL."],
      ["🔀", "nginx routes /api", "/api/auth → auth-service:8080, /api/game → game-service:8081."],
      ["🔑", "Config via env", "Both APIs read POSTGRES_HOST/DB/USER/PASSWORD, filled from a Secret."],
      ["🏗️", "Build for amd64", "docker buildx --platform linux/amd64 --push."],
      ["🗺️", "One object per need", "Deployment, Service, ConfigMap, Secret, Gateway, HTTPRoute, CRDs."],
      ["📏", "Requests vs limits", "Requests place Pods; limits cap them."]
    ],
    cheat: `kubectl create ns crash-course
kubectl apply -f manifests/auth-deploy.yaml -f manifests/game-deploy.yaml -f manifests/frontend.yaml
kubectl apply -f manifests/auth-service.yaml -f manifests/game-service.yaml -f manifests/frontend-service.yaml
kubectl get deploy,svc,pods -n crash-course
kubectl port-forward svc/frontend 8080:80 -n crash-course   # open http://localhost:8080`,
    quiz: [
      ["Which component serves the React files?", ["auth-service", "nginx in the frontend Pod", "CoreDNS", "PostgreSQL"], 1, "The frontend image builds React to static files and serves them with nginx."],
      ["How does auth-service find the database?", ["Hard-coded Pod IP", "The DNS name postgres-rw.crash-course.svc.cluster.local", "NodePort 30000", "An environment file on the node"], 1, "Service DNS names stay stable while Pod IPs change."],
      ["Where do the DB credentials come from?", ["Plain text in the Deployment", "A Secret (postgres-app) referenced with secretKeyRef", "A ConfigMap", "The Dockerfile"], 1, "secretKeyRef injects a Secret key as an environment variable."],
      ["What does a memory limit of 128Mi do?", ["Reserves 128Mi on the node", "Caps the container; exceeding it causes OOMKill", "Sets the JVM heap", "Nothing"], 1, "Limits are enforced by cgroups. Requests are what the scheduler reserves."]
    ]
  }
});
</script>
</body>
</html>
