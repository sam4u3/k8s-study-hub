<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cluster Lifecycle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
// Version skew checker + upgrade path planner.
const skewHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>kube-apiserver 1.<input class="input" type="number" min="25" max="40" value="37" id="sA" style="width:80px;display:inline-block"></label>
    <label>controller-manager / scheduler 1.<input class="input" type="number" min="25" max="40" value="36" id="sC" style="width:80px;display:inline-block"></label>
    <label>kubelet 1.<input class="input" type="number" min="25" max="40" value="34" id="sK" style="width:80px;display:inline-block"></label>
    <label>kubectl 1.<input class="input" type="number" min="25" max="40" value="38" id="sT" style="width:80px;display:inline-block"></label>
  </div>
  <div class="pipe-out" id="sOut"></div>
</div>`;
function initSkew(el) {
  const $ = s => el.querySelector(s);
  const go = () => {
    const a = +$("#sA").value, c = +$("#sC").value, k = +$("#sK").value, t = +$("#sT").value;
    const r = [
      [c <= a && c >= a - 1, `controller-manager/scheduler 1.${c}: must be 1.${a - 1}–1.${a} (not newer than apiserver, ≤1 older)`],
      [k <= a && k >= a - 3, `kubelet 1.${k}: must be 1.${a - 3}–1.${a} (never newer, up to 3 minors older)`],
      [Math.abs(t - a) <= 1, `kubectl 1.${t}: must be within ±1 minor of apiserver (1.${a - 1}–1.${a + 1})`]
    ];
    $("#sOut").innerHTML = r.map(([ok, m]) => `${ok ? '<span style="color:var(--green)">✓</span>' : '<span style="color:var(--red)">✗</span>'} ${m}`).join("<br>");
  };
  el.querySelectorAll("input").forEach(i => i.oninput = go); go();
}
const planHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>current 1.<input class="input" type="number" min="25" max="40" value="34" id="pFrom" style="width:80px;display:inline-block"></label>
    <label>target 1.<input class="input" type="number" min="25" max="40" value="37" id="pTo" style="width:80px;display:inline-block"></label>
  </div>
  <div class="pipe-out" id="pOut"></div>
</div>`;
function initPlan(el) {
  const $ = s => el.querySelector(s);
  const go = () => {
    const f = +$("#pFrom").value, t = +$("#pTo").value;
    if (t <= f) { $("#pOut").innerHTML = '<span class="muted">target must be newer; downgrades are not supported by kubeadm</span>'; return; }
    const steps = []; for (let v = f + 1; v <= t; v++) steps.push(v);
    $("#pOut").innerHTML = `<b>${steps.length} upgrade${steps.length > 1 ? "s" : ""}, one minor at a time:</b><br>` + steps.map((v, i) =>
      `${i + 1}. 1.${v - 1} → 1.${v}: switch pkgs.k8s.io repo to v1.${v}; kubeadm upgrade apply v1.${v}.x on first CP; upgrade node on other CPs; kubelet+kubectl on CPs; then drain/upgrade/uncordon workers` +
      (i === 0 ? "" : `<span class="faint"> (kubelets may lag: you could leave workers until later, as long as they stay ≤3 minors behind)</span>`)).join("<br>") +
      `<br><span class="faint">Read each version's release notes for removed APIs first (kubectl convert, pluto, or kube-no-trouble help find them).</span>`;
  };
  el.querySelectorAll("input").forEach(i => i.oninput = go); go();
}

K8S_RENDER({
  id: "35-lifecycle", group: "operations", minutes: 35,
  title: 'Cluster lifecycle: <span class="grad-text">upgrades</span>, certificates & etcd',
  lead: "A cluster is never 'done'. Three minor releases a year, each supported about 14 months, certificates that expire after a year, and an etcd that holds everything. This is the day-2 runbook for kubeadm clusters.",
  parts: [["Release & skew", "What may run with what"], ["Upgrade with kubeadm", "Step by step"], ["Certificates", "Expiry and renewal"], ["etcd backup", "Snapshot & restore"], ["Node care", "Swap, maintenance"]],
  sections: [
    { id: "skew", title: "Release cycle and version skew", toc: "Release & skew",
      blocks: [
        { type: "cards", cols: 3, items: [
          ["📅", "3 releases a year", "e.g. v1.36 (April 2026), v1.37 (August 2026). Each minor gets patch releases for about 14 months."],
          ["🔢", "Upgrade one minor at a time", "kubeadm only supports N → N+1 for the control plane. Skipping is not supported."],
          ["🧭", "Control plane first", "API server first, then controller-manager/scheduler, then kubelets. Kubelets must never be newer than the API server."]
        ] },
        { type: "h3", text: "Version skew checker" },
        { type: "custom", html: skewHtml, init: initSkew }
      ] },
    { id: "upgrade", title: "Upgrade a kubeadm cluster", toc: "Upgrade with kubeadm",
      blocks: [
        { type: "custom", html: planHtml, init: initPlan },
        { type: "steps", steps: [
          { title: "Prepare", where: "Everywhere", why: "Back up etcd, read the release notes (removed APIs, deprecated flags), check add-on compatibility (CNI, CSI, ingress/gateway).", code: "sudo ETCDCTL_API=3 etcdctl snapshot save /backup/pre-upgrade.db …\nkubectl get --raw /metrics | grep apiserver_requested_deprecated_apis   # who still uses deprecated APIs" },
          { title: "Switch the package repo", where: "All nodes", why: "pkgs.k8s.io has one repository per minor version. Point apt at the next one.", code: "sudo sed -i 's|/v1.36/|/v1.37/|' /etc/apt/sources.list.d/kubernetes.list\ncurl -fsSL https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg --yes\nsudo apt-get update && apt-cache madison kubeadm | head -3" },
          { title: "Upgrade kubeadm, plan", where: "First control plane", whereClass: "violet", why: "<code>upgrade plan</code> checks health and shows what will change, including component configs that need manual upgrade.", code: "sudo apt-mark unhold kubeadm && sudo apt-get install -y kubeadm='1.37.*' && sudo apt-mark hold kubeadm\nkubeadm version\nsudo kubeadm upgrade plan" },
          { title: "Apply", where: "First control plane", whereClass: "violet", why: "Upgrades static Pod manifests one by one (etcd, apiserver, controller-manager, scheduler), renews certificates by default, and upgrades CoreDNS and kube-proxy.", code: "sudo kubeadm upgrade apply v1.37.1\n# [upgrade/successful] SUCCESS! Your cluster was upgraded to \"v1.37.1\"" },
          { title: "Other control planes", where: "Other control planes", whereClass: "violet", why: "<code>upgrade node</code> (not apply) on the rest.", code: "sudo apt-get install -y kubeadm='1.37.*'\nsudo kubeadm upgrade node" },
          { title: "kubelet & kubectl on each node", where: "Each node in turn", whereClass: "green", why: "Drain first so workloads move away; PDBs control the pace.", code: "kubectl drain wk1 --ignore-daemonsets --delete-emptydir-data\n# on wk1:\nsudo apt-mark unhold kubeadm kubelet kubectl\nsudo apt-get install -y kubeadm='1.37.*' kubelet='1.37.*' kubectl='1.37.*'\nsudo kubeadm upgrade node          # updates local kubelet config\nsudo apt-mark hold kubeadm kubelet kubectl\nsudo systemctl daemon-reload && sudo systemctl restart kubelet\n# back on a control plane:\nkubectl uncordon wk1" },
          { title: "Verify", where: "Cluster", whereClass: "green", why: "All nodes report the new version; system Pods healthy; your app's smoke tests pass.", code: "kubectl get nodes\nkubectl get pods -n kube-system\nkubectl version" }
        ] }
      ] },
    { id: "certs", title: "Certificates", toc: "Certificates",
      blocks: [
        { type: "table", head: ["Certificate", "Default validity", "Renewal"], rows: [
          ["Cluster CAs (ca, etcd/ca, front-proxy-ca)", "10 years", "Manual CA rotation (rare, involved)"],
          ["apiserver, apiserver-kubelet-client, etcd server/peer, front-proxy-client", "1 year", "<code>kubeadm certs renew</code> or automatically on every <code>kubeadm upgrade</code>"],
          ["admin.conf, super-admin.conf, controller-manager.conf, scheduler.conf", "1 year", "<code>kubeadm certs renew</code>"],
          ["kubelet client cert", "1 year", "Rotated automatically by kubelet via CSR (auto-approved)"],
          ["kubelet serving cert", "self-signed by default", "Enable <code>serverTLSBootstrap</code> + approve CSRs for CA-signed serving certs"]
        ] },
        { type: "term", title: "check and renew", lines: [
          "$ sudo kubeadm certs check-expiration",
          "CERTIFICATE                EXPIRES                  RESIDUAL TIME   CERTIFICATE AUTHORITY",
          "admin.conf                 Oct 12, 2027 10:01 UTC   363d            ca",
          "apiserver                  Oct 12, 2027 10:01 UTC   363d            ca",
          "$ sudo kubeadm certs renew all",
          "$ # restart control-plane static Pods so they load new certs:",
          "$ sudo mv /etc/kubernetes/manifests/*.yaml /tmp/ && sleep 20 && sudo mv /tmp/*.yaml /etc/kubernetes/manifests/",
          "$ sudo cp /etc/kubernetes/admin.conf ~/.kube/config",
          "✓ upgrading at least once a year renews them automatically"
        ] },
        { type: "callout", kind: "warn", html: "The most common 'cluster suddenly dead' story: nobody upgraded for a year, certificates expired, kubectl says <code>x509: certificate has expired or is not yet valid</code>. Put <code>kubeadm certs check-expiration</code> in monitoring." }
      ] },
    { id: "etcd", title: "etcd backup and restore", toc: "etcd backup",
      blocks: [
        { type: "steps", steps: [
          { title: "Snapshot", where: "Control plane", whereClass: "violet", why: "A consistent point-in-time copy of every object. Schedule it (CronJob or systemd timer) and copy it off the node.", code: "export ETCDCTL_API=3\nsudo etcdctl --endpoints=https://127.0.0.1:2379 \\\n  --cacert=/etc/kubernetes/pki/etcd/ca.crt \\\n  --cert=/etc/kubernetes/pki/etcd/server.crt \\\n  --key=/etc/kubernetes/pki/etcd/server.key \\\n  snapshot save /backup/etcd-$(date +%F-%H%M).db\nsudo etcdutl snapshot status /backup/etcd-*.db -w table" },
          { title: "Restore to a new data dir", where: "Control plane", whereClass: "violet", why: "<code>etcdutl snapshot restore</code> builds a fresh data directory with new cluster membership. Never restore over the live dir.", code: "sudo etcdutl snapshot restore /backup/etcd-2026-10-13-0200.db \\\n  --data-dir /var/lib/etcd-restored" },
          { title: "Point etcd at it", where: "Control plane", whereClass: "violet", why: "Edit the etcd static Pod's hostPath volume. The kubelet restarts etcd with the restored data; the API server reconnects.", code: "sudo sed -i 's|path: /var/lib/etcd$|path: /var/lib/etcd-restored|' /etc/kubernetes/manifests/etcd.yaml\nwatch crictl ps | grep etcd\nkubectl get pods -A     # state as of the snapshot" },
          { title: "Afterwards", where: "Cluster", whereClass: "green", why: "Controllers reconcile from the restored state: objects created after the snapshot are gone, and PVs/cloud resources may need cleanup. For HA etcd restore every member from the same snapshot.", code: "kubectl get nodes\nkubectl get events -A --sort-by=.lastTimestamp | tail" }
        ] },
        { type: "callout", kind: "info", html: "etcd backups capture Kubernetes objects, not volume data. Use Velero (objects + volume snapshots) or operator-level backups (CNPG) for applications. Managed clusters back up etcd for you, but not your PVs." }
      ] },
    { id: "nodes", title: "Node care: swap and maintenance", toc: "Node care",
      blocks: [
        { type: "cards", cols: 3, items: [
          ["💤", "Swap (stable since v1.34)", "kubelet can use swap with <code>memorySwap.swapBehavior: LimitedSwap</code>: only Burstable Pods may swap, proportionally to their memory request. Default is NoSwap; preflight still expects swap off unless configured."],
          ["🧹", "Image & container GC", "kubelet deletes unused images when disk usage passes <code>imageGCHighThresholdPercent</code> (85%) down to the low threshold (80%)."],
          ["🔁", "Reserve resources", "Set <code>systemReserved</code> and <code>kubeReserved</code> so system daemons keep CPU/memory; allocatable = capacity − reserved − eviction threshold."]
        ] }
      ] }
  ],
  summary: {
    takeaways: [
      ["1️⃣", "One minor at a time", "Control plane N → N+1, then nodes."],
      ["🧭", "Skew rules", "kubelet ≤ apiserver, up to 3 older; kubectl ±1."],
      ["🔐", "Certs expire yearly", "kubeadm certs check-expiration; upgrades renew them."],
      ["💾", "etcd snapshots", "etcdctl snapshot save; restore to a new data dir."],
      ["📦", "Objects ≠ data", "Back up volumes separately (Velero, operators)."],
      ["💤", "Swap is GA", "LimitedSwap for Burstable Pods (v1.34)."]
    ],
    cheat: `sudo kubeadm upgrade plan
sudo kubeadm upgrade apply v1.37.x     # first CP
sudo kubeadm upgrade node              # other nodes
kubectl drain <n> --ignore-daemonsets; kubectl uncordon <n>
sudo kubeadm certs check-expiration; sudo kubeadm certs renew all
sudo etcdctl … snapshot save /backup/etcd.db
sudo etcdutl snapshot restore /backup/etcd.db --data-dir /var/lib/etcd-restored`,
    quiz: [
      ["Can you upgrade a kubeadm cluster from 1.34 straight to 1.37?", ["Yes", "No, one minor at a time", "Only workers", "Only with HA"], 1, "Three separate upgrades."],
      ["API server is 1.37. Oldest supported kubelet?", ["1.36", "1.35", "1.34", "1.33"], 2, "Up to three minors older."],
      ["kubectl reports 'x509: certificate has expired'. Likely fix?", ["Reinstall cluster", "kubeadm certs renew all and restart control-plane Pods", "Delete kube-proxy", "Restart CoreDNS"], 1, "Then refresh your kubeconfig."],
      ["Does an etcd snapshot back up PostgreSQL data on PVCs?", ["Yes", "No, only Kubernetes objects", "Only metadata of volumes and their data", "Only on SKS"], 1, "Use volume/operator backups for data."]
    ]
  }
});
</script>
</body>
</html>
