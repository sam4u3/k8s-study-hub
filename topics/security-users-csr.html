const $ = s => document.querySelector(s);
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const codeBox = (t, c) => K8S_CODE(t, c);

const FLOW = [
    ["🔑", "Private key", "1 · Generate a private key", "jane creates <code>jane.key</code> locally. The private key never leaves her machine; that is the whole point of a CSR."],
    ["📝", "CSR file", "2 · Create a signing request", "<code>openssl req</code> builds <code>jane.csr</code> with subject <code>/CN=jane/O=dev-team</code>. CN becomes the username, O becomes a group."],
    ["📤", "CSR object", "3 · Submit to Kubernetes", "An admin wraps the base64 CSR in a <code>CertificateSigningRequest</code> with <code>signerName: kubernetes.io/kube-apiserver-client</code> and <code>usages: [client auth]</code>. Status: Pending."],
    ["✅", "Approve", "4 · Admin approves", "<code>kubectl certificate approve jane</code> adds an Approved condition. Approving requires the <code>approve</code> verb on the signer, so not everyone can do it."],
    ["🏛️", "Sign (CA)", "5 · Controller signs", "The csrsigning controller in <b>kube-controller-manager</b> signs it with the cluster CA (<code>/etc/kubernetes/pki/ca.key</code>) and writes the cert to <code>.status.certificate</code>."],
    ["📜", "jane.crt", "6 · Retrieve the certificate", "Decode <code>.status.certificate</code> to <code>jane.crt</code>. Valid until <code>expirationSeconds</code> runs out."],
    ["🛡️", "RBAC", "7 · Grant permissions", "Authenticated is not authorised. Without a Role + RoleBinding, every request from jane is <b>Forbidden</b>. Bind <code>pod-reader</code> in namespace <code>dev</code>."],
    ["🚀", "kubeconfig", "8 · Use it", "Put cluster CA, <code>jane.crt</code> and <code>jane.key</code> in a kubeconfig. kubectl presents the cert in the TLS handshake; the API server reads CN/O and RBAC decides."]
  ];
const CSTEPS = [
    { title: "Key + CSR", where: "jane's machine", whereClass: "green", why: "The user generates the key pair. Only the public part goes to the cluster inside the CSR. O= sets group membership; add several /O= for several groups.", code:
`openssl genrsa -out jane.key 2048
openssl req -new -key jane.key -out jane.csr \\
  -subj "/CN=jane/O=dev-team"

openssl req -in jane.csr -noout -subject   # subject=CN = jane, O = dev-team` },
    { title: "Submit CSR object", where: "Admin", whereClass: "violet", why: "signerName kubernetes.io/kube-apiserver-client is the built-in signer for client certs the API server trusts. expirationSeconds keeps the cert short-lived (minimum 600 s).", code:
`cat <<EOF | kubectl apply -f -
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: jane
spec:
  request: $(base64 < jane.csr | tr -d '\\n')
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 86400    # 24h
  usages:
  - client auth
EOF

kubectl get csr jane     # CONDITION: Pending` },
    { title: "Approve", where: "Admin", whereClass: "violet", why: "Approval is a separate RBAC permission (update on certificatesigningrequests/approval plus approve on the signer). Always inspect the subject before approving: approving O=system:masters would hand out cluster-admin.", code:
`kubectl get csr jane -o jsonpath='{.spec.request}' | base64 -d | openssl req -noout -subject
kubectl certificate approve jane
kubectl get csr jane     # CONDITION: Approved,Issued` },
    { title: "Extract certificate", where: "Admin", whereClass: "violet", why: "The signed cert lives in .status.certificate, base64 encoded. CSR objects are garbage-collected (approved ones after about 1 hour), so extract it promptly.", code:
`kubectl get csr jane -o jsonpath='{.status.certificate}' | base64 -d > jane.crt
openssl x509 -in jane.crt -noout -subject -issuer -dates
# issuer=CN = kubernetes   notAfter=… (+24h)` },
    { title: "RBAC Role + binding", where: "Admin", whereClass: "violet", why: "A Role is namespaced permissions; a RoleBinding attaches it to a subject. Use ClusterRole + ClusterRoleBinding for cluster-wide rights. Binding the group instead of the user scales better.", code:
`kubectl create namespace dev

kubectl create role pod-reader -n dev \\
  --verb=get,list,watch,create --resource=pods

kubectl create rolebinding jane-pod-reader -n dev \\
  --role=pod-reader --user=jane
# alternative: --group=dev-team

kubectl auth can-i list pods -n dev --as=jane      # yes
kubectl auth can-i delete pods -n dev --as=jane    # no` },
    { title: "Build kubeconfig", where: "Admin → jane", whereClass: "violet", why: "A kubeconfig joins three things: cluster (server + CA), user (cert + key) and context (cluster + user + default namespace). --embed-certs makes it a single portable file.", code:
`CLUSTER=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}')
SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')
kubectl config view --raw --minify \\
  -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > ca.crt

export KCFG=jane.kubeconfig
kubectl config --kubeconfig=$KCFG set-cluster $CLUSTER \\
  --server=$SERVER --certificate-authority=ca.crt --embed-certs=true
kubectl config --kubeconfig=$KCFG set-credentials jane \\
  --client-certificate=jane.crt --client-key=jane.key --embed-certs=true
kubectl config --kubeconfig=$KCFG set-context jane@$CLUSTER \\
  --cluster=$CLUSTER --user=jane --namespace=dev
kubectl config --kubeconfig=$KCFG use-context jane@$CLUSTER` },
    { title: "Test as jane", where: "jane's machine", whereClass: "green", why: "kubectl auth whoami shows exactly what the API server authenticated: username and groups (plus system:authenticated). Any Forbidden error means authentication worked and RBAC said no.", code:
`export KUBECONFIG=$PWD/jane.kubeconfig

kubectl auth whoami
# Username  jane
# Groups    [dev-team system:authenticated]

kubectl get pods                      # allowed (namespace dev)
kubectl run web --image=nginx         # allowed (create pods)
kubectl get pods -n default           # Error: Forbidden
kubectl delete pod web                # Error: Forbidden
kubectl auth can-i --list             # everything jane may do` },
    { title: "Clean up / revoke", where: "Admin", whereClass: "violet", why: "Deleting the binding removes authorisation immediately. The certificate itself stays valid until it expires; that is why short expiry matters.", code:
`kubectl delete rolebinding jane-pod-reader -n dev
kubectl delete role pod-reader -n dev
kubectl delete csr jane
rm jane.key jane.csr jane.crt jane.kubeconfig ca.crt` }

function initSim() {
  /* Request pipeline simulator */
  const STAGES = [["TLS + AuthN", "x509: CN / O"], ["AuthZ", "RBAC"], ["Mutating", "admission"], ["Schema", "validation"], ["Validating", "admission"], ["etcd", "persist / read"]];
  $("#pipeRow").innerHTML = STAGES.map(s => `<div class="stage"><b>${s[0]}</b><small>${s[1]}</small></div>`).join("");
  let pipeBusy = false;
  $("#ciSend").onclick = () => {
    if (pipeBusy) return; pipeBusy = true;
    const verb = $("#ciVerb").value, res = $("#ciRes").value, ns = $("#ciNs").value;
    const allowed = ns === "dev" && res === "pods" && ["get", "list", "watch", "create"].includes(verb);
    const write = ["create", "update", "delete"].includes(verb);
    const stages = [...$("#pipeRow").children];
    stages.forEach(s => s.className = "stage");
    const out = $("#pipeOut");
    const group = res === "pods" || res === "services" || res === "secrets" ? "/api/v1" : "/apis/apps/v1";
    out.innerHTML = `<span class="faint">→ ${verb.toUpperCase()} ${group}/namespaces/${ns}/${res}  (user=jane, groups=[dev-team, system:authenticated])</span>`;
    const path = [0, 1].concat(allowed ? (write ? [2, 3, 4, 5] : [5]) : []);
    let k = 0;
    const tick = () => {
      if (k > 0) stages[path[k - 1]].className = "stage pass";
      if (k === path.length) {
        out.innerHTML += allowed
          ? `<br><span style="color:var(--green)">✓ ${write ? "201 Created / 200 OK" : "200 OK"}: RBAC rule matched Role dev/pod-reader${write ? "; admission chain passed" : ""}</span>`
          : "";
        pipeBusy = false; return;
      }
      const idx = path[k];
      if (idx === 1 && !allowed) {
        stages[1].className = "stage deny";
        out.innerHTML += `<br><span style="color:var(--red)">✗ 403 Forbidden: User "jane" cannot ${verb} resource "${res}" in API group "${group === "/api/v1" ? "" : "apps"}" in the namespace "${ns}"</span>`;
        pipeBusy = false; return;
      }
      stages[idx].className = "stage hit";
      k++; setTimeout(tick, 550);
    };
    setTimeout(tick, 250);
  };
}
