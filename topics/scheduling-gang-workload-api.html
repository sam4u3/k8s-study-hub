<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gang Scheduling</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
<style>
  .gnodes { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 6px 0 12px; }
  .gnode { padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: rgba(255,255,255,.03); min-width: 0; }
  .gnode b { display: block; font: 600 12px var(--mono); margin-bottom: 8px; }
  .gslots { display: flex; gap: 6px; flex-wrap: wrap; }
  .gslot { width: 26px; height: 26px; border-radius: 7px; border: 1px dashed rgba(255,255,255,.18); display: grid; place-items: center; font: 600 11px var(--mono); transition: background .3s, transform .3s; }
  .gslot.a { background: var(--k8s); border: 0; color: #fff; transform: scale(1.06); }
  .gslot.b { background: var(--violet, #a78bfa); border: 0; color: #fff; transform: scale(1.06); }
  .gjobs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .gjob { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); font-size: 13px; min-width: 0; }
  .gjob h5 { margin: 0 0 4px; font-size: 14px; }
  @media (max-width: 560px) { .gjobs { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
// Gang simulator: two training Jobs compete for GPU slots, scheduled pod-by-pod or as gangs.
const gHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>Free GPU slots in the cluster: <b id="gsV">6</b><input class="input" type="range" min="2" max="12" step="1" value="6" id="gs"></label>
    <label>Workers per Job (gang minCount): <b id="gwV">4</b><input class="input" type="range" min="2" max="6" step="1" value="4" id="gw"></label>
  </div>
  <div class="ctrl" style="margin:0 0 12px">
    <button class="btn" id="gPod">Schedule pod-by-pod (default)</button>
    <button class="btn primary" id="gGang">Schedule as gangs</button>
    <button class="btn small" id="gFree">Job A finishes (free its slots)</button>
  </div>
  <div class="gnodes" id="gNodes"></div>
  <div class="gjobs" id="gJobs"></div>
  <div class="pipe-out" id="gOut"></div>
</div>`;
function initGang(el) {
  const $ = s => el.querySelector(s);
  let slots = [], mode = null, aDone = false;
  const S = () => +$("#gs").value, W = () => +$("#gw").value;
  const count = j => slots.filter(x => x === j).length;
  const draw = () => {
    const perNode = 2, nodes = Math.ceil(slots.length / perNode);
    $("#gNodes").innerHTML = Array.from({ length: nodes }, (_, n) => `<div class="gnode"><b>gpu-node-${n + 1}</b><div class="gslots">${slots.slice(n * perNode, n * perNode + perNode).map(x => `<span class="gslot ${x ? x.toLowerCase() : ""}">${x || ""}</span>`).join("")}</div></div>`).join("");
    const w = W();
    $("#gJobs").innerHTML = ["A", "B"].map(j => {
      const c = count(j), ok = c >= w;
      const state = j === "A" && aDone ? '<span style="color:var(--green)">✓ completed, GPUs released</span>'
        : !mode ? '<span class="faint">waiting to be scheduled</span>'
        : ok ? '<span style="color:var(--green)">✓ running: all workers placed, training progresses</span>'
        : c ? `<span style="color:var(--red)">✗ stuck: ${c}/${w} workers hold GPUs but cannot start (needs all ${w})</span>`
        : `<span style="color:var(--amber)">⏳ pending: no Pods bound, no GPUs held</span>`;
      return `<div class="gjob glass"><h5>Job ${j} <span class="faint" style="font-weight:400">· ${w} workers</span></h5>${c}/${w} Pods bound<br>${state}</div>`;
    }).join("");
  };
  const reset = () => { slots = Array(S()).fill(null); mode = null; aDone = false; draw(); $("#gOut").innerHTML = '<span class="faint"># Two Jobs submitted at the same time. Each needs every worker running to make progress.</span>'; };
  const place = j => { const i = slots.indexOf(null); if (i < 0) return false; slots[i] = j; return true; };
  $("#gPod").onclick = () => {
    reset(); mode = "pod";
    // The default scheduler pops Pods one at a time; with two Jobs arriving together their Pods interleave.
    for (let k = 0; k < W(); k++) { place("A"); place("B"); }
    draw();
    const a = count("A"), b = count("B"), w = W();
    $("#gOut").innerHTML = a < w && b < w
      ? `<span style="color:var(--red)">Deadlock: A holds ${a} and B holds ${b} GPUs. Neither Job can start, and neither will release its GPUs.</span>`
      : b < w ? `<span style="color:var(--amber)">A runs, but B holds ${b} GPUs it can't use until A finishes. That capacity is wasted.</span>`
      : `<span style="color:var(--green)">Enough capacity for both this time. Lower the free slots to see the deadlock.</span>`;
  };
  const gangCycle = j => {
    // PodGroup scheduling cycle: assume placements for the whole group, then decide atomically.
    const free = slots.filter(x => !x).length, want = W() - count(j);
    if (want <= 0) return `PodGroup ${j}: already scheduled`;
    if (count(j) + Math.min(want, free) >= W()) { for (let k = 0; k < want; k++) place(j); return `<span style="color:var(--green)">PodGroup ${j}: ${W()} placements found, minCount ${W()} met, Pods bound</span>`; }
    return `<span style="color:var(--amber)">PodGroup ${j}: only ${free} of ${want} placements possible, below minCount ${W()}; no Pods bound, group moved to the unschedulable queue</span>`;
  };
  $("#gGang").onclick = () => { reset(); mode = "gang"; const m = [gangCycle("A"), gangCycle("B")]; draw(); $("#gOut").innerHTML = m.join("<br>"); };
  $("#gFree").onclick = () => {
    if (!mode || aDone) return;
    if (count("A") < W()) { $("#gOut").innerHTML = '<span class="faint">Job A never started, so it can\'t finish. That is the deadlock.</span>'; return; }
    aDone = true;
    slots = slots.map(x => x === "A" ? null : x);
    const msg = mode === "gang" ? gangCycle("B") : `Pod-by-pod: B's pending Pods now take the free slots one by one.${(() => { while (count("B") < W() && place("B")); return ""; })()}`;
    draw(); $("#gOut").innerHTML = `Job A completed and released its GPUs.<br>${msg}`;
  };
  ["gs", "gw"].forEach(i => $("#" + i).oninput = () => { $("#" + i + "V").textContent = $("#" + i).value; reset(); });
  reset();
}

K8S_RENDER({
  id: "sched-gang", group: "scheduling", minutes: 25,
  title: '<span class="grad-text">Gang scheduling</span>: Workload API & PodGroups',
  lead: "Distributed training and MPI jobs only make progress when every worker runs at once. Gang scheduling places a group of Pods all-or-nothing, so half-started jobs stop hoarding GPUs.",
  parts: [["Deadlock simulator", "Pod-by-pod vs gang"], ["The objects", "Workload, PodGroup, Pod"], ["Scheduling cycle", "Quorum, atomic decision, preemption"], ["Policies & disruption", "basic, gang, Single, All"], ["Topology & hierarchy", "Racks, zones, CompositePodGroup"]],
  sections: [
    { id: "sim", title: "Why pod-by-pod scheduling deadlocks", toc: "Deadlock simulator",
      lead: "The default scheduler evaluates one Pod at a time. Two gang-shaped Jobs submitted together can each grab part of the cluster, and then both wait forever.",
      blocks: [
        { type: "custom", html: gHtml, init: initGang },
        { type: "callout", kind: "info", html: "Try 6 slots and 4 workers. Pod-by-pod leaves A and B with 3 GPUs each and neither starts. As gangs, A gets all 4 and B waits without holding anything, then starts as soon as A finishes." }
      ] },
    { id: "objects", title: "Workload, PodGroup and Pod", toc: "The objects",
      lead: "Three objects split policy from runtime state. A controller creates them in this order; the Job controller is the only built-in controller that does it today.",
      blocks: [
        { type: "flow", nodes: [
          ["📜", "Workload", "Workload: the policy template", "Long-lived and immutable. Lists up to 8 <code>podGroupTemplates</code>, each with a scheduling policy (<code>basic</code> or <code>gang</code>), and optionally a priority class and disruption mode. It tracks no runtime state."],
          ["👥", "PodGroup", "PodGroup: the runtime instance", "Created from a template, with the policy copied in, so it is self-contained. Carries the scheduling status (<code>PodGroupInitiallyScheduled</code> condition). A finalizer blocks deletion while its Pods still run."],
          ["📦", "Pods", "Pods join the group", "Each Pod sets <code>spec.schedulingGroup.podGroupName</code>. The field is immutable. A Pod whose PodGroup doesn't exist yet stays pending until it appears."],
          ["🧠", "Scheduler", "kube-scheduler schedules the group", "The scheduler queues the PodGroup, not the individual Pods, and makes one atomic decision for all of them."]
        ] },
        { type: "tabs", tabs: [
          { label: "Workload", blocks: [{ type: "yaml", title: "Workload (scheduling.k8s.io/v1beta1)", lines: [
            ["apiVersion: scheduling.k8s.io/v1beta1", "Beta API group in v1.37. It must be enabled along with the GenericWorkload feature gate."],
            ["kind: Workload"],
            ["metadata:"],
            ["  name: training-job-workload"],
            ["  namespace: some-ns"],
            ["spec:"],
            ["  controllerRef:", "Points back at the object that owns the app (here a Job). Used for observability, not for scheduling."],
            ["    apiGroup: batch"],
            ["    kind: Job"],
            ["    name: training-job"],
            ["  podGroupTemplates:", "Distinct parts of the workload, e.g. driver and workers. Max 8. The whole spec is immutable."],
            ["  - name: workers"],
            ["    schedulingPolicy:"],
            ["      gang:", "All-or-nothing: the group is feasible only if minCount Pods can run together."],
            ["        minCount: 4"],
            ["    priorityClassName: high-priority", "Group priority, authoritative for every Pod in the group during preemption and queue ordering."],
            ["    disruptionMode:"],
            ["      all: {}", "Preempt the whole group together, never one Pod at a time."]
          ] }] },
          { label: "PodGroup", blocks: [{ type: "code", title: "podgroup.yaml (standalone, user-managed)", code: `apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: training-worker-0
  namespace: default
spec:
  schedulingPolicy:
    gang:
      minCount: 4
  # optional when created from a Workload:
  # podGroupTemplateRef:
  #   workload:
  #     workloadName: training-policy
  #     podGroupTemplateName: worker` }] },
          { label: "Pod", blocks: [{ type: "code", title: "pod.yaml", code: `apiVersion: v1
kind: Pod
metadata:
  name: worker-0
spec:
  schedulingGroup:
    podGroupName: training-worker-0   # immutable once set
  containers:
  - name: ml-worker
    image: training:v1` }] },
          { label: "Job (easiest)", blocks: [
            { type: "code", title: "job.yaml with .spec.scheduling (WorkloadWithJob, alpha)", code: `apiVersion: batch/v1
kind: Job
metadata:
  name: distributed-training
  namespace: training
spec:
  parallelism: 8
  completions: 8
  completionMode: Indexed
  scheduling:
    schedulingPolicy:
      gang: {}        # minCount omitted -> defaults to parallelism (8)
    disruptionMode:
      all: {}         # the entire group is disrupted together
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: worker
        image: training:v1` },
            { type: "p", html: "With the <code>WorkloadWithJob</code> gate on, the Job controller creates the Workload and PodGroup for you before it creates any Pods. Omitting <code>.spec.scheduling</code> gives the <code>basic</code> policy, which keeps normal pod-by-pod behaviour. Only <code>gang.minCount</code> can change after creation." }
          ] }
        ] }
      ] },
    { id: "cycle", title: "How the scheduler handles a gang", toc: "Scheduling cycle",
      lead: "Instead of one scheduling cycle per Pod, the scheduler runs one PodGroup scheduling cycle for the whole group.",
      blocks: [
        { type: "pipeline", intro: "A PodGroup with gang minCount 4 is submitted. Pick what the cluster looks like.",
          stages: [["PreEnqueue", "PodGroup exists, ≥ minCount Pods"], ["Snapshot", "one consistent cluster view"], ["Place each Pod", "filter + score, assume"], ["PlacementFeasible", "≥ minCount placed?"], ["Bind", "atomic"]],
          scenarios: [
            { label: "Enough capacity", notes: ["quorum met: PodGroup and 4 Pods observed", "snapshot taken for the whole cycle", "4/4 Pods fit and are assumed on nodes", "4 ≥ minCount 4"], out: '<span style="color:var(--green)">✓ all 4 Pods go straight to binding; PodGroupInitiallyScheduled=True</span>' },
            { label: "Only 3 Pods created", path: [0], fail: 0, out: '<span style="color:var(--amber)">⏳ held in PreEnqueue: 3 Pods created, minCount is 4. The group never enters the active queue, so it never holds capacity.</span>' },
            { label: "Not enough room", path: [0, 1, 2, 3], fail: 3, notes: ["quorum met", "snapshot taken", "only 2/4 Pods fit"], out: '<span style="color:var(--red)">✗ 2 < minCount 4: no Pods bound. PodGroupPostFilter runs workload-aware preemption, then the whole group goes back to the queue with backoff.</span>' }
          ] },
        { type: "cards", cols: 3, items: [
          ["🔒", "No partial reservation", "Older add-on schedulers held Pods at a Permit gate while waiting. The PodGroup cycle decides in one pass, so a half-fitting gang never holds capacity."],
          ["➕", "Late Pods", "Pods added after the group is scheduled are evaluated together with the ones already running. Placed + newly feasible must still reach minCount."],
          ["⚠️", "Placement isn't guaranteed", "Pods are tried in a fixed order. Homogeneous groups find a fit if one exists; groups with affinity between members or mixed shapes might not."]
        ] }
      ] },
    { id: "policy", title: "Policies, priority and disruption", toc: "Policies & disruption",
      blocks: [
        { type: "compare", cols: [
          { title: "basic", chip: "best effort", chipClass: "blue", color: "var(--k8s-2)", items: ["Feasible however many Pods fit", "Still evaluated in one PodGroup cycle", "Use for grouping, observability, or group-level constraints without all-or-nothing", "Default for a Job without <code>.spec.scheduling</code>"] },
          { title: "gang", chip: "all-or-nothing", chipClass: "green", color: "var(--green)", items: ["Requires <code>minCount</code>", "Fewer than minCount placeable means nothing is bound", "For tightly coupled training, MPI and batch jobs", "Can drop below minCount at runtime if Pods are evicted later"] }
        ] },
        { type: "compare", cols: [
          { title: "disruptionMode: Single (default)", chip: "per Pod", chipClass: "amber", color: "var(--amber)", items: ["Preemption may remove one Pod from the group", "Fine for groups that tolerate losing a member"] },
          { title: "disruptionMode: All", chip: "whole group", chipClass: "red", color: "var(--red)", items: ["If one Pod must go, all go", "Avoids a gang left limping with too few workers"] }
        ] },
        { type: "p", html: "When a gang can't fit, <b>workload-aware preemption</b> treats the whole PodGroup as one preemptor and looks for victims across the entire cluster, not node by node. It spares more important victims first, in this order:" },
        { type: "table", head: ["Rule", "More important (spared first)"], rows: [
          ["1. Priority", "Higher priority"],
          ["2. Workload type", "A PodGroup beats a single Pod of the same priority"],
          ["3. Group size", "The PodGroup with more members"],
          ["4. Start time", "Started earlier"]
        ] },
        { type: "callout", kind: "warn", html: "Every Pod in a PodGroup must share the same <code>schedulerName</code>, <code>priority</code> and <code>preemptionPolicy</code>. A mismatch makes the scheduler reject the whole group as unschedulable." }
      ] },
    { id: "topology", title: "Topology-aware and hierarchical gangs", toc: "Topology & hierarchy",
      lead: "Training traffic between workers is heavy. Keeping a gang inside one rack or zone matters as much as starting it at all.",
      blocks: [
        { type: "code", title: "PodGroup with a topology constraint (TopologyAwareWorkloadScheduling, alpha)", code: `apiVersion: scheduling.k8s.io/v1beta1
kind: PodGroup
metadata:
  name: example-podgroup
spec:
  schedulingPolicy:
    gang:
      minCount: 4
  schedulingConstraints:
    topology:
    - key: topology.example.com/rack   # all Pods land on nodes with the same rack label value` },
        { type: "p", html: "A <b>CompositePodGroup</b> groups child groups instead of Pods. With <code>gang.minGroupCount</code> it gives multi-level all-or-nothing, for example two replicas of a training job that must both start. Hierarchies are at most 4 levels deep." },
        { type: "code", title: "gang of gangs (scheduling.k8s.io/v1alpha3, CompositePodGroup gate)", code: `apiVersion: scheduling.k8s.io/v1alpha3
kind: Workload
metadata:
  name: gang-of-gangs-workload
spec:
  compositePodGroupTemplates:
  - name: root
    schedulingPolicy:
      gang:
        minGroupCount: 2      # both child groups must fit together
    podGroupTemplates:
    - name: workers-a
      schedulingPolicy: {gang: {minCount: 4}}
    - name: workers-b
      schedulingPolicy: {gang: {minCount: 4}}` },
        { type: "h3", text: "Feature gates and maturity (v1.37)" },
        { type: "table", head: ["Feature gate", "Stage", "What it enables"], rows: [
          ["<code>GenericWorkload</code>", '<span class="chip amber">beta, off by default</span>', "Workload and PodGroup APIs, gang scheduling, workload-aware preemption. Alpha in v1.35–1.36."],
          ["<code>WorkloadWithJob</code>", '<span class="chip red">alpha</span> (v1.36)', "Job <code>.spec.scheduling</code> compiled into Workload + PodGroup"],
          ["<code>TopologyAwareWorkloadScheduling</code>", '<span class="chip red">alpha</span> (v1.36)', "<code>schedulingConstraints.topology</code>, placement-based algorithm"],
          ["<code>CompositePodGroup</code>", '<span class="chip red">alpha</span> (v1.37)', "Hierarchical gangs, needs the two gates above"],
          ["<code>PodGroupPreemptionPolicy</code>", '<span class="chip red">alpha</span> (v1.37)', "<code>preemptionPolicy: Never</code> on a group"],
          ["<code>GangScheduling</code>, <code>WorkloadAwarePreemption</code>", '<span class="chip">removed</span>', "Merged into GenericWorkload in v1.37"]
        ] },
        { type: "callout", kind: "tip", html: "Before this was built in, projects such as Kueue, Volcano and the scheduler-plugins coscheduling plugin provided gang scheduling as add-ons. They remain useful for queueing and fair sharing on top of the native APIs." }
      ] }
  ],
  summary: {
    takeaways: [
      ["🔒", "All-or-nothing", "A gang binds at least minCount Pods together or binds none."],
      ["🧊", "No deadlock", "Partial gangs never hold capacity while they wait."],
      ["📜", "Workload = policy", "Immutable template with up to 8 podGroupTemplates."],
      ["👥", "PodGroup = runtime", "Self-contained copy of the policy plus scheduling status."],
      ["⚔️", "Group preemption", "Victims chosen cluster-wide; disruptionMode All keeps gangs whole."],
      ["🧭", "Maturity", "GenericWorkload is beta but off by default in v1.37; Job integration is alpha."]
    ],
    cheat: `# enable (control plane): --feature-gates=GenericWorkload=true
#   and --runtime-config=scheduling.k8s.io/v1beta1=true
kubectl api-resources --api-group=scheduling.k8s.io
kubectl get workloads,podgroups -A
kubectl describe podgroup training-worker-0      # PodGroupInitiallyScheduled
kubectl get pod worker-0 -o jsonpath='{.spec.schedulingGroup}'
kubectl get events --field-selector reason=FailedScheduling`,
    quiz: [
      ["A gang PodGroup has minCount 4 but only 3 Pods exist. What does the scheduler do?", ["Schedules the 3", "Holds the group in PreEnqueue", "Deletes the PodGroup", "Preempts other Pods"], 1, "The group isn't queued until quorum (≥ minCount Pods) is met."],
      ["Which object carries runtime scheduling status?", ["Workload", "PodGroup", "Job", "PriorityClass"], 1, "Workload is a static template; PodGroup holds per-instance state."],
      ["How does a Pod join a PodGroup?", ["Label selector", "spec.schedulingGroup.podGroupName", "ownerReferences", "Annotation"], 1, "The field is immutable once set."],
      ["What does disruptionMode: All mean?", ["Never preempt", "Preempt all Pods in the group together", "Preempt all other groups", "Disrupt during upgrades only"], 1, "Single (default) lets preemption remove individual Pods."],
      ["A Job sets scheduling.schedulingPolicy.gang: {} with parallelism 8. What is minCount?", ["1", "8", "completions", "Unset: Job rejected"], 1, "An omitted minCount defaults to parallelism."]
    ]
  }
});
</script>
</body>
</html>
