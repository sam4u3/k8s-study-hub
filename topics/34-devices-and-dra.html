<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devices and DRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
// DRA device matcher: ResourceSlices vs a ResourceClaim's CEL selector.
const DEV = [
  { node: "gpu-1", name: "gpu-0", model: "A100", mem: 40, mig: false }, { node: "gpu-1", name: "gpu-1", model: "A100", mem: 80, mig: false },
  { node: "gpu-2", name: "gpu-0", model: "L4", mem: 24, mig: false }, { node: "gpu-2", name: "gpu-1", model: "L4", mem: 24, mig: false },
  { node: "gpu-3", name: "gpu-0", model: "H100", mem: 80, mig: true }
];
const draHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>count<select class="input" id="dCount"><option>1</option><option>2</option></select></label>
    <label>min memory (GiB)<select class="input" id="dMem"><option>16</option><option>40</option><option>80</option></select></label>
    <label>model<select class="input" id="dModel"><option value="">any</option><option>A100</option><option>L4</option><option>H100</option></select></label>
  </div>
  <div class="pipe-out" id="dExpr" style="margin:0 0 12px"></div>
  <div id="dDevs" style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px"></div>
  <div class="pipe-out" id="dOut"></div>
</div>`;
function initDra(el) {
  const $ = s => el.querySelector(s);
  if (innerWidth < 760) $("#dDevs").style.gridTemplateColumns = "1fr 1fr";
  const go = () => {
    const c = +$("#dCount").value, m = +$("#dMem").value, mo = $("#dModel").value;
    const expr = `device.capacity["gpu.example.com"].memory.compareTo(quantity("${m}Gi")) >= 0` + (mo ? ` && device.attributes["gpu.example.com"].model == "${mo}"` : "");
    $("#dExpr").innerHTML = `<span class="faint">selectors.cel.expression:</span> ${expr}`;
    const ok = DEV.filter(d => d.mem >= m && (!mo || d.model === mo));
    const byNode = {}; ok.forEach(d => (byNode[d.node] = byNode[d.node] || []).push(d));
    const node = Object.keys(byNode).find(n => byNode[n].length >= c);
    const pick = node ? byNode[node].slice(0, c) : [];
    $("#dDevs").innerHTML = DEV.map(d => `<div class="box" style="border-color:${pick.includes(d) ? "var(--green)" : ok.includes(d) ? "rgba(91,140,255,.6)" : "var(--border)"};opacity:${ok.includes(d) ? 1 : .4}"><b style="font:600 12px var(--mono)">${d.node}/${d.name}</b><div class="faint" style="font-size:11.5px">${d.model} · ${d.mem}Gi</div>${pick.includes(d) ? '<span class="pill g" style="margin-top:6px">allocated</span>' : ""}</div>`).join("");
    $("#dOut").innerHTML = node ? `<span style="color:var(--green)">✓ scheduler allocates ${pick.map(d => d.node + "/" + d.name).join(", ")} → Pod bound to ${node}; claim status.allocation records the devices</span>`
      : `<span style="color:var(--red)">✗ 0 nodes can satisfy the claim (${ok.length} matching devices, but no node has ${c}). Pod stays Pending</span>`;
  };
  el.querySelectorAll("select").forEach(s => s.onchange = go); go();
}

K8S_RENDER({
  id: "34-dra", group: "advanced", minutes: 25,
  title: 'GPUs & devices: <span class="grad-text">device plugins</span> and DRA',
  lead: "CPU and memory are built in. Everything else (GPUs, FPGAs, high-speed NICs) needs a way to be advertised by nodes and requested by Pods. Device plugins count devices; Dynamic Resource Allocation (stable since v1.34) describes and selects them.",
  parts: [["Extended resources", "Simple counters"], ["Device plugins", "nvidia.com/gpu: 1"], ["DRA objects", "DeviceClass, ResourceSlice, ResourceClaim"], ["Selector lab", "CEL device matching"], ["Sharing", "Claims shared across Pods"]],
  sections: [
    { id: "extended", title: "Extended resources and device plugins", toc: "Device plugins",
      blocks: [
        { type: "flow", nodes: [
          ["🧩", "Plugin", "Device plugin DaemonSet starts", "e.g. NVIDIA device plugin on GPU nodes, talking to the GPU driver."],
          ["📝", "Register", "Registers with kubelet", "Over a unix socket in <code>/var/lib/kubelet/device-plugins/</code>."],
          ["📣", "Advertise", "Node capacity updated", "<code>status.capacity: nvidia.com/gpu: 4</code>, an integer the scheduler can count."],
          ["📦", "Request", "Pod asks for a count", "<code>resources.limits: nvidia.com/gpu: 1</code>. No fractions, no overcommit."],
          ["🔌", "Allocate", "kubelet calls Allocate()", "The plugin returns device nodes, env vars and mounts so the container sees exactly its GPU."]
        ] },
        { type: "code", title: "Pod using a GPU (device plugin)", code: `apiVersion: v1
kind: Pod
metadata:
  name: cuda-test
spec:
  restartPolicy: OnFailure
  tolerations:
  - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}   # GPU nodes are usually tainted
  containers:
  - name: cuda
    image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
    resources:
      limits:
        nvidia.com/gpu: 1` },
        { type: "callout", kind: "info", html: "Limitations that motivated DRA: only integer counts, no way to say 'a GPU with ≥40 GiB' or 'two GPUs on the same NVLink', no sharing between Pods, and the scheduler knows nothing about device attributes." }
      ] },
    { id: "dra", title: "Dynamic Resource Allocation", toc: "DRA objects",
      lead: "DRA (<code>resource.k8s.io/v1</code>) models devices like storage: drivers publish what exists, admins define classes, users claim what they need, the scheduler allocates.",
      blocks: [
        { type: "layers", items: [
          ["ResourceClaim / ResourceClaimTemplate (namespaced)", "user: 'I need 1 device of class gpu with ≥40Gi'", "#34d399"],
          ["DeviceClass (cluster)", "admin: named category + selectors + config, like a StorageClass", "#8b5cf6"],
          ["ResourceSlice (cluster)", "driver: list of devices per node with attributes and capacity", "#5b8cff"],
          ["DRA driver (kubelet plugin + controller)", "vendor: discovers devices, prepares them for containers", "#fbbf24"]
        ] },
        { type: "code", title: "DeviceClass + ResourceClaimTemplate + Pod", code: `apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu.example.com
spec:
  selectors:
  - cel:
      expression: device.driver == "gpu.example.com"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: big-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.example.com
          count: 1
          selectors:
          - cel:
              expression: device.capacity["gpu.example.com"].memory.compareTo(quantity("40Gi")) >= 0
---
apiVersion: v1
kind: Pod
metadata:
  name: trainer
spec:
  resourceClaims:
  - name: gpu
    resourceClaimTemplateName: big-gpu     # one claim generated per Pod
  containers:
  - name: train
    image: ghcr.io/example/train:1.0
    resources:
      claims:
      - name: gpu` }
      ] },
    { id: "lab", title: "Selector lab", toc: "Selector lab",
      lead: "The scheduler evaluates the claim's CEL selector against every device in the ResourceSlices and picks a node that can satisfy the whole claim.",
      blocks: [{ type: "custom", html: draHtml, init: initDra }] },
    { id: "sharing", title: "Sharing, admin access and status", toc: "Sharing",
      blocks: [
        { type: "cards", cols: 3, items: [
          ["🤝", "Shared claims", "Create a standalone ResourceClaim and reference it from several Pods: they share the same allocated device (e.g. inference sidecars)."],
          ["🧾", "Allocation status", "<code>status.allocation</code> lists devices; <code>status.reservedFor</code> lists consuming Pods. Drivers can publish device health and network data."],
          ["🛠️", "Admin access", "Privileged claims for monitoring tools to access devices in use, restricted to labelled namespaces."],
          ["🧮", "Partitionable devices", "Drivers can expose MIG-style slices of one GPU as separate devices (feature-gated, check your driver)."],
          ["🏷️", "Device taints", "Mark unhealthy devices so they're not allocated, similar to node taints."],
          ["📈", "Observability", "kubelet PodResources API (DRA data stable since v1.36) lets monitoring map devices to Pods."]
        ] },
        { type: "term", title: "inspect", lines: [
          "$ kubectl get deviceclasses",
          "$ kubectl get resourceslices -o wide",
          "$ kubectl get resourceclaims -A",
          "$ kubectl describe resourceclaim trainer-gpu-x7k2p",
          "$ kubectl get pod trainer -o jsonpath='{.status.resourceClaimStatuses}'"
        ] }
      ] }
  ],
  summary: {
    takeaways: [
      ["🔢", "Device plugins count", "nvidia.com/gpu: 1 via extended resources."],
      ["🧠", "DRA describes", "Attributes and capacity, selected with CEL."],
      ["🧱", "Four DRA objects", "DeviceClass, ResourceSlice, ResourceClaim, ResourceClaimTemplate."],
      ["📍", "Scheduler allocates", "Whole claim on one node, or Pod stays Pending."],
      ["🤝", "Claims can be shared", "Standalone ResourceClaim used by several Pods."],
      ["✅", "Stable since v1.34", "resource.k8s.io/v1."]
    ],
    cheat: `kubectl get nodes -o custom-columns=NAME:.metadata.name,GPU:.status.allocatable.nvidia\\.com/gpu
kubectl get deviceclasses,resourceslices
kubectl get resourceclaims,resourceclaimtemplates -A
kubectl describe pod <p> | grep -A3 -i claim`,
    quiz: [
      ["Ask for 'a GPU with at least 40 GiB memory'. Which mechanism?", ["Device plugin limit", "DRA ResourceClaim with a CEL selector", "nodeSelector", "LimitRange"], 1, "Device plugins only count."],
      ["Which DRA object is published by the driver per node?", ["DeviceClass", "ResourceSlice", "ResourceClaim", "RuntimeClass"], 1, "It lists the node's devices and attributes."],
      ["Two Pods must use the same accelerator. How?", ["Two device plugin limits", "Reference one standalone ResourceClaim from both", "hostPath", "Impossible"], 1, "Shared claims."],
      ["Can a device-plugin Pod request 0.5 GPU?", ["Yes", "No, extended resources are integers", "Only on A100", "With DRA only"], 1, "Partial devices need sharing strategies or DRA partitioning."]
    ]
  }
});
</script>
</body>
</html>
