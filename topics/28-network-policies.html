<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Network Policies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
// NetworkPolicy evaluator for GameHub: toggle policies, test flows.
const PODS = ["gateway", "frontend", "auth", "game", "postgres", "kube-dns", "internet"];
const POL = {
  deny: { label: "default-deny (ingress + egress) in crash-course", on: true },
  dns: { label: "allow egress to kube-dns :53 UDP/TCP", on: true },
  gw: { label: "allow gateway → frontend :80", on: true },
  fe: { label: "allow frontend → auth :8080, game :8081", on: true },
  db: { label: "allow auth, game → postgres :5432", on: false },
  prom: { label: "allow monitoring ns → auth/game :http-metrics", on: false }
};
const FLOWS = [
  ["gateway", "frontend", "TCP 80"], ["frontend", "auth", "TCP 8080"], ["frontend", "game", "TCP 8081"], ["game", "postgres", "TCP 5432"],
  ["auth", "kube-dns", "UDP 53"], ["frontend", "postgres", "TCP 5432"], ["game", "internet", "TCP 443"], ["monitoring/prometheus", "game", "TCP 8081"]
];
const inNs = p => ["frontend", "auth", "game", "postgres"].includes(p);
function allowed(src, dst, port) {
  const D = POL.deny.on;
  // egress side (source in namespace)
  let eg = true, ingr = true, why = [];
  if (inNs(src) && D) {
    eg = (dst === "kube-dns" && POL.dns.on) || (src === "frontend" && ["auth", "game"].includes(dst) && POL.fe.on) || (["auth", "game"].includes(src) && dst === "postgres" && POL.db.on);
    if (!eg) why.push(`egress from ${src} not allowed`);
  }
  if (inNs(dst) && D) {
    ingr = (src === "gateway" && dst === "frontend" && POL.gw.on) || (src === "frontend" && ["auth", "game"].includes(dst) && POL.fe.on) || (["auth", "game"].includes(src) && dst === "postgres" && POL.db.on) || (src.startsWith("monitoring") && ["auth", "game"].includes(dst) && POL.prom.on);
    if (!ingr) why.push(`ingress to ${dst} not allowed`);
  }
  return { ok: eg && ingr, why };
}
const npHtml = `
<div class="sim glass">
  <div id="npPol" style="display:grid;gap:6px;margin-bottom:14px"></div>
  <div id="npFlows" style="display:grid;gap:6px"></div>
</div>`;
function initNp(el) {
  const draw = () => {
    el.querySelector("#npPol").innerHTML = Object.entries(POL).map(([k, p]) => `<label class="box" style="display:flex;gap:10px;align-items:center;cursor:pointer;padding:8px 12px"><input type="checkbox" data-p="${k}" ${p.on ? "checked" : ""}><span style="font-size:13.5px">${p.label}</span></label>`).join("");
    el.querySelector("#npFlows").innerHTML = FLOWS.map(([s, d, port]) => {
      const r = allowed(s, d, port);
      return `<div class="box fadein" style="display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-color:${r.ok ? "rgba(52,211,153,.5)" : "rgba(248,113,113,.5)"}"><span style="font:12.5px var(--mono)">${s} → ${d} <span class="faint">${port}</span>${r.why.length ? `<br><span style="color:#fca5a5;font-size:11.5px">${r.why.join(" · ")}</span>` : ""}</span><span class="pill ${r.ok ? "g" : "r"}">${r.ok ? "ALLOW" : "DROP"}</span></div>`;
    }).join("");
    el.querySelectorAll("[data-p]").forEach(c => c.onchange = () => { POL[c.dataset.p].on = c.checked; draw(); });
  };
  draw();
}

K8S_RENDER({
  id: "28-netpol", group: "networking", minutes: 25,
  title: '<span class="grad-text">Network Policies</span>',
  lead: "By default every Pod can talk to every other Pod in the cluster. A NetworkPolicy turns that into an allow-list, per Pod, for traffic in (ingress) and out (egress).",
  parts: [["Model", "Isolation rules"], ["Selectors", "Pods, namespaces, IP blocks"], ["GameHub lab", "Toggle policies, test flows"], ["Recipes", "Copy-paste patterns"], ["Limits", "What it can't do"]],
  sections: [
    { id: "model", title: "How isolation works", toc: "Model",
      blocks: [
        { type: "cards", cols: 3, items: [
          ["🔓", "Non-isolated by default", "A Pod with no policy selecting it accepts and sends anything."],
          ["🔒", "Selected = isolated", "Once any policy selects a Pod for Ingress (or Egress), only traffic allowed by some policy gets through in that direction."],
          ["➕", "Additive only", "Policies are unions of allow rules. There are no deny rules and order doesn't matter."],
          ["↔️", "Both ends must allow", "A connection from A to B needs egress allowed at A <b>and</b> ingress allowed at B (if each is isolated)."],
          ["🔁", "Stateful", "Replies to allowed connections are always allowed."],
          ["🧩", "CNI enforces", "The API accepts policies anywhere; only CNIs like Calico, Cilium, Antrea enforce them. Flannel alone does not."]
        ] }
      ] },
    { id: "selectors", title: "Anatomy of a policy", toc: "Selectors",
      blocks: [
        { type: "yaml", title: "allow-api-to-db.yaml", lines: [
          ["apiVersion: networking.k8s.io/v1", ""],
          ["kind: NetworkPolicy", ""],
          ["metadata:", ""],
          ["  name: postgres-from-apps", ""],
          ["  namespace: crash-course", "Policies are namespaced and only select Pods in their own namespace."],
          ["spec:", ""],
          ["  podSelector:", "<b>Which Pods this policy protects.</b> <code>{}</code> = every Pod in the namespace."],
          ["    matchLabels: {cnpg.io/cluster: postgres}", "CloudNativePG labels its instance Pods with the cluster name."],
          ["  policyTypes: [Ingress]", "Which directions become isolated. If omitted, Ingress is assumed (Egress too if egress rules exist)."],
          ["  ingress:", ""],
          ["  - from:", "Entries in <b>one</b> <code>from</code> list are ORed."],
          ["    - podSelector:", ""],
          ["        matchExpressions: [{key: app, operator: In, values: [auth-service, game-service]}]", "Pods in the same namespace with these labels."],
          ["    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: monitoring}}", "Any Pod in the monitoring namespace. Every namespace automatically has the <code>kubernetes.io/metadata.name</code> label."],
          ["    ports:", ""],
          ["    - {protocol: TCP, port: 5432}", "Ports apply to the whole rule. Named ports and ranges (<code>endPort</code>) work too."]
        ] },
        { type: "callout", kind: "warn", html: "<b>The YAML dash trap.</b> <code>- namespaceSelector: …</code> and <code>- podSelector: …</code> as two list items = namespace <b>OR</b> pod. Both keys in <b>one</b> item (no second dash) = Pods matching podSelector <b>inside</b> namespaces matching namespaceSelector (AND). One character changes the meaning." }
      ] },
    { id: "lab", title: "GameHub lab: lock it down", toc: "GameHub lab",
      lead: "Start from default-deny and add only the flows the app needs. Toggle the policies; the matrix shows which connections survive. Try turning on the DB rule and the monitoring rule.",
      blocks: [
        { type: "custom", html: npHtml, init: initNp },
        { type: "callout", kind: "tip", html: "Forgetting DNS is the #1 mistake: after default-deny egress, every name lookup times out and the app looks 'down' even though its direct rules are fine." }
      ] },
    { id: "recipes", title: "Recipes", toc: "Recipes",
      blocks: [
        { type: "tabs", tabs: [
          { label: "Default deny all", blocks: [{ type: "code", title: "deny-all.yaml", code: `apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: crash-course
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]` }] },
          { label: "Allow DNS egress", blocks: [{ type: "code", title: "allow-dns.yaml", code: `apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: crash-course
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
      podSelector:                 # same item → AND
        matchLabels: {k8s-app: kube-dns}
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}` }] },
          { label: "Frontend → APIs", blocks: [{ type: "code", title: "apis-from-frontend.yaml", code: `apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apis-from-frontend
  namespace: crash-course
spec:
  podSelector:
    matchExpressions: [{key: app, operator: In, values: [auth-service, game-service]}]
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: frontend}}
    ports:
    - {port: 8080}
    - {port: 8081}
---
# matching egress on the frontend side
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-egress
  namespace: crash-course
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector:
        matchExpressions: [{key: app, operator: In, values: [auth-service, game-service]}]` }] },
          { label: "External IP block", blocks: [{ type: "code", title: "egress-to-api.yaml", code: `egress:
- to:
  - ipBlock:
      cidr: 0.0.0.0/0
      except: [10.0.0.0/8, 169.254.169.254/32]   # block cloud metadata endpoint
  ports:
  - {protocol: TCP, port: 443}` }] }
        ] },
        { type: "term", title: "test from inside", lines: [
          "$ kubectl -n crash-course run t --rm -it --image=busybox:1.36 --labels=app=frontend -- sh",
          "/ # nc -zv -w2 game-service 8081        # open",
          "/ # nc -zv -w2 postgres-rw 5432         # timed out: blocked",
          "$ kubectl get netpol -n crash-course",
          "$ kubectl describe netpol apis-from-frontend -n crash-course"
        ] }
      ] },
    { id: "limits", title: "What NetworkPolicy can't do", toc: "Limits",
      blocks: [
        { type: "table", head: ["Need", "Use instead"], rows: [
          ["Cluster-wide guardrails that namespace owners can't override", "AdminNetworkPolicy / BaselineAdminNetworkPolicy (SIG Network CRDs), or CNI-specific global policies"],
          ["Allow by DNS name (api.stripe.com)", "Cilium/Calico FQDN policies or an egress gateway"],
          ["L7 rules (HTTP path, method)", "Cilium L7 policy or a service mesh AuthorizationPolicy"],
          ["Explicit deny rules, logging of drops", "CNI extensions (Calico, Cilium, Antrea)"],
          ["Encryption / mTLS", "Service mesh, or WireGuard/IPsec in the CNI"]
        ] }
      ] }
  ],
  summary: {
    takeaways: [
      ["🔓", "Open by default", "No policy = all traffic allowed."],
      ["🔒", "Selected = isolated", "Then only allowed flows pass, per direction."],
      ["➕", "Allow-only, additive", "No deny rules, no ordering."],
      ["⚠️", "One dash = OR vs AND", "namespaceSelector + podSelector in one item is AND."],
      ["🌐", "Always allow DNS", "After default-deny egress."],
      ["🧩", "CNI must enforce", "Flannel alone ignores policies."]
    ],
    cheat: `kubectl get netpol -A
kubectl describe netpol <name> -n <ns>
kubectl label ns monitoring purpose=monitoring
kubectl run t --rm -it --image=busybox:1.36 --labels=app=x -n <ns> -- nc -zv -w2 <svc> <port>
# Cilium: hubble observe --verdict DROPPED`,
    quiz: [
      ["A Pod has no NetworkPolicy selecting it. Traffic?", ["Denied", "Allowed both ways", "Only ingress allowed", "Only same-namespace"], 1, "Isolation starts only when a policy selects the Pod."],
      ["After default-deny egress, every request fails with timeouts on names. Missing?", ["Ingress rule", "Egress to kube-dns on port 53", "A Service", "RBAC"], 1, "DNS lookups are egress traffic too."],
      ["namespaceSelector and podSelector in the same from item mean…", ["OR", "AND", "Invalid", "Only the first applies"], 1, "Separate list items would be OR."],
      ["How do you write a deny rule?", ["action: Deny", "You can't; policies are allow-lists", "Priority field", "Negative ports"], 1, "Use AdminNetworkPolicy or CNI extensions for explicit deny."]
    ]
  }
});
</script>
</body>
</html>
