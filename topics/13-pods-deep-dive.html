<script>
// Probe timeline simulator: shows how startup, readiness and liveness interact over time.
const probeHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>App startup time (s): <b id="suV">20</b><input class="input" type="range" min="2" max="80" value="20" id="su"></label>
    <label>App hangs at (s, 0 = never): <b id="hgV">0</b><input class="input" type="range" min="0" max="120" step="5" value="0" id="hg"></label>
    <label><span><input type="checkbox" id="useStartup" checked> use startupProbe (10 × 5s)</span></label>
  </div>
  <div id="ptl" style="font:12px var(--mono);display:grid;gap:6px"></div>
  <div class="pipe-out" id="pres"></div>
</div>`;
function initProbe(el) {
  const $ = s => el.querySelector(s);
  const draw = () => {
    const su = +$("#su").value, hg = +$("#hg").value, useS = $("#useStartup").checked;
    $("#suV").textContent = su; $("#hgV").textContent = hg;
    const T = 120, cells = 60, dt = T / cells;
    const alive = t => t >= su && (!hg || t < hg);
    let restartAt = null, startupDone = null;
    // startup probe: period 5, failureThreshold 10 → up to 50 s
    if (useS) { for (let t = 5; t <= 50; t += 5) if (alive(t)) { startupDone = t; break; } if (startupDone === null) restartAt = 50; }
    // liveness: initialDelay 15, period 10, failureThreshold 3 (only after startup)
    const lStart = useS ? startupDone : 15;
    if (restartAt === null && lStart !== null) {
      let fails = 0;
      for (let t = lStart; t <= T; t += 10) { if (!alive(t)) { fails++; if (fails >= 3) { restartAt = t; break; } } else fails = 0; }
    }
    const row = (label, fn) => `<div style="display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center"><span class="muted">${label}</span><div style="display:flex;gap:1px">${Array.from({ length: cells }, (_, i) => { const t = i * dt; const c = fn(t); return `<i title="${t}s" style="flex:1;height:14px;border-radius:2px;background:${c}"></i>`; }).join("")}</div></div>`;
    const dead = t => restartAt !== null && t >= restartAt;
    $("#ptl").innerHTML =
      row("app state", t => dead(t) ? "#f87171" : alive(t) ? "#34d399" : t < su ? "#fbbf24" : "#f87171") +
      row("startup", t => !useS ? "rgba(255,255,255,.04)" : startupDone !== null && t >= startupDone ? "rgba(52,211,153,.35)" : t <= 50 ? "#fbbf24" : "rgba(255,255,255,.04)") +
      row("ready (svc)", t => !dead(t) && alive(t) && t >= (useS ? (startupDone || 999) : 5) ? "#5b8cff" : "rgba(255,255,255,.06)") +
      `<div style="display:grid;grid-template-columns:110px 1fr;gap:8px"><span></span><div style="display:flex;justify-content:space-between" class="faint"><span>0s</span><span>30s</span><span>60s</span><span>90s</span><span>120s</span></div></div>`;
    let msg;
    if (!useS && su > 15 + 20) msg = `<span style="color:var(--red)">✗ Without a startupProbe the livenessProbe starts at 15s and fails 3× before the app is up at ${su}s: kubelet kills it at ~${restartAt}s → CrashLoopBackOff forever.</span>`;
    else if (restartAt !== null && useS && startupDone === null) msg = `<span style="color:var(--red)">✗ App needs ${su}s but startupProbe allows 50s (10 × 5s). Container restarted at 50s. Raise failureThreshold.</span>`;
    else if (restartAt !== null) msg = `<span style="color:var(--amber)">⟳ App hung at ${hg}s. Readiness removed it from Service endpoints immediately; liveness failed 3× and kubelet restarted the container at ~${restartAt}s. This is the self-healing you want.</span>`;
    else msg = `<span style="color:var(--green)">✓ Started at ${su}s${useS ? ` (startupProbe passed at ${startupDone}s, then liveness takes over)` : ""}. Receives traffic only while ready.</span>`;
    $("#pres").innerHTML = msg;
  };
  el.querySelectorAll("input").forEach(i => i.oninput = draw);
  draw();
}

          ["🏃", "Running", "Running", "Bound to a node and at least one container is running (or starting/restarting)."],
          ["✅", "Succeeded", "Succeeded", "All containers exited 0 and won't restart (restartPolicy Never/OnFailure). Typical for Jobs."],
          ["❌", "Failed", "Failed", "All containers terminated and at least one failed (non-zero or killed)."],

        ] },

          ["<code>ImagePullBackOff</code> / <code>ErrImagePull</code>", "Wrong image name/tag, private registry without pull secret", "Image, imagePullSecrets"],
          ["<code>CrashLoopBackOff</code>", "Container keeps exiting; kubelet waits 10s, 20s, 40s… up to 5 min", "<code>kubectl logs --previous</code>"],
          ["<code>OOMKilled</code>", "Exceeded memory limit", "Limits, app memory"],
          ["<code>Completed</code>", "Exited 0", "Expected for one-off tasks"]

        { type: "callout", kind: "info", html: "<b>restartPolicy</b> (Pod-wide): <code>Always</code> (default, for services), <code>OnFailure</code> (Jobs), <code>Never</code>. The kubelet restarts containers in place; the Pod object, IP and node stay the same." }
      ] },
    { id: "cmd", title: "command and args", toc: "command & args",

        { type: "pipeline", intro: "Start order of the course's sidecar Pod.",

          scenarios: [
            { label: "Normal start", notes: ["network ready", "wget page into shared volume, exit 0", "sidecar started; not waited to finish", "nginx serves shared volume", ""], out: '<span style="color:var(--green)">✓ Running: 2/2 containers (sidecar counted in READY)</span>' },
            { label: "Init container fails", path: [0, 1], fail: 1, out: '<span style="color:var(--red)">✗ Init:CrashLoopBackOff, app never starts (retries per restartPolicy)</span>' }
          ] },
        { type: "tabs", tabs: [
          { label: "Init container", blocks: [{ type: "code", title: "pods/init.yaml", code: `spec:
  volumes:
  - name: shared-data
    emptyDir: {}
  initContainers:
  - name: bootcamp-init

          { label: "Native sidecar", blocks: [{ type: "code", title: "pods/sidecar.yaml", code: `spec:
  volumes:
  - name: shared-data
    emptyDir: {}
  initContainers:
  - name: meminfo-container
    image: alpine
    restartPolicy: Always          # ← makes it a sidecar
    command: ['sh', '-c', 'sleep 5; while true; do cat /proc/meminfo > /usr/share/data/index.html; sleep 10; done;']
    volumeMounts:

  containers:

          { label: "Shared network", blocks: [{ type: "code", title: "Module1/multi.yaml", code: `spec:

# kubectl exec shared-namespace -c p1 -- wget -qO- localhost` }] }
        ] },
        { type: "cards", cols: 3, items: [
          ["🔐", "Init use cases", "Wait for a DB, run migrations, fetch config or certificates, set file permissions."],
          ["📎", "Sidecar use cases", "Log shippers, service-mesh proxies (Envoy), config reloaders, metrics exporters."],
          ["🖥️", "spec.os", "<code>os.name: windows | linux</code> tells the scheduler and admission which OS rules apply."]
        ] }
      ] },
    { id: "probes", title: "Probes", toc: "Probes",
      lead: "Probes are how the kubelet knows whether your app is started, alive, and ready for traffic. Get them wrong and Kubernetes either kills healthy apps or sends traffic to broken ones.",
      blocks: [
        { type: "cards", cols: 3, items: [
          ["🐢", "startupProbe", "Runs first. Until it succeeds, liveness and readiness are off. Protects slow starters. Failure after the budget → restart."],
          ["💓", "livenessProbe", "Is the process wedged? Failure threshold reached → kubelet <b>restarts the container</b>."],

        ] },
        { type: "yaml", title: "pods/probe.yaml", lines: [
          ["containers:", ""],

          ["    httpGet: {path: /, port: 80}", "HTTP 200–399 = success. Other handlers: <code>tcpSocket</code>, <code>exec</code>, <code>grpc</code>."],
          ["    failureThreshold: 10", ""],
          ["    periodSeconds: 5", ""],
          ["  livenessProbe:", "After startup: every 10 s; 3 failures (default) → restart."],
          ["    httpGet: {path: /, port: 80}", "Keep it cheap and local. Never check dependencies (DB) here or one DB blip restarts every Pod."],
          ["    initialDelaySeconds: 15", "Ignored in effect while the startupProbe is still running."],
          ["    periodSeconds: 10", ""],
          ["  readinessProbe:", "Gate for traffic. Can check dependencies the request path really needs."],
          ["    httpGet: {path: /, port: 80}", ""],

        ] },
