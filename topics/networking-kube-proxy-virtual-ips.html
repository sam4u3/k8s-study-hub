<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kube-proxy Routing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
// Load-balancing simulator: shows how iptables statistic probabilities give an even spread.
const lbHtml = `
<div class="sim glass">
  <div class="sim-row"><label>Endpoints (Pods behind the Service)<input class="input" type="range" min="1" max="5" value="3" id="nEp"></label>
  <button class="btn primary" id="send">Send 300 requests</button></div>
  <div id="rules" class="pipe-out" style="margin:0 0 14px"></div>
  <div id="bars" style="display:grid;gap:8px"></div>
</div>`;
function initLb(el) {
  const n = el.querySelector("#nEp"), rules = el.querySelector("#rules"), bars = el.querySelector("#bars");
  const draw = counts => {
    const k = +n.value;
    let r = `<span class="faint">-A KUBE-SVC-2JWKBRQZ… (Service 10.96.0.100:80)</span><br>`;
    for (let i = 0; i < k; i++) {
      const p = 1 / (k - i);
      r += i < k - 1 ? `-m statistic --mode random --probability <b style="color:#fcd34d">${p.toFixed(5)}</b> -j KUBE-SEP-POD${i + 1}<br>` : `-j KUBE-SEP-POD${i + 1}   <span class="faint"># the rest</span>`;
    }
    rules.innerHTML = r;
    bars.innerHTML = Array.from({ length: k }, (_, i) => {
      const c = counts ? counts[i] : 0;
      return `<div style="display:grid;grid-template-columns:90px 1fr 50px;gap:10px;align-items:center;font:12px var(--mono)"><span>Pod ${i + 1}<br><span class="faint">10.244.${i + 1}.${10 + i}</span></span>
      <div style="height:14px;background:rgba(255,255,255,.06);border-radius:8px;overflow:hidden"><i style="display:block;height:100%;width:${counts ? c / 3 * k / 1.6 : 0}%;max-width:100%;background:linear-gradient(90deg,var(--k8s),var(--cyan));transition:width .8s"></i></div><span>${c}</span></div>`;
    }).join("");
  };
  n.oninput = () => draw();
  el.querySelector("#send").onclick = () => {
    const k = +n.value, counts = Array(k).fill(0);
    for (let j = 0; j < 300; j++) {
      for (let i = 0; i < k; i++) { if (i === k - 1 || Math.random() < 1 / (k - i)) { counts[i]++; break; } }
    }
    draw(Array(k).fill(0)); setTimeout(() => draw(counts), 60);
  };
  draw();
}

K8S_RENDER({
  id: "net-kube-proxy", group: "networking", minutes: 20,
  title: '<span class="grad-text">kube-proxy</span>: from Service IP to Pod IP',
  lead: "A Service IP is not on any interface. Nothing listens on it. It only exists as packet-rewriting rules that kube-proxy writes on every node.",
  parts: [["The problem", "Pods come and go"], ["iptables chains", "SERVICES → SVC → SEP"], ["Load balancing", "Random probabilities"], ["Modes", "iptables, IPVS, nftables"]],
  sections: [
    { id: "problem", title: "What kube-proxy solves", toc: "The problem",
      blocks: [
        { type: "cards", cols: 3, items: [
          ["🔄", "Pod IPs change", "Every restart, reschedule or rollout gives new Pod IPs. Clients can't hard-code them."],
          ["🎯", "Service = stable VIP", "A ClusterIP like 10.96.0.100 stays the same for the Service's lifetime."],
          ["🛠️", "kube-proxy bridges them", "Watches Services and EndpointSlices; programs DNAT rules on every node so VIP:port → one ready Pod IP:port."]
        ] },
        { type: "callout", kind: "info", html: "kube-proxy is not in the data path in iptables/IPVS/nftables mode. It only writes rules; the kernel rewrites packets. If kube-proxy crashes, existing rules keep working; only changes stop." }
      ] },
    { id: "chains", title: "Follow a packet through iptables", toc: "iptables chains",
      lead: "A Pod curls nginx-service at 10.96.0.100:80. Watch the NAT chains decide its fate.",
      blocks: [
        { type: "pipeline", stages: [["PREROUTING / OUTPUT", "nat table"], ["KUBE-SERVICES", "match dst VIP:port"], ["KUBE-SVC-xxxx", "pick an endpoint"], ["KUBE-SEP-xxxx", "DNAT to Pod"], ["Routing", "via CNI"], ["Pod", "10.244.2.7:80"]],
          scenarios: [
            { label: "Request to ClusterIP", start: "→ TCP 10.244.1.5:51234 → 10.96.0.100:80", notes: ["packet hits nat hook", "-d 10.96.0.100/32 -p tcp --dport 80 -j KUBE-SVC-2JWKBRQZ", "statistic random 0.333 → KUBE-SEP-ABC", "DNAT --to-destination 10.244.2.7:80", "normal Pod routing", ""], out: '<span style="color:var(--green)">✓ conntrack remembers the mapping; replies are un-NATed back to 10.96.0.100</span>' },
            { label: "Service with no ready Pods", start: "→ TCP → 10.96.0.200:80", path: [0, 1, 2], fail: 2, notes: ["", "matches service rule"], out: '<span style="color:var(--red)">✗ KUBE-SVC has no endpoints → REJECT: "connection refused". Check selector and readiness: kubectl get endpointslices</span>' },
            { label: "NodePort from outside", start: "→ TCP 203.0.113.9 → 10.0.0.11:31188", notes: ["packet hits nat PREROUTING", "KUBE-NODEPORTS --dport 31188", "KUBE-SVC (+ masquerade mark)", "DNAT to a Pod (maybe on another node)", "SNAT to node IP if cross-node", ""], out: '<span style="color:var(--green)">✓ externalTrafficPolicy: Local would keep the client IP but only route to Pods on that node</span>' }
          ] },
        { type: "term", title: "on a node", lines: [
          "$ kubectl get pods -n kube-system -l k8s-app=kube-proxy",
          "$ sudo iptables -t nat -L KUBE-SERVICES -n --line-numbers | grep 10.96.0.100",
          "5  KUBE-SVC-2JWKBRQZFJKXWXF4  tcp  --  0.0.0.0/0  10.96.0.100  /* default/nginx-service cluster IP */ tcp dpt:80",
          "$ sudo iptables -t nat -L KUBE-SVC-2JWKBRQZFJKXWXF4 -n --line-numbers",
          "1  KUBE-SEP-AAAA  all  /* default/nginx-service -> 10.244.1.12:80 */ statistic mode random probability 0.33333333349",
          "2  KUBE-SEP-BBBB  all  /* default/nginx-service -> 10.244.2.7:80 */ statistic mode random probability 0.50000000000",
          "3  KUBE-SEP-CCCC  all  /* default/nginx-service -> 10.244.2.9:80 */",
          "$ sudo iptables -t nat -S KUBE-SEP-AAAA",
          "-A KUBE-SEP-AAAA -p tcp -j DNAT --to-destination 10.244.1.12:80",
          "$ sudo conntrack -L -d 10.96.0.100 | head -3",
          "✓ 1/3, then 1/2 of the rest, then all the rest = even split"
        ] }
      ] },
    { id: "lb", title: "Why the probabilities look odd", toc: "Load balancing",
      lead: "Rules are evaluated top to bottom. To get an even split across n endpoints, rule i matches with probability 1/(n−i). Try it.",
      blocks: [
        { type: "custom", html: lbHtml, init: initLb },
        { type: "callout", kind: "warn", html: "It's per-connection, not per-request. A client with a long-lived keep-alive or gRPC connection sticks to one Pod. For per-request balancing of HTTP/2 or gRPC, use a client-side balancer, a service mesh or Gateway API." }
      ] },
    { id: "modes", title: "Proxy modes", toc: "Modes",
      blocks: [
        { type: "table", head: ["Mode", "How", "Scale", "Status"], rows: [
          ["<b>iptables</b>", "NAT chains per Service/endpoint, random statistic", "Rule updates slow with 10k+ Services", "Default on Linux for years"],
          ["<b>IPVS</b>", "Kernel L4 load balancer, hash tables, rr/lc/sh algorithms", "Fast lookups at large scale", "Supported; being de-emphasised in favour of nftables"],
          ["<b>nftables</b>", "Modern netfilter backend with sets and maps", "Faster incremental updates than iptables", "GA in 1.33, recommended for new clusters on recent kernels"],
          ["<b>eBPF (Cilium, Calico eBPF)</b>", "kube-proxy replacement in the CNI", "Very fast, socket-level LB", "Not kube-proxy; disable kube-proxy when used"]
        ] },
        { type: "code", title: "check and change the mode (kubeadm)", code: "kubectl -n kube-system get cm kube-proxy -o yaml | grep mode\ncurl -s localhost:10249/proxyMode        # on a node\n\n# switch: edit the ConfigMap then restart the DaemonSet\nkubectl -n kube-system edit cm kube-proxy     # mode: \"nftables\"\nkubectl -n kube-system rollout restart ds kube-proxy" }
      ] }
  ],
  summary: {
    takeaways: [
      ["👻", "ClusterIP is virtual", "No interface owns it; kernel NAT rules implement it."],
      ["⛓️", "SERVICES → SVC → SEP", "Match VIP, pick endpoint, DNAT to Pod IP."],
      ["🎲", "1/(n−i) probabilities", "Top-down random rules give an even spread per connection."],
      ["🔌", "Control plane only", "kube-proxy writes rules; packets never pass through it."],
      ["🚫", "No endpoints = reject", "Check selector labels and readiness probes."],
      ["⚡", "nftables / eBPF", "Better scaling than classic iptables."]
    ],
    cheat: `kubectl get svc,endpointslices
sudo iptables -t nat -L KUBE-SERVICES -n | grep <cluster-ip>
sudo iptables -t nat -L KUBE-SVC-<hash> -n
sudo iptables -t nat -S KUBE-SEP-<hash>
sudo iptables -t nat -L KUBE-NODEPORTS -n
sudo conntrack -L -d <cluster-ip>
kubectl -n kube-system logs ds/kube-proxy`,
    quiz: [
      ["Which chain performs the DNAT to a Pod IP?", ["KUBE-SERVICES", "KUBE-SVC-*", "KUBE-SEP-*", "KUBE-NODEPORTS"], 2, "SEP = Service EndPoint; it holds the DNAT target."],
      ["With 4 endpoints, what probability does the first rule use?", ["0.25", "0.5", "0.33", "1.0"], 0, "1/(4−0) = 0.25, then 1/3, then 1/2, then the rest."],
      ["kube-proxy crashes. What happens to existing Service traffic?", ["Stops immediately", "Keeps working on existing rules", "Falls back to DNS", "Goes through the API server"], 1, "Rules stay in the kernel; only updates stop."],
      ["Curl to a Service gets 'connection refused' instantly. First check?", ["Restart CoreDNS", "kubectl get endpointslices for that Service", "Reboot node", "Change proxy mode"], 1, "No ready endpoints → the SVC chain rejects."]
    ]
  }
});
</script>
</body>
</html>
