<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAML and kubeconfig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
// Interactive YAML validator: catches the mistakes beginners hit most.
const lintHtml = `
<div class="sim glass">
  <div class="sim-row"><label>Try a broken example<select class="input" id="ex">
    <option value="ok">✅ Valid Pod</option><option value="tab">Tab indentation</option><option value="indent">Wrong indentation</option>
    <option value="list">Missing list dash</option><option value="colon">Missing space after colon</option><option value="bool">Unquoted yes/no value</option></select></label></div>
  <textarea class="input" id="yin" rows="11" spellcheck="false" style="font-family:var(--mono);font-size:13px;line-height:1.6"></textarea>
  <div class="pipe-out" id="yout"></div>
</div>`;
const EX = {
  ok: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: web\n  labels:\n    app: web\nspec:\n  containers:\n  - name: nginx\n    image: nginx:1.27",
  tab: "apiVersion: v1\nkind: Pod\nmetadata:\n\tname: web\nspec:\n  containers:\n  - name: nginx\n    image: nginx",
  indent: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: web\nspec:\n  containers:\n  - name: nginx\n   image: nginx",
  list: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: web\nspec:\n  containers:\n    name: nginx\n    image: nginx",
  colon: "apiVersion: v1\nkind: Pod\nmetadata:\n  name:web\nspec:\n  containers:\n  - name: nginx\n    image: nginx",
  bool: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: flags\ndata:\n  enabled: yes\n  port: 8080"
};
function lint(t) {
  const L = t.split("\n"), errs = [];
  L.forEach((l, i) => {
    const n = i + 1;
    if (/\t/.test(l)) errs.push(`line ${n}: tab character. YAML allows only spaces for indentation.`);
    const ind = l.match(/^ */)[0].length;
    if (l.trim() && ind % 2) errs.push(`line ${n}: odd indentation (${ind} spaces). Siblings must line up exactly; 2 spaces is the convention.`);
    if (/^\s*[A-Za-z]\w*:[^\s]/.test(l) && !/https?:/.test(l)) errs.push(`line ${n}: no space after ':'. "name:web" is a plain string, not a key/value.`);
  });
  const ci = L.findIndex(l => /^\s*containers:\s*$/.test(l));
  if (ci >= 0 && L[ci + 1] && !/^\s*- /.test(L[ci + 1])) errs.push(`line ${ci + 2}: 'containers' must be a list. Start each item with "- ".`);
  if (/data:/.test(t)) L.forEach((l, i) => { const m = l.match(/:\s+(\d+|yes|no|true|false|on|off)\s*$/i); if (m && i > L.findIndex(x => /data:/.test(x))) errs.push(`line ${i + 1}: ConfigMap data values must be strings. Quote "${m[1]}".`); });
  return errs;
}
function initLint(el) {
  const ex = el.querySelector("#ex"), yin = el.querySelector("#yin"), out = el.querySelector("#yout");
  const run = () => {
    const e = lint(yin.value);
    out.innerHTML = e.length ? e.map(x => `<span style="color:var(--red)">✗ ${x}</span>`).join("<br>") : '<span style="color:var(--green)">✓ Looks valid. Next: kubectl apply --dry-run=server -f pod.yaml validates against the real API schema.</span>';
  };
  ex.onchange = () => { yin.value = EX[ex.value]; run(); };
  yin.oninput = run;
  yin.value = EX.ok; run();
}

// kubeconfig context switcher animation
const kcHtml = `
<div class="sim glass">
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px" class="kc3">
    <div class="box"><b style="font-size:13px">clusters</b><div id="kcC" style="display:grid;gap:6px;margin-top:8px"></div></div>
    <div class="box"><b style="font-size:13px">contexts</b><div id="kcX" style="display:grid;gap:6px;margin-top:8px"></div></div>
    <div class="box"><b style="font-size:13px">users</b><div id="kcU" style="display:grid;gap:6px;margin-top:8px"></div></div>
  </div>
  <div class="pipe-out" id="kcOut"></div>
</div>`;
const KC = {
  clusters: ["kind-lab", "sks-prod"], users: ["kind-admin", "jane", "sks-admin"],
  contexts: [["lab", "kind-lab", "kind-admin", "default"], ["lab-jane", "kind-lab", "jane", "dev"], ["prod", "sks-prod", "sks-admin", "gamehub"]]
};
function initKc(el) {
  if (innerWidth < 760) el.querySelector(".kc3").style.gridTemplateColumns = "1fr";
  const C = el.querySelector("#kcC"), X = el.querySelector("#kcX"), U = el.querySelector("#kcU"), out = el.querySelector("#kcOut");
  C.innerHTML = KC.clusters.map(c => `<span class="pill b x" data-c="${c}">${c}</span>`).join("");
  U.innerHTML = KC.users.map(u => `<span class="pill v x" data-u="${u}">${u}</span>`).join("");
  X.innerHTML = KC.contexts.map(x => `<button class="opt" data-x="${x[0]}" style="padding:7px 10px;font-family:var(--mono);font-size:12.5px">${x[0]}</button>`).join("");
  const use = name => {
    const x = KC.contexts.find(c => c[0] === name);
    el.querySelectorAll("[data-c]").forEach(p => p.classList.toggle("x", p.dataset.c !== x[1]));
    el.querySelectorAll("[data-u]").forEach(p => p.classList.toggle("x", p.dataset.u !== x[2]));
    el.querySelectorAll("[data-x]").forEach(b => b.classList.toggle("right", b.dataset.x === name));
    out.innerHTML = `<span class="faint">$ kubectl config use-context ${x[0]}</span><br>Switched to context "${x[0]}".<br><span class="faint">$ kubectl get pods</span><br>→ sends to <b style="color:#a9c1ff">${x[1]}</b> as <b style="color:#c4b5fd">${x[2]}</b> in namespace <b style="color:#fcd34d">${x[3]}</b>`;
  };
  el.querySelectorAll("[data-x]").forEach(b => b.onclick = () => use(b.dataset.x));
  use("lab");
}

K8S_RENDER({
  id: "overview-objects", group: "overview", minutes: 25,
  title: '<span class="grad-text">YAML</span> manifests & <span class="grad-text">kubeconfig</span>',
  lead: "Two files drive everything you do with kubectl: the manifest (what you want) and the kubeconfig (where and as whom you send it).",
  parts: [["YAML rules", "Maps, lists, scalars"], ["Manifest anatomy", "apiVersion, kind, metadata, spec"], ["Generate, don't type", "dry-run and explain"], ["kubeconfig", "Clusters, users, contexts"]],
  sections: [
    { id: "yaml", title: "YAML in 5 minutes", toc: "YAML rules",
      lead: "YAML is a superset of JSON designed for humans. Kubernetes converts it to JSON before sending it to the API server.",
      blocks: [
        { type: "cards", cols: 3, items: [
          ["🗺️", "Maps", "<code>key: value</code>. A space after the colon is required. Nested maps are indented."],
          ["📋", "Lists", "Items start with <code>- </code> at the same indentation. <code>containers</code>, <code>ports</code>, <code>env</code> are lists."],
          ["🔤", "Scalars", "Strings, numbers, booleans. Quote values that look like numbers or booleans when you mean a string."],
          ["↔️", "Indentation", "Spaces only, never tabs. Siblings must line up exactly. 2 spaces is the convention."],
          ["📄", "Multi-document", "<code>---</code> separates several objects in one file. kubectl applies them in order."],
          ["📝", "Block strings", "<code>|</code> keeps newlines (config files, scripts). <code>&gt;</code> folds lines into one."]
        ] },
        { type: "h3", text: "Live YAML checker" },
        { type: "custom", html: lintHtml, init: initLint },
        { type: "code", title: "same object: YAML vs JSON", code: "# YAML\nspec:\n  containers:\n  - name: nginx\n    ports:\n    - containerPort: 80\n\n# JSON (what the API server actually receives)\n{\"spec\": {\"containers\": [{\"name\": \"nginx\", \"ports\": [{\"containerPort\": 80}]}]}}" }
      ] },
    { id: "anatomy", title: "Anatomy of a manifest", toc: "Manifest anatomy",
      lead: "Every Kubernetes object has the same four top-level fields. You write three of them; the cluster writes the fourth.",
      blocks: [
        { type: "yaml", title: "deployment.yaml", lines: [
          ["apiVersion: apps/v1", "<b>Group/version</b> of the API. Deployments live in the <code>apps</code> group, version <code>v1</code>. Find it with <code>kubectl api-resources</code>."],
          ["kind: Deployment", "<b>Type of object.</b> Together with apiVersion it tells the API server which schema to validate against."],
          ["metadata:", "<b>Identity.</b> Name, namespace, labels, annotations. Same shape for every kind."],
          ["  name: game-service", "Unique per kind per namespace. Must be a DNS-1123 name: lowercase, digits, '-'."],
          ["  namespace: gamehub", "Which namespace. Omit it to use the current context's namespace."],
          ["  labels:", ""],
          ["    app: game-service", "<b>Labels</b> are key/value tags used by selectors (Services, Deployments, kubectl -l)."],
          ["spec:", "<b>Desired state.</b> Different for every kind. This is what you actually design."],
          ["  replicas: 2", "Keep 2 Pods running."],
          ["  selector:", ""],
          ["    matchLabels: {app: game-service}", "Which Pods this Deployment owns. Must match the template labels."],
          ["  template:", "<b>Pod template.</b> A full Pod spec without apiVersion/kind."],
          ["    metadata: {labels: {app: game-service}}", "Labels stamped on each Pod."],
          ["    spec:", ""],
          ["      containers:", ""],
          ["      - name: game-service", ""],
          ["        image: ttl.sh/game-service:1h", "Image to run."],
          ["# status: is written by controllers", "<b>status</b> is the observed state. Never write it; controllers and kubelet fill it in. <code>kubectl get -o yaml</code> shows it."]
        ] },
        { type: "callout", kind: "info", html: "Unknown or misspelled fields are rejected by server-side field validation (strict by default for kubectl since v1.27): <code>error: strict decoding error: unknown field \"spec.replica\"</code>." }
      ] },
    { id: "generate", title: "Generate YAML instead of typing it", toc: "Generate YAML",
      lead: "Nobody writes manifests from memory. Generate a correct skeleton, then edit it.",
      blocks: [
        { type: "term", title: "generators", lines: [
          "$ kubectl run web --image=nginx --port=80 --dry-run=client -o yaml > pod.yaml",
          "$ kubectl create deployment game --image=nginx --replicas=2 --dry-run=client -o yaml > deploy.yaml",
          "$ kubectl create service clusterip game --tcp=80:8081 --dry-run=client -o yaml",
          "$ kubectl create configmap app --from-literal=MODE=dev --dry-run=client -o yaml",
          "$ kubectl create secret generic db --from-literal=password=s3cr3t --dry-run=client -o yaml",
          "$ kubectl expose deployment game --port=80 --target-port=8081 --dry-run=client -o yaml",
          "$ kubectl explain deployment.spec.strategy.rollingUpdate",
          "$ kubectl apply -f deploy.yaml --dry-run=server     # validate against the live API",
          "$ kubectl diff -f deploy.yaml                        # what would change",
          "✓ client dry-run = no API call; server dry-run = full validation + admission, nothing stored"
        ] },
        { type: "compare", cols: [
          { title: "Imperative", chip: "kubectl create/run/scale", chipClass: "amber", color: "var(--amber)", items: ["Fast for experiments and exams", "No file, no history", "Hard to review or repeat"] },
          { title: "Declarative", chip: "kubectl apply -f", chipClass: "green", color: "var(--green)", items: ["Files in Git are the source of truth", "Reviewable, repeatable, diffable", "Foundation of GitOps (Argo CD, Flux)"] }
        ] }
      ] },
    { id: "kubeconfig", title: "kubeconfig: where and as whom", toc: "kubeconfig",
      lead: "kubectl reads <code>~/.kube/config</code> (or every file in <code>$KUBECONFIG</code>, merged). It holds three lists and one pointer.",
      blocks: [
        { type: "yaml", title: "~/.kube/config", lines: [
          ["apiVersion: v1", ""],
          ["kind: Config", "kubeconfig is also a Kubernetes-style object, but it lives only on your machine."],
          ["clusters:", "<b>Where</b>: API server URLs plus the CA to trust."],
          ["- name: kind-lab", ""],
          ["  cluster:", ""],
          ["    server: https://127.0.0.1:6443", "API server endpoint."],
          ["    certificate-authority-data: LS0t...", "Base64 cluster CA certificate. kubectl uses it to verify the server's TLS certificate."],
          ["users:", "<b>Who</b>: credentials. Client certs, tokens or an exec plugin (cloud CLIs, OIDC)."],
          ["- name: jane", ""],
          ["  user:", ""],
          ["    client-certificate-data: LS0t...", "Client certificate (CN = username). See <a href=\"security-users-csr.html\">Users, certificates & CSRs</a>."],
          ["    client-key-data: LS0t...", "Private key. Anyone with this file is jane: protect it like a password."],
          ["contexts:", "<b>Combinations</b> of cluster + user + default namespace."],
          ["- name: lab-jane", ""],
          ["  context: {cluster: kind-lab, user: jane, namespace: dev}", "This context sends requests to kind-lab as jane, defaulting to namespace dev."],
          ["current-context: lab-jane", "<b>The pointer.</b> Every kubectl command uses this unless you pass --context."]
        ] },
        { type: "h3", text: "Switch contexts" },
        { type: "custom", html: kcHtml, init: initKc },
        { type: "term", title: "kubeconfig commands", lines: [
          "$ kubectl config get-contexts",
          "$ kubectl config current-context",
          "$ kubectl config use-context prod",
          "$ kubectl config set-context --current --namespace=gamehub",
          "$ KUBECONFIG=~/.kube/config:~/sks.kubeconfig kubectl config view --flatten > /tmp/merged && mv /tmp/merged ~/.kube/config",
          "$ kubectl --context lab-jane get pods          # one-off, no switch",
          "$ kubectl config view --minify                 # only the active context"
        ] },
        { type: "callout", kind: "warn", html: "Most production accidents with kubectl are 'right command, wrong context'. Show the context in your shell prompt (kube-ps1, starship) and use separate kubeconfig files for production." }
      ] }
  ],
  summary: {
    takeaways: [
      ["↔️", "Spaces, never tabs", "Indentation defines structure. Lists start with '- '."],
      ["🧱", "4 top-level fields", "apiVersion, kind, metadata, spec; status is written by the cluster."],
      ["🏷️", "Labels connect objects", "Selectors match labels; Deployment selector must match template labels."],
      ["⚡", "Generate with dry-run", "kubectl create … --dry-run=client -o yaml, then edit."],
      ["🧭", "Context = cluster + user + ns", "current-context decides where every command goes."],
      ["🔐", "kubeconfig is a credential", "Keep it private; separate prod files."]
    ],
    cheat: `kubectl create deploy web --image=nginx --dry-run=client -o yaml > web.yaml
kubectl explain pod.spec.containers.resources
kubectl apply -f web.yaml --dry-run=server
kubectl diff -f web.yaml && kubectl apply -f web.yaml
kubectl config get-contexts
kubectl config use-context <name>
kubectl config set-context --current --namespace=<ns>`,
    quiz: [
      ["Which field is written by the cluster, not by you?", ["spec", "metadata", "status", "kind"], 2, "status reflects observed state reported by controllers and kubelet."],
      ["What separates multiple objects in one YAML file?", ["###", "---", "===", "A blank line"], 1, "Three dashes start a new YAML document."],
      ["--dry-run=server differs from --dry-run=client because it…", ["Stores the object", "Runs full API validation and admission without persisting", "Only checks indentation", "Requires cluster-admin"], 1, "Server dry-run exercises the real API path but writes nothing to etcd."],
      ["A kubeconfig context combines…", ["Cluster, user and default namespace", "Pod and node", "CA and key", "Image and tag"], 0, "Context = cluster + user (+ namespace)."],
      ["Value 'enabled: yes' in ConfigMap data fails because…", ["yes is a reserved word", "It parses as boolean; ConfigMap data must be strings", "ConfigMaps can't hold flags", "Missing indentation"], 1, "Quote it: enabled: \"yes\"."]
    ]
  }
});
</script>
</body>
</html>
