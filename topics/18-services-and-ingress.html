<script>
// Service type explorer: path, reachability and YAML per type.
const TYPES = {
  ClusterIP: { path: ["Pod in cluster", "ClusterIP 10.96.0.100:80", "kube-proxy DNAT", "Pod :8080"], from: "inside the cluster only", yaml: "spec:\n  type: ClusterIP          # default\n  selector: {app: game-service}\n  ports:\n  - port: 80               # Service port\n    targetPort: 8081       # container port", note: "Default. Stable internal VIP + DNS name. All GameHub services are ClusterIP; only the Gateway is public." },
  NodePort: { path: ["Client", "NodeIP:31188", "kube-proxy DNAT", "Pod :8080"], from: "any node IP on a high port", yaml: "spec:\n  type: NodePort\n  selector: {app: web}\n  ports:\n  - port: 80\n    targetPort: 8080\n    nodePort: 31188        # 30000-32767, random if omitted", note: "Builds on ClusterIP and opens the same port on every node. Fine for labs and bare metal behind your own LB; awkward ports and node IPs change." },
  LoadBalancer: { path: ["Internet", "Cloud LB 203.0.113.10:80", "NodePort on nodes", "Pod :8080"], from: "a public/private IP from the cloud", yaml: "spec:\n  type: LoadBalancer\n  selector: {app: web}\n  ports:\n  - port: 80\n    targetPort: 8080\n  externalTrafficPolicy: Local   # keep client IP", note: "Builds on NodePort. The cloud-controller-manager provisions an external LB (Exoscale NLB, AWS NLB…). On bare metal use MetalLB or kube-vip. One LB per Service gets expensive: that's why Ingress/Gateway exist." },
  ExternalName: { path: ["Pod", "DNS external-db-service", "CNAME", "my-database-service.database-ns.svc.cluster.local"], from: "DNS only, no proxying", yaml: "spec:\n  type: ExternalName\n  externalName: my-database-service.database-ns.svc.cluster.local\n  ports:\n  - port: 5432", note: "No selector, no IP: CoreDNS returns a CNAME. Course use: an app in application-ns reaches a DB Service in database-ns by a local name. Also for external SaaS hosts." },
  Headless: { path: ["Pod", "DNS postgres", "A records", "each Pod IP directly"], from: "DNS returns Pod IPs", yaml: "spec:\n  clusterIP: None\n  selector: {app: postgres}\n  ports:\n  - port: 5432", note: "No VIP and no load balancing. Clients get all Pod IPs (and per-Pod names with StatefulSets). For databases and peer discovery." }
};
const typeHtml = `
<div class="sim glass">
  <div class="ctrl" style="margin:0 0 14px">${Object.keys(TYPES).map((t, i) => `<button class="btn small ${i ? "" : "primary"}" data-t="${t}">${t}</button>`).join("")}</div>
  <div id="tPath" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px" class="t2">
    <div id="tYaml"></div>
    <div class="flow-caption" id="tNote"></div>
  </div>
</div>`;
function initType(el) {
  const $ = s => el.querySelector(s);
  if (innerWidth < 760) { $(".t2").style.gridTemplateColumns = "1fr"; $("#tPath").style.gridTemplateColumns = "1fr 1fr"; }
  let tm = [];
  const show = t => {
    tm.forEach(clearTimeout); tm = [];
    el.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("primary", b.dataset.t === t));
    const d = TYPES[t];
    $("#tPath").innerHTML = d.path.map(p => `<div class="stage"><b style="font:600 12.5px var(--mono)">${p}</b></div>`).join("");
    const st = $("#tPath").querySelectorAll(".stage");
    st.forEach((s, i) => tm.push(setTimeout(() => { if (i) st[i - 1].classList.replace("hit", "pass"); s.classList.add("hit"); }, 300 + i * 500)));
    $("#tYaml").innerHTML = K8S_CODE(t + " Service", d.yaml);
    $("#tNote").innerHTML = `<h4>Reachable from: ${d.from}</h4><p>${d.note}</p>`;
    K8S.initCopy(el);
  };
  el.querySelectorAll("[data-t]").forEach(b => b.onclick = () => show(b.dataset.t));
  show("ClusterIP");
}

  title: '<span class="grad-text">Services</span>, Ingress & ExternalDNS',
  lead: "Pods are ephemeral; Services give them a stable name and address. Ingress (and its successor Gateway API) then shares one public entry point across many Services.",
  parts: [["Selectors & endpoints", "How a Service finds Pods"], ["Service types", "ClusterIP → LoadBalancer"], ["Ports", "port, targetPort, nodePort"], ["Ingress", "Host/path routing"], ["ExternalDNS", "DNS records from Services"]],
  sections: [
    { id: "endpoints", title: "Selectors and EndpointSlices", toc: "Selectors & endpoints",
      lead: "A Service has a label selector. The EndpointSlice controller keeps a list of ready Pod IPs that match. kube-proxy and CoreDNS read that list.",
      blocks: [
        { type: "flow", nodes: [
          ["🏷️", "Selector", "Service selects run=nginx", "<code>kubectl expose pod nginx --port 80</code> creates Service nginx with selector <code>run: nginx</code>."],
          ["📋", "EndpointSlice", "Controller lists matching Pods", "Only Pods that are Running and <b>Ready</b> are added as endpoints."],
          ["➕", "Relabel", "Add a second Pod by label", "Course trick: <code>kubectl label pod nginx2 run=nginx --overwrite</code>. nginx2 joins the Service instantly; no Service edit needed."],
          ["⚙️", "kube-proxy", "Rules updated", "Every node's kube-proxy sees the new endpoint and updates its NAT rules."],
          ["🔀", "Traffic", "Spread across both Pods", "Connections to the ClusterIP now land on nginx or nginx2."]
        ] },
        { type: "term", title: "course", lines: [
          "$ kubectl run nginx --image=nginx; kubectl run nginx2 --image=nginx",

          "$ kubectl expose pod nginx --port 80",
          "$ kubectl get endpointslices -l kubernetes.io/service-name=nginx",
          "nginx-x7k2p   IPv4   80   10.244.1.12",
          "$ kubectl label pod nginx2 run=nginx --overwrite",
          "$ kubectl get endpointslices -l kubernetes.io/service-name=nginx",
          "nginx-x7k2p   IPv4   80   10.244.1.12,10.244.2.7",

        ] }
      ] },
    { id: "types", title: "Service types", toc: "Service types",

    { id: "ingress", title: "Ingress: one entry, many Services", toc: "Ingress",
      lead: "An Ingress is a set of HTTP routing rules (host + path → Service). An Ingress controller (ingress-nginx, Traefik, HAProxy…) watches them and configures its proxy. The controller itself is exposed by one LoadBalancer.",
      blocks: [
        { type: "pipeline", stages: [["Client", "demo.<ip>.nip.io/public"], ["LoadBalancer", "controller Service"], ["Ingress controller", "nginx Pods"], ["Rule match", "host + path"], ["Service", "nginx-service:80"], ["Pod", ""]],
          scenarios: [
            { label: "GET /", notes: ["DNS via nip.io → LB IP", "", "", "host demo.… path / Prefix", "", ""], out: '<span style="color:var(--green)">✓ 200 from nginx Pod</span>' },
            { label: "GET /public", notes: ["", "", "", "path /public Prefix", "", ""], out: '<span style="color:var(--green)">✓ 200 (same backend in the course, different paths possible)</span>' },
            { label: "Wrong host", path: [0, 1, 2, 3], fail: 3, out: '<span style="color:var(--red)">✗ 404 from the controller default backend: no rule for this Host header</span>' }
          ] },
        { type: "code", title: "services/Ingress/ingress.yaml", code: `kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.9.4/deploy/static/provider/cloud/deploy.yaml

metadata:
  name: course

  ingressClassName: nginx

      ] },
    { id: "externaldns", title: "ExternalDNS: DNS records from Services", toc: "ExternalDNS",

      blocks: [

spec:

        { type: "flow", nodes: [
          ["🧾", "Annotate", "Service with hostname annotation", "You declare the DNS name next to the Service."],
