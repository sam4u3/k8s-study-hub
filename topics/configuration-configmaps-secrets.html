<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConfigMaps and Secrets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
const b64Html = `
<div class="sim glass">
  <div class="sim-row"><label>Secret value (stringData)<input class="input" id="sv" value="KubeRocks" spellcheck="false"></label></div>
  <div class="pipe-out" id="sb"></div>
</div>`;
function initB64(el) {
  const v = el.querySelector("#sv"), o = el.querySelector("#sb");
  const go = () => {
    let enc = ""; try { enc = btoa(unescape(encodeURIComponent(v.value))); } catch (e) { enc = "?"; }
    o.innerHTML = `<span class="faint"># what's stored in the Secret object (data:)</span><br>password: <b style="color:#fcd34d">${enc}</b><br><br><span class="faint"># anyone with 'get secrets' runs:</span><br>$ kubectl get secret demo-secret -o jsonpath='{.data.password}' | base64 -d<br><b style="color:var(--red)">${v.value.replace(/</g, "&lt;")}</b>  <span class="faint">← base64 is encoding, not encryption</span>`;
  };
  v.oninput = go; go();
}

const updHtml = `
<div class="sim glass">
  <div class="ctrl" style="margin:0 0 12px"><button class="btn primary" id="uEdit">kubectl edit cm app-config-dev  (debug=true → false)</button><button class="btn small" id="uReset">Reset</button></div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px" id="uGrid">
    <div class="box"><b style="font-size:13px">env / envFrom</b><div class="pipe-out" id="u1">DEBUG=true</div></div>
    <div class="box"><b style="font-size:13px">volume mount</b><div class="pipe-out" id="u2">/etc/config/settings.properties<br>debug=true</div></div>
    <div class="box"><b style="font-size:13px">volume + subPath</b><div class="pipe-out" id="u3">/etc/app.properties<br>debug=true</div></div>
  </div>
  <div class="pipe-out" id="uOut"></div>
</div>`;
function initUpd(el) {
  const $ = s => el.querySelector(s); let t = [];
  if (innerWidth < 760) $("#uGrid").style.gridTemplateColumns = "1fr";
  const reset = () => { t.forEach(clearTimeout); t = []; $("#u1").innerHTML = "DEBUG=true"; $("#u2").innerHTML = "/etc/config/settings.properties<br>debug=true"; $("#u3").innerHTML = "/etc/app.properties<br>debug=true"; $("#uOut").innerHTML = '<span class="faint"># three Pods consume the same ConfigMap three ways</span>'; };
  $("#uEdit").onclick = () => {
    reset();
    $("#uOut").innerHTML = "configmap/app-config-dev edited";
    t.push(setTimeout(() => { $("#uOut").innerHTML += "<br>t+5s … env: unchanged (read once at container start)"; }, 900));
    t.push(setTimeout(() => { $("#u2").innerHTML = '/etc/config/settings.properties<br><b style="color:var(--green)">debug=false</b>'; $("#uOut").innerHTML += "<br>t+~60s volume: kubelet sync updated the file atomically (symlink swap). App must re-read it."; }, 2200));
    t.push(setTimeout(() => { $("#uOut").innerHTML += '<br>subPath: <b style="color:var(--amber)">never updated</b> (bind-mounted file, not the symlinked dir)<br><span style="color:var(--green)">✓ for env and subPath: kubectl rollout restart deploy/&lt;name&gt;</span>'; }, 3300));
  };
  $("#uReset").onclick = reset; reset();
}

K8S_RENDER({
  id: "config-cm-secrets", group: "configuration", minutes: 25,
  title: '<span class="grad-text">ConfigMaps</span> & <span class="grad-text">Secrets</span>',
  lead: "Build one image, run it everywhere. Environment-specific settings live in ConfigMaps; sensitive values live in Secrets. Both are injected at runtime as environment variables or files.",
  parts: [["Create", "Literals, files, YAML"], ["Consume", "env, envFrom, volumes"], ["Updates", "What reloads, what doesn't"], ["Secrets", "base64 ≠ encrypted"], ["Encryption at rest", "EncryptionConfiguration"]],
  sections: [
    { id: "create", title: "Create ConfigMaps", toc: "Create",
      blocks: [
        { type: "tabs", tabs: [
          { label: "Key/value YAML", blocks: [{ type: "code", title: "cm1.yaml", code: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app-settings\ndata:\n  username: \"app_user\"\n  database_name: \"exampledb\"" }] },
          { label: "Config file inside", blocks: [{ type: "code", title: "cm2.yaml", code: "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app-config-dev\ndata:\n  settings.properties: |\n    # Development Configuration\n    debug=true\n    database_url=http://dev-db.example.com\n    featureX_enabled=false" }] },
          { label: "Imperative", blocks: [{ type: "term", title: "kubectl create configmap", lines: [
            "$ kubectl create configmap app --from-literal=MODE=dev --from-literal=LOG=debug",
            "$ kubectl create configmap nginx-config --from-file=nginx.conf",
            "$ kubectl create configmap init-sql --from-file=init.sql=./init.sql -n gamehub",
            "$ kubectl create configmap env --from-env-file=.env",
            "$ kubectl get cm app -o yaml"] }] }
        ] },
        { type: "callout", kind: "info", html: "Limit: 1 MiB per ConfigMap/Secret (etcd object size). Values must be strings. Mark stable configs <code>immutable: true</code>: it prevents accidents and the kubelet stops watching them (less API load)." }
      ] },
    { id: "consume", title: "Consume them in Pods", toc: "Consume",
      blocks: [
        { type: "yaml", title: "pod3.yaml (mysql)", lines: [
          ["containers:", ""],
          ["- name: mysql", ""],
          ["  image: mysql:5.7", ""],
          ["  env:", "<b>env</b> sets individual variables, each from a different source."],
          ["  - name: MYSQL_ROOT_PASSWORD", ""],
          ["    valueFrom:", ""],
          ["      secretKeyRef: {name: mysql-root-pass, key: password}", "From a <b>Secret</b> key. If the Secret or key is missing, the container fails to start (<code>CreateContainerConfigError</code>) unless <code>optional: true</code>."],
          ["  - name: MYSQL_USER", ""],
          ["    valueFrom:", ""],
          ["      configMapKeyRef: {name: app-settings, key: username}", "From a <b>ConfigMap</b> key."],
          ["  - name: MYSQL_DATABASE", ""],
          ["    valueFrom:", ""],
          ["      configMapKeyRef: {name: app-settings, key: database_name}", ""],
          ["  # envFrom: [{configMapRef: {name: app}}]", "<b>envFrom</b> imports <i>every</i> key as a variable. Short, but you lose an explicit list."],
          ["  volumeMounts:", ""],
          ["  - {name: config-volume, mountPath: /etc/config}", "<b>Files:</b> every key becomes a file in /etc/config. Best for whole config files."],
          ["volumes:", ""],
          ["- name: config-volume", ""],
          ["  configMap: {name: app-config-dev}", "Volume source. Use <code>items</code> to pick keys and set file names; <code>defaultMode</code> for permissions."]
        ] },
        { type: "h3", text: "What happens when you edit the ConfigMap?" },
        { type: "custom", html: updHtml, init: initUpd },
        { type: "callout", kind: "tip", html: "Pattern for automatic rollouts on config change: put a hash of the config in a Pod template annotation (Helm <code>checksum/config</code>, Kustomize <code>configMapGenerator</code> name suffix). Changing the config changes the template → rolling update." }
      ] },
    { id: "secrets", title: "Secrets", toc: "Secrets",
      lead: "Same API shape as ConfigMaps, with different handling: base64 in <code>data</code>, tmpfs when mounted, separate RBAC, optional encryption at rest.",
      blocks: [
        { type: "custom", html: b64Html, init: initB64 },
        { type: "table", head: ["Type", "Used for", "Create with"], rows: [
          ["<code>Opaque</code>", "Arbitrary key/values (passwords, API keys)", "<code>kubectl create secret generic db --from-literal=password=…</code>"],
          ["<code>kubernetes.io/dockerconfigjson</code>", "Private registry credentials (imagePullSecrets)", "<code>kubectl create secret docker-registry pullsec --docker-server=… --docker-username=… --docker-password=…</code>"],
          ["<code>kubernetes.io/tls</code>", "TLS cert + key (Ingress, Gateway)", "<code>kubectl create secret tls web-tls --cert=tls.crt --key=tls.key</code>"],
          ["<code>kubernetes.io/basic-auth</code>, <code>ssh-auth</code>", "Typed credentials", "YAML"]
        ] },
        { type: "code", title: "pod4.yaml: private image", code: "apiVersion: v1\nkind: Pod\nmetadata:\n  name: private-image-pod\nspec:\n  containers:\n  - name: app\n    image: registry.example.com/private/demo:v1\n  imagePullSecrets:\n  - name: pullsec        # docker-registry Secret in the same namespace" },
        { type: "callout", kind: "warn", html: "Things that leak Secrets: committing YAML with <code>data:</code> to Git (it's only base64), granting <code>list secrets</code> broadly, env vars showing up in crash dumps or <code>/proc</code>, and anyone who can create Pods in the namespace (they can mount any Secret there). For GitOps use Sealed Secrets, SOPS or External Secrets Operator with a vault." }
      ] },
    { id: "encryption", title: "Encryption at rest", toc: "Encryption at rest",
      lead: "By default Secrets sit in etcd as plain bytes. Anyone with an etcd backup reads them. Here is how to enable AES-CBC encryption on a kubeadm API server.",
      blocks: [
        { type: "steps", steps: [
          { title: "Write EncryptionConfiguration", where: "Control plane", whereClass: "violet", why: "Providers are tried in order for writes (first one) and all are tried for reads. <code>identity</code> last lets the server still read old plaintext data.", code: "head -c 32 /dev/urandom | base64      # generate key\nsudo mkdir -p /etc/kubernetes/enc\ncat <<EOF | sudo tee /etc/kubernetes/enc/enc.yaml\napiVersion: apiserver.config.k8s.io/v1\nkind: EncryptionConfiguration\nresources:\n  - resources:\n      - secrets\n    providers:\n      - aescbc:\n          keys:\n            - name: key1\n              secret: <BASE64_32_BYTE_KEY>\n      - identity: {}\nEOF" },
          { title: "Point kube-apiserver at it", where: "Control plane", whereClass: "violet", why: "Edit the static Pod manifest. The kubelet notices the change and restarts the API server (a minute of API downtime on single-node).", code: "sudo vi /etc/kubernetes/manifests/kube-apiserver.yaml\n# command:\n#   - --encryption-provider-config=/etc/kubernetes/enc/enc.yaml\n# volumeMounts:\n#   - {name: enc, mountPath: /etc/kubernetes/enc, readOnly: true}\n# volumes:\n#   - {name: enc, hostPath: {path: /etc/kubernetes/enc, type: DirectoryOrCreate}}" },
          { title: "Create and verify in etcd", where: "Control plane", whereClass: "violet", why: "Read the raw key from etcd. Encrypted values start with the provider prefix instead of readable text.", code: "kubectl create secret generic demo-secret --from-literal=password=KubeRocks\n\nexport ETCDCTL_API=3\nexport ETCDCTL_CACERT=/etc/kubernetes/pki/etcd/ca.crt\nexport ETCDCTL_CERT=/etc/kubernetes/pki/etcd/server.crt\nexport ETCDCTL_KEY=/etc/kubernetes/pki/etcd/server.key\nsudo -E etcdctl get /registry/secrets/default/demo-secret | hexdump -C | head\n# expect: k8s:enc:aescbc:v1:key1:…  (not 'KubeRocks')" },
          { title: "Re-encrypt existing Secrets", where: "Control plane", whereClass: "violet", why: "Old Secrets stay plaintext until rewritten. Replace them all once.", code: "kubectl get secrets -A -o json | kubectl replace -f -" }
        ] },
        { type: "callout", kind: "info", html: "For production prefer the <code>kms</code> v2 provider (keys in a cloud KMS or HSM) over a static aescbc key sitting on the control-plane disk. Managed clusters usually offer this as a checkbox." }
      ] }
  ],
  summary: {
    takeaways: [
      ["📦", "One image, many configs", "ConfigMaps for settings, Secrets for credentials."],
      ["🔀", "env vs files", "env is fixed at start; volumes update (not subPath)."],
      ["🔤", "base64 ≠ security", "Protect with RBAC, encryption at rest, external secret stores."],
      ["🔒", "Encrypt etcd", "EncryptionConfiguration (aescbc/kms) on kube-apiserver."],
      ["🐳", "imagePullSecrets", "docker-registry Secret for private images."],
      ["🧊", "immutable: true", "Safer, and less kubelet watch load."]
    ],
    cheat: `kubectl create cm app --from-literal=K=V --from-file=app.conf
kubectl create secret generic db --from-literal=password=x
kubectl create secret docker-registry pullsec --docker-server=… --docker-username=… --docker-password=…
kubectl get secret db -o jsonpath='{.data.password}' | base64 -d
kubectl set env deploy/web --from=configmap/app
kubectl rollout restart deploy/web`,
    quiz: [
      ["You change a ConfigMap used via envFrom. The running app sees…", ["New values immediately", "Old values until the container restarts", "An error", "New values after 60 s"], 1, "Environment variables are set at process start."],
      ["Which consumption method never receives updates?", ["Volume mount", "Volume with subPath", "Projected volume", "Downward API"], 1, "subPath bind-mounts a single file."],
      ["What does base64 in a Secret provide?", ["Encryption", "Safe transport of binary data in YAML/JSON", "Compression", "Signing"], 1, "Anyone can decode it."],
      ["How do you confirm encryption at rest works?", ["kubectl get secret -o yaml", "Read the raw key with etcdctl and look for the k8s:enc: prefix", "Check Pod env", "kubectl describe secret"], 1, "kubectl always shows decrypted data."],
      ["Secret type for private registry credentials?", ["Opaque", "kubernetes.io/tls", "kubernetes.io/dockerconfigjson", "bootstrap.kubernetes.io/token"], 2, "Referenced from imagePullSecrets."]
    ]
  }
});
</script>
</body>
</html>
