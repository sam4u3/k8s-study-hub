<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Objects and Metadata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
// Finalizer simulator: delete an object that still has finalizers.
const finHtml = `
<div class="sim glass">
  <div class="sim-row"><label><span><input type="checkbox" id="fA" checked> finalizer <code>kubernetes.io/pvc-protection</code> (PVC still used by a Pod)</span></label></div>
  <div class="sim-row"><label><span><input type="checkbox" id="fB"> finalizer <code>example.com/cleanup-bucket</code> (custom controller)</span></label></div>
  <div class="ctrl" style="margin:0 0 12px"><button class="btn primary" id="fDel">kubectl delete pvc data</button><button class="btn small" id="fPod">Delete the Pod using it</button><button class="btn small" id="fCtl">Controller finishes cleanup</button></div>
  <div class="box" id="fObj" style="font:12.5px/1.7 var(--mono)"></div>
  <div class="pipe-out" id="fOut"></div>
</div>`;
function initFin(el) {
  const $ = s => el.querySelector(s);
  let st;
  const reset = () => { st = { deleting: false, gone: false, fins: [] }; if ($("#fA").checked) st.fins.push("kubernetes.io/pvc-protection"); if ($("#fB").checked) st.fins.push("example.com/cleanup-bucket"); draw("<span class='faint'># object exists normally</span>"); };
  const draw = msg => {
    $("#fObj").innerHTML = st.gone ? '<span style="color:var(--faint)">— object removed from etcd —</span>' :
      `metadata:<br>&nbsp;&nbsp;name: data<br>${st.deleting ? '&nbsp;&nbsp;<span style="color:#fcd34d">deletionTimestamp: "2026-10-13T10:00:00Z"</span><br>' : ""}&nbsp;&nbsp;finalizers: ${st.fins.length ? "<br>" + st.fins.map(f => `&nbsp;&nbsp;- <span style="color:#c4b5fd">${f}</span>`).join("<br>") : "[]"}<br>status:<br>&nbsp;&nbsp;phase: ${st.deleting ? '<span style="color:#fcd34d">Terminating</span>' : "Bound"}`;
    $("#fOut").innerHTML = msg;
  };
  const maybeGone = () => { if (st.deleting && !st.fins.length) { st.gone = true; return "<br><span style='color:var(--green)'>✓ finalizers empty → API server removes the object</span>"; } return ""; };
  $("#fDel").onclick = () => { if (st.gone) reset(); st.deleting = true; draw("deletionTimestamp set; object stays while finalizers remain" + maybeGone()); };
  $("#fPod").onclick = () => { if (!st.deleting) return draw("delete the PVC first to see the effect"); st.fins = st.fins.filter(f => f !== "kubernetes.io/pvc-protection"); draw("Pod gone → PVC protection controller removes its finalizer" + maybeGone()); };
  $("#fCtl").onclick = () => { if (!st.deleting) return draw("delete the PVC first to see the effect"); st.fins = st.fins.filter(f => f !== "example.com/cleanup-bucket"); draw("custom controller deleted the bucket → removes its finalizer" + maybeGone()); };
  ["#fA", "#fB"].forEach(s => $(s).onchange = reset);
  reset();
}

// Server-side apply: field managers and conflicts.
const ssaHtml = `
<div class="sim glass">
  <div class="ctrl" style="margin:0 0 12px">
    <button class="btn small" data-a="git">GitOps applies replicas: 3</button>
    <button class="btn small" data-a="hpa">HPA sets replicas: 7</button>
    <button class="btn small" data-a="git2">GitOps re-applies replicas: 3</button>
    <button class="btn small" data-a="force">… with --force-conflicts</button>
    <button class="btn small" data-a="drop">GitOps removes replicas from its YAML</button>
  </div>
  <div class="pipe-out" id="ssaOut"></div>
</div>`;
function initSsa(el) {
  const out = el.querySelector("#ssaOut");
  let owner = null, val = null;
  const show = m => { out.innerHTML = `${m}<br><span class="faint">spec.replicas = ${val ?? "∅"} · managedFields owner: ${owner ?? "none"}</span>`; };
  el.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "git") { owner = "argocd"; val = 3; show('<span style="color:var(--green)">✓ applied; field manager "argocd" now owns spec.replicas</span>'); }
    if (a === "hpa") { if (!owner) return show("apply from GitOps first"); owner = "horizontal-pod-autoscaler"; val = 7; show('HPA updates the scale subresource; ownership of spec.replicas moves to the HPA'); }
    if (a === "git2") { if (owner === "horizontal-pod-autoscaler") show('<span style="color:var(--red)">✗ Apply failed with 1 conflict: conflict with "horizontal-pod-autoscaler": .spec.replicas</span>'); else { owner = "argocd"; val = 3; show('<span style="color:var(--green)">✓ no conflict</span>'); } }
    if (a === "force") { owner = "argocd"; val = 3; show('<span style="color:var(--amber)">⚠ forced: argocd takes ownership and resets to 3; the HPA will fight back on its next sync</span>'); }
    if (a === "drop") { if (owner === "argocd") { owner = null; show('field released; value stays 3 until someone else sets it'); } else show('<span style="color:var(--green)">✓ the right fix: remove replicas from Git when an HPA manages it</span>'); }
  });
  show("<span class='faint'># a Deployment managed by GitOps and an HPA</span>");
}

K8S_RENDER({
  id: "23-objects", group: "foundations", minutes: 25,
  title: 'Objects, labels & <span class="grad-text">finalizers</span>',
  lead: "Every Kubernetes object carries the same metadata. Knowing what each field does explains why namespaces hang in Terminating, why deleting a Deployment deletes its Pods, and why two tools fight over replicas.",
  parts: [["Identity", "Names, UIDs, namespaces"], ["Labels vs annotations", "Select vs describe"], ["Finalizers", "Deletion with cleanup"], ["Owners & GC", "Cascading deletion"], ["Object management", "Apply, server-side apply, Kustomize"]],
  sections: [
    { id: "identity", title: "Identity: names, UIDs and namespaces", toc: "Identity",
      blocks: [
        { type: "yaml", title: "kubectl get deploy web -o yaml (metadata)", lines: [
          ["metadata:", ""],
          ["  name: web", "<b>Name</b>: unique per kind per namespace. Most kinds require DNS subdomain format (lowercase, digits, '-', '.', ≤253 chars)."],
          ["  generateName: web-", "Alternative to name: the server appends a random suffix (Pods of a ReplicaSet use this)."],
          ["  namespace: default", "<b>Namespace</b>: scope for names, RBAC and quotas. Cluster-scoped kinds (Node, PV, ClusterRole) have none."],
          ["  uid: 5f0c8a3e-9d0b-4b0f-…", "<b>UID</b>: unique for the cluster's whole history. A deleted and recreated 'web' gets a new UID; owner references use UIDs."],
          ["  resourceVersion: \"184213\"", "Opaque version for optimistic concurrency and watches. Updating with a stale version returns <code>409 Conflict</code>."],
          ["  generation: 4", "Increments when <code>spec</code> changes. Controllers report <code>status.observedGeneration</code> when they've caught up."],
          ["  labels: {app: web, app.kubernetes.io/part-of: gamehub}", "<b>Labels</b>: identifying, selectable."],
          ["  annotations: {kubernetes.io/change-cause: \"nginx 1.27\"}", "<b>Annotations</b>: non-identifying data for tools and humans."],
          ["  finalizers: []", "Keys that block deletion until cleared."],
          ["  ownerReferences: []", "Links to owners for garbage collection."],
          ["  managedFields: […]", "Which field manager (kubectl, controller, GitOps) owns which fields. Hidden by default; show with <code>--show-managed-fields</code>."]
        ] },
        { type: "callout", kind: "info", html: "Namespaces are not nested and not a security boundary on their own. Combine them with RBAC, NetworkPolicies, ResourceQuotas and Pod Security labels. Four namespaces exist from the start: <code>default</code>, <code>kube-system</code>, <code>kube-public</code>, <code>kube-node-lease</code>." }
      ] },
    { id: "labels", title: "Labels vs annotations", toc: "Labels vs annotations",
      blocks: [
        { type: "compare", cols: [
          { title: "Labels", chip: "for selecting", chipClass: "blue", color: "var(--k8s-2)", items: ["Short key/values: value ≤63 chars", "Indexed: used by selectors (Services, Deployments, NetworkPolicies, kubectl -l)", "Changing them changes behaviour", "Example: <code>app.kubernetes.io/name: gamehub</code>"] },
          { title: "Annotations", chip: "for describing", chipClass: "violet", color: "var(--violet)", items: ["Any size up to 256 KiB total", "Not selectable", "Read by tools: cert-manager, Prometheus, Ingress controllers", "Example: <code>cert-manager.io/cluster-issuer: letsencrypt</code>"] }
        ] },
        { type: "table", head: ["Recommended label", "Example", "Meaning"], rows: [
          ["<code>app.kubernetes.io/name</code>", "postgres", "Application name"],
          ["<code>app.kubernetes.io/instance</code>", "gamehub-db", "Unique instance"],
          ["<code>app.kubernetes.io/version</code>", "16.4", "App version"],
          ["<code>app.kubernetes.io/component</code>", "database", "Role in the architecture"],
          ["<code>app.kubernetes.io/part-of</code>", "gamehub", "Higher-level application"],
          ["<code>app.kubernetes.io/managed-by</code>", "helm", "Tool managing it"]
        ] },
        { type: "term", title: "label & field selectors", lines: [
          "$ kubectl get pods -l 'app.kubernetes.io/part-of=gamehub,tier in (api,web)'",
          "$ kubectl get pods --field-selector status.phase=Running,spec.nodeName=wk1",
          "$ kubectl get events --field-selector involvedObject.kind=Pod,type=Warning",
          "$ kubectl label deploy web team=games",
          "$ kubectl annotate deploy web owner=alice@example.com",
          "✓ field selectors only support a few fields per kind (metadata.name, status.phase, spec.nodeName…)"
        ] }
      ] },
    { id: "finalizers", title: "Finalizers: deletion with cleanup", toc: "Finalizers",
      lead: "A finalizer is a key in <code>metadata.finalizers</code>. While it's there, a delete only sets <code>deletionTimestamp</code>; the object stays (Terminating) until the responsible controller does its cleanup and removes the key.",
      blocks: [
        { type: "custom", html: finHtml, init: initFin },
        { type: "callout", kind: "warn", html: "<b>Stuck in Terminating?</b> Find the finalizer and the controller that owns it. Removing a finalizer by hand (<code>kubectl patch … -p '{\"metadata\":{\"finalizers\":null}}' --type=merge</code>) skips the cleanup: cloud disks, load balancers or DNS records may be left behind. Do it only when the owning controller is gone for good." }
      ] },
    { id: "owners", title: "Owners, dependents and garbage collection", toc: "Owners & GC",
      blocks: [
        { type: "layers", items: [
          ["Deployment web (uid a1)", "owner", "#5b8cff"],
          ["ReplicaSet web-6d4cf (ownerReferences → a1, controller: true)", "dependent of Deployment, owner of Pods", "#8b5cf6"],
          ["Pods web-6d4cf-xxxxx (ownerReferences → ReplicaSet uid)", "dependents", "#34d399"]
        ] },
        { type: "table", head: ["propagationPolicy", "kubectl flag", "What happens"], rows: [
          ["<code>Background</code> (default)", "<code>--cascade=background</code>", "Owner deleted now; GC deletes dependents afterwards"],
          ["<code>Foreground</code>", "<code>--cascade=foreground</code>", "Owner gets <code>foregroundDeletion</code> finalizer; dependents (with blockOwnerDeletion) go first"],
          ["<code>Orphan</code>", "<code>--cascade=orphan</code>", "Dependents keep running; ownerReferences removed"]
        ] },
        { type: "callout", kind: "info", html: "Owner references must stay in the same namespace (or point to a cluster-scoped owner). The garbage collector also cleans finished Jobs with TTL, unused images and dead containers on nodes (kubelet GC). See the hands-on deletion demo in <a href=\"15-replicasets-and-deployments.html#owners\">ReplicaSets & Deployments</a>." }
      ] },
    { id: "management", title: "Object management: apply, server-side apply, Kustomize", toc: "Object management",
      blocks: [
        { type: "table", head: ["Technique", "Command", "Use"], rows: [
          ["Imperative commands", "<code>kubectl create deploy …</code>", "Learning, one-offs"],
          ["Imperative object config", "<code>kubectl create|replace -f</code>", "Simple scripts; replace overwrites"],
          ["Declarative (client-side apply)", "<code>kubectl apply -f</code>", "Merges using the last-applied-configuration annotation"],
          ["Server-side apply", "<code>kubectl apply --server-side -f</code>", "API server tracks field ownership per manager; detects conflicts; used by controllers and GitOps"]
        ] },
        { type: "h3", text: "Server-side apply: who owns spec.replicas?" },
        { type: "custom", html: ssaHtml, init: initSsa },
        { type: "code", title: "Kustomize (built into kubectl)", code: `# kustomization.yaml
resources:
- deployment.yaml
- service.yaml
namespace: crash-course
labels:                      # replaces deprecated commonLabels
- pairs:
    app.kubernetes.io/part-of: gamehub
images:
- name: ttl.sh/game-service
  newTag: "v2"
configMapGenerator:          # name gets a content hash suffix → config change triggers rollout
- name: app-config
  literals: [MODE=prod]
---
kubectl kustomize ./overlays/prod     # render
kubectl apply -k ./overlays/prod      # apply` }
      ] }
  ],
  summary: {
    takeaways: [
      ["🆔", "Name + UID", "Names can be reused; UIDs never are."],
      ["🏷️", "Labels select", "Annotations describe; only labels drive selectors."],
      ["⛔", "Finalizers block delete", "Terminating until the owning controller clears them."],
      ["🌳", "Owners cascade", "Background, Foreground or Orphan deletion."],
      ["🤝", "Server-side apply", "Field managers and conflicts prevent silent overwrites."],
      ["🧩", "Kustomize", "Overlays and generators without templates: kubectl apply -k."]
    ],
    cheat: `kubectl get <kind> <name> -o yaml --show-managed-fields
kubectl get pods -l app=web --show-labels
kubectl get pods --field-selector=status.phase!=Running
kubectl get ns <ns> -o jsonpath='{.spec.finalizers}{.metadata.finalizers}'
kubectl delete deploy web --cascade=orphan
kubectl apply --server-side --field-manager=me -f app.yaml
kubectl apply -k overlays/prod`,
    quiz: [
      ["What can you select on?", ["Annotations", "Labels", "managedFields", "UIDs"], 1, "Selectors match labels only."],
      ["A PVC is stuck Terminating. Why, typically?", ["etcd is down", "A finalizer (pvc-protection) remains because a Pod still uses it", "RBAC", "Wrong StorageClass"], 1, "Delete the Pod and the finalizer clears."],
      ["Which deletion keeps the dependents running?", ["Background", "Foreground", "Orphan", "Force"], 2, "Orphan removes owner references instead."],
      ["Server-side apply reports a conflict on .spec.replicas with the HPA. Best fix?", ["Always --force-conflicts", "Remove replicas from your applied manifest", "Delete the HPA", "Use kubectl replace"], 1, "Let the HPA own that field."],
      ["What changes when you recreate an object with the same name?", ["Nothing", "Its UID", "Its kind", "Its namespace"], 1, "UIDs are unique across the cluster's history."]
    ]
  }
});
</script>
</body>
</html>
