<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReplicaSets and Deployments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/glass.css">
<link rel="stylesheet" href="../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../assets/glass.js"></script>
<script src="../assets/topics.js"></script>
<script src="../assets/topic.js"></script>
<script>
// Rolling update simulator driven by replicas, maxSurge and maxUnavailable.
const rollHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>replicas: <b id="rpV">6</b><input class="input" type="range" min="2" max="10" value="6" id="rp"></label>
    <label>maxSurge: <b id="msV">1</b><input class="input" type="range" min="0" max="4" value="1" id="ms"></label>
    <label>maxUnavailable: <b id="muV">1</b><input class="input" type="range" min="0" max="4" value="1" id="mu"></label>
    <label>Strategy<select class="input" id="strat"><option>RollingUpdate</option><option>Recreate</option></select></label>
  </div>
  <div class="ctrl" style="margin:0 0 12px"><button class="btn primary" id="roll">▶ kubectl set image (v1 → v2)</button><span class="faint" id="rstat"></span></div>
  <div id="pods" style="display:flex;flex-wrap:wrap;gap:8px;min-height:44px"></div>
  <div class="pipe-out" id="rlog" style="max-height:180px;overflow:auto"></div>
</div>`;
function initRoll(el) {
  const $ = s => el.querySelector(s);
  let timer = null;
  const read = () => { ["rp", "ms", "mu"].forEach(id => $("#" + id + "V").textContent = $("#" + id).value); };
  const render = pods => {
    $("#pods").innerHTML = pods.map(p => `<span class="pill ${p.v === 1 ? "b" : "g"} ${p.s === "starting" ? "glow" : ""}" style="${p.s === "terminating" ? "opacity:.35;text-decoration:line-through" : ""}">${p.v === 1 ? "v1" : "v2"} ${p.s === "ready" ? "●" : p.s === "starting" ? "◌" : "✕"}</span>`).join("");
  };
  const idle = () => { read(); const n = +$("#rp").value; render(Array.from({ length: n }, () => ({ v: 1, s: "ready" }))); $("#rlog").innerHTML = '<span class="faint"># deployment web: all replicas on v1</span>'; $("#rstat").textContent = ""; };
  el.querySelectorAll("input,select").forEach(i => i.oninput = () => { clearInterval(timer); idle(); });
  $("#roll").onclick = () => {
    clearInterval(timer); read();
    const N = +$("#rp").value, surge = +$("#ms").value, unav = +$("#mu").value, strat = $("#strat").value;
    const log = m => { $("#rlog").innerHTML += "<br>" + m; $("#rlog").scrollTop = 1e6; };
    $("#rlog").innerHTML = `<span class="faint">$ kubectl set image deploy/web nginx=nginx:1.27 · strategy ${strat}${strat === "RollingUpdate" ? ` (maxSurge ${surge}, maxUnavailable ${unav})` : ""}</span>`;
    if (strat === "RollingUpdate" && surge === 0 && unav === 0) { log('<span style="color:var(--red)">✗ invalid: maxSurge and maxUnavailable cannot both be 0</span>'); return; }
    let pods = Array.from({ length: N }, () => ({ v: 1, s: "ready" }));
    let minAvail = N;
    if (strat === "Recreate") {
      let phase = 0;
      timer = setInterval(() => {
        if (phase === 0) { pods.forEach(p => p.s = "terminating"); log("scaled old ReplicaSet to 0 · <b style='color:var(--red)'>0 available: downtime</b>"); minAvail = 0; }
        else if (phase === 1) { pods = Array.from({ length: N }, () => ({ v: 2, s: "starting" })); log(`new ReplicaSet scaled to ${N}`); }
        else { pods.forEach(p => p.s = "ready"); log('<span style="color:var(--green)">✓ rollout complete · min available during rollout: 0</span>'); clearInterval(timer); }
        render(pods); phase++;
      }, 1100);
      render(pods); return;
    }
    const maxTotal = N + surge, minReady = N - unav;
    let step = 0;
    timer = setInterval(() => {
      step++;
      pods = pods.filter(p => p.s !== "terminating");
      pods.forEach(p => { if (p.s === "starting") p.s = "ready"; });
      // 1) scale up the new ReplicaSet within maxSurge
      const newCount = pods.filter(p => p.v === 2).length;
      const add = Math.max(0, Math.min(maxTotal - pods.length, N - newCount));
      for (let i = 0; i < add; i++) pods.push({ v: 2, s: "starting" });
      // 2) scale down the old ReplicaSet while keeping minReady available
      const oldReady = pods.filter(p => p.v === 1 && p.s === "ready");
      const readyNow = pods.filter(p => p.s === "ready").length;
      const killed = Math.max(0, Math.min(readyNow - minReady, oldReady.length));
      for (let i = 0; i < killed; i++) oldReady[i].s = "terminating";
      const avail = pods.filter(p => p.s === "ready").length;
      minAvail = Math.min(minAvail, avail);
      log(`step ${step}: total ${pods.length} (≤ ${maxTotal}) · available ${avail} (≥ ${minReady}) · new ${pods.filter(p => p.v === 2).length}/${N}${killed ? ` · terminating ${killed} old` : ""}${add > 0 ? ` · starting ${add} new` : ""}`);
      render(pods);
      if (pods.every(p => p.v === 2 && p.s === "ready") && pods.length === N) {
        log(`<span style="color:var(--green)">✓ successfully rolled out · min available during rollout: ${minAvail}/${N}</span>`); clearInterval(timer);
      }
      if (step > 40) clearInterval(timer);
    }, 1000);
    render(pods);
  };
  idle();
}

// Deletion propagation demo
const delHtml = `
<div class="sim glass">
  <div class="ctrl" style="margin:0 0 14px">${["Background", "Foreground", "Orphan"].map(m => `<button class="btn small" data-m="${m}">DELETE rs (${m})</button>`).join("")}<button class="btn small" id="dReset">Reset</button></div>
  <div style="display:grid;gap:10px;justify-items:center">
    <span class="pill v" id="dRs">ReplicaSet nginx-rs</span>
    <div class="flowline" style="width:60%"></div>
    <div id="dPods" style="display:flex;gap:8px"></div>
  </div>
  <div class="pipe-out" id="dOut"></div>
</div>`;
function initDel(el) {
  const $ = s => el.querySelector(s);
  let t = [];
  const reset = () => { t.forEach(clearTimeout); t = []; $("#dRs").style.opacity = 1; $("#dRs").textContent = "ReplicaSet nginx-rs"; $("#dPods").innerHTML = [1, 2, 3].map(i => `<span class="pill b" data-p>pod ${i}<br><span class="faint" style="font-size:10px">ownerRef → nginx-rs</span></span>`).join(""); $("#dOut").innerHTML = '<span class="faint"># each Pod has metadata.ownerReferences pointing at the ReplicaSet</span>'; };
  const later = (ms, fn) => t.push(setTimeout(fn, ms));
  el.querySelectorAll("[data-m]").forEach(b => b.onclick = () => {
    reset(); const m = b.dataset.m, pods = [...el.querySelectorAll("[data-p]")], out = $("#dOut");
    out.innerHTML = `<span class="faint">curl -X DELETE …/replicasets/nginx-rs -d '{"propagationPolicy":"${m}"}'</span>`;
    if (m === "Background") {
      later(500, () => { $("#dRs").style.opacity = .25; $("#dRs").textContent = "nginx-rs (deleted)"; out.innerHTML += "<br>1. owner deleted immediately, API returns"; });
      later(1400, () => { pods.forEach(p => p.style.opacity = .25); out.innerHTML += "<br>2. garbage collector deletes dependents in the background<br><span style='color:var(--green)'>✓ default for kubectl delete</span>"; });
    } else if (m === "Foreground") {
      later(500, () => { $("#dRs").textContent = "nginx-rs (deletionTimestamp + finalizer foregroundDeletion)"; out.innerHTML += "<br>1. owner marked 'deletion in progress', still visible"; });
      later(1400, () => { pods.forEach(p => p.style.opacity = .25); out.innerHTML += "<br>2. GC deletes all dependents first"; });
      later(2300, () => { $("#dRs").style.opacity = .25; out.innerHTML += "<br>3. finalizer removed, owner deleted last<br><span style='color:var(--green)'>✓ kubectl delete --cascade=foreground</span>"; });
    } else {
      later(500, () => { $("#dRs").style.opacity = .25; $("#dRs").textContent = "nginx-rs (deleted)"; out.innerHTML += "<br>1. owner deleted"; });
      later(1200, () => { pods.forEach(p => { p.classList.replace("b", "a"); p.innerHTML = p.innerHTML.replace("ownerRef → nginx-rs", "orphaned (no owner)"); }); out.innerHTML += "<br>2. ownerReferences removed, Pods keep running unmanaged<br><span style='color:var(--amber)'>⚠ kubectl delete --cascade=orphan · a new RS with a matching selector would adopt them</span>"; });
    }
  });
  $("#dReset").onclick = reset; reset();
}

K8S_RENDER({
  id: "workloads-deployments", group: "workloads", minutes: 30,
  title: 'ReplicaSets & <span class="grad-text">Deployments</span>',
  lead: "You almost never create Pods directly. A Deployment manages ReplicaSets, which manage Pods. That two-level hierarchy is what makes zero-downtime updates and one-command rollbacks possible.",
  parts: [["ReplicaSet", "Keep N Pods alive"], ["Ownership", "Deletion propagation"], ["Rolling updates", "maxSurge / maxUnavailable"], ["History & rollback", "undo, pause"], ["Canary", "Two Deployments, one Service"]],
  sections: [
    { id: "rs", title: "ReplicaSet: keep N matching Pods", toc: "ReplicaSet",
      lead: "A ReplicaSet counts Pods that match its selector, and creates or deletes Pods until the count equals replicas.",
      blocks: [
        { type: "yaml", title: "nginx-rs.yaml", lines: [
          ["apiVersion: apps/v1", ""],
          ["kind: ReplicaSet", ""],
          ["metadata:", ""],
          ["  name: nginx-rs", ""],
          ["spec:", ""],
          ["  replicas: 3", "<b>Desired count.</b> The controller reconciles toward this number forever."],
          ["  selector:", ""],
          ["    matchLabels:", ""],
          ["      app: nginx", "<b>Which Pods count.</b> Any Pod with app=nginx in the namespace, even one you created by hand."],
          ["  template:", "Blueprint for new Pods. Changing it does <b>not</b> update existing Pods (that's what Deployments add)."],
          ["    metadata:", ""],
          ["      labels:", ""],
          ["        app: nginx", "Must match the selector or the API rejects the object."],
          ["    spec:", ""],
          ["      containers:", ""],
          ["      - name: nginx", ""],
          ["        image: nginx:latest", ""]
        ] },
        { type: "callout", kind: "warn", html: "<b>Experiment:</b> create <code>pod-rs.yaml</code> (a bare Pod with <code>app: nginx</code>) <i>before</i> the ReplicaSet. The RS adopts it and creates only 2 new Pods. Create it <i>after</i>, and the RS deletes it immediately because it would make 4. Labels are the contract." }
      ] },
    { id: "owners", title: "Ownership and deletion propagation", toc: "Ownership",
      lead: "Each Pod's <code>metadata.ownerReferences</code> points to its ReplicaSet; each ReplicaSet points to its Deployment. The garbage collector uses this graph when you delete an owner.",
      blocks: [
        { type: "custom", html: delHtml, init: initDel },
        { type: "code", title: "delete via the raw API", code: `kubectl proxy --port=8080 &
curl -X DELETE 'http://localhost:8080/apis/apps/v1/namespaces/default/replicasets/nginx-rs' \\
  -H "Content-Type: application/json" \\
  -d '{"kind":"DeleteOptions","apiVersion":"v1","propagationPolicy":"Foreground"}'
# same with kubectl:
kubectl delete rs nginx-rs --cascade=foreground   # | background (default) | orphan` }
      ] },
    { id: "rolling", title: "Deployments and rolling updates", toc: "Rolling updates",
      lead: "Change the Pod template (image, env, resources) and the Deployment creates a new ReplicaSet, then shifts Pods from old to new within the limits you set.",
      blocks: [
        { type: "custom", html: rollHtml, init: initRoll },
        { type: "cards", cols: 3, items: [
          ["➕", "maxSurge", "How many Pods <b>above</b> replicas may exist during the update. Default 25% (rounded up). Higher = faster, needs spare capacity."],
          ["➖", "maxUnavailable", "How many may be <b>unavailable</b> below replicas. Default 25% (rounded down). 0 = never drop capacity."],
          ["🔁", "Recreate", "Kill all old, then start new. Downtime, but never two versions at once (DB schema changes, single-writer apps)."]
        ] },
        { type: "callout", kind: "info", html: "Rollouts only progress when new Pods become <b>Ready</b>. Without a readinessProbe, 'ready' means 'process started', and a broken version can roll out completely. Add probes and <code>minReadySeconds</code>." }
      ] },
    { id: "history", title: "History, rollback and pause", toc: "History & rollback",
      blocks: [
        { type: "steps", steps: [
          { title: "Create", where: "kubectl", why: "Creates Deployment → ReplicaSet → 3 Pods. <code>rollout status</code> blocks until done (great in CI).", code: "kubectl create deploy web --image nginx --replicas 3 --port 80\nkubectl rollout status deployment web\nkubectl get deploy,rs,pods -l app=web" },
          { title: "Update the image", where: "kubectl", why: "A typo tag (<code>1.14.a</code>) is on purpose: new Pods go ImagePullBackOff, but maxUnavailable keeps old Pods serving. <code>--record</code> is deprecated; use the change-cause annotation.", code: "kubectl set image deploy web nginx=nginx:1.14.a\nkubectl annotate deployment/web kubernetes.io/change-cause=\"Update to nginx:1.14\"\nkubectl get rs        # old RS still has Pods, new RS stuck" },
          { title: "Inspect history", where: "kubectl", why: "Each template change = a revision = a ReplicaSet kept around (<code>revisionHistoryLimit</code>, default 10).", code: "kubectl rollout history deploy/web\nkubectl rollout history deploy/web --revision=2" },
          { title: "Roll back", where: "kubectl", why: "Undo scales the old ReplicaSet back up. Instant because the old RS still exists.", code: "kubectl rollout undo deployment/web --to-revision=1\nkubectl rollout status deployment/web" },
          { title: "Scale & pause", where: "kubectl", why: "Pause to batch several template edits into one rollout; resume to apply them together. Scaling doesn't create a revision.", code: "kubectl scale deployment/web --replicas=6\nkubectl rollout pause deployment/web\nkubectl set resources deploy/web -c nginx --limits=memory=256Mi\nkubectl set env deploy/web MODE=prod\nkubectl rollout resume deployment/web" },
          { title: "Recreate strategy", where: "YAML", why: "With <code>strategy: Recreate</code>, all Pods terminate before new ones start.", code: "spec:\n  replicas: 3\n  strategy:\n    type: Recreate\n---\nkubectl apply -f recreate.yaml\nkubectl set image deploy/demo-deployment demo=nginx:1.27\nkubectl get pods -w     # all Terminating, then all ContainerCreating" }
        ] }
      ] },
    { id: "canary", title: "Canary with two Deployments", toc: "Canary",
      lead: "A Service selects Pods by label. If two Deployments share the label <code>app: nginx</code>, the Service spreads traffic across both, proportional to Pod count.",
      blocks: [
        { type: "layers", items: [
          ["Service nginx-service · selector app=nginx", "traffic split by Pod count", "#5b8cff"],
          ["nginx-stable · 9 replicas · app=nginx, version=1.17", "≈ 90% of connections", "#34d399"],
          ["nginx-canary · 1 replica · app=nginx, version=1.18", "≈ 10% of connections", "#fbbf24"]
        ] },
        { type: "code", title: "canary", code: `kubectl apply -f deploy-canary.yaml      # nginx-stable, 9 × nginx:1.17
kubectl apply -f deploy-canary-v2.yaml   # nginx-canary, 1 × nginx:1.18
kubectl apply -f canary-svc.yaml         # selector: app: nginx
# promote: scale canary up, stable down
kubectl scale deploy nginx-canary --replicas=5
kubectl scale deploy nginx-stable --replicas=5` },
        { type: "callout", kind: "tip", html: "Label-based canaries are coarse (percent = Pod ratio, per connection). For exact weights (1%), headers or automatic analysis use Gateway API weighted <code>backendRefs</code>, a service mesh, or Argo Rollouts / Flagger." }
      ] }
  ],
  summary: {
    takeaways: [
      ["🔢", "ReplicaSet counts labels", "Adopts or deletes Pods that match its selector."],
      ["🌳", "ownerReferences", "Deployment → RS → Pod; GC cascades deletes."],
      ["🔁", "Template change = new RS", "Rolling update shifts Pods old → new."],
      ["⚖️", "maxSurge / maxUnavailable", "Speed vs capacity during rollout."],
      ["⏪", "rollout undo", "Old RS kept for instant rollback."],
      ["🐤", "Canary by labels", "Two Deployments behind one Service."]
    ],
    cheat: `kubectl create deploy web --image=nginx --replicas=3
kubectl set image deploy/web nginx=nginx:1.27
kubectl rollout status|history|undo|pause|resume deploy/web
kubectl rollout restart deploy/web          # new Pods, same spec
kubectl scale deploy/web --replicas=5
kubectl get rs -l app=web
kubectl delete rs <rs> --cascade=orphan`,
    quiz: [
      ["What triggers a new ReplicaSet in a Deployment?", ["Scaling replicas", "Changing the Pod template", "Adding a label to the Deployment", "Deleting a Pod"], 1, "Only template changes create a revision."],
      ["replicas 4, maxSurge 1, maxUnavailable 0. Max Pods during rollout?", ["4", "5", "3", "8"], 1, "replicas + maxSurge = 5, and never fewer than 4 available."],
      ["Which strategy guarantees two versions never run together?", ["RollingUpdate", "Recreate", "Canary", "Blue/green via labels"], 1, "Recreate stops all old Pods first."],
      ["Delete a ReplicaSet with --cascade=orphan. The Pods…", ["Are deleted", "Keep running without an owner", "Move to another node", "Restart"], 1, "ownerReferences are removed; Pods survive."],
      ["How does rollout undo work so fast?", ["Pulls the old image", "Scales the previous ReplicaSet back up", "Restores etcd", "Recreates the Deployment"], 1, "Old ReplicaSets are retained per revisionHistoryLimit."]
    ]
  }
});
</script>
</body>
</html>
