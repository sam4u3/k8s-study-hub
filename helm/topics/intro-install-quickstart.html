<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Install Helm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/glass.css">
<link rel="stylesheet" href="../../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../../assets/glass.js"></script>
<script src="../registry.js"></script>
<script src="../../assets/topic.js"></script>
<script>
// Version skew checker: Helm 4 supports the Kubernetes minor it was built against and three older minors.
const SKEW = { "4.3": 37, "4.2": 36, "4.1": 35, "4.0": 34 };
const vHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>Helm client<select class="input" id="hv">${Object.keys(SKEW).map(v => `<option>${v}</option>`).join("")}</select></label>
    <label>Cluster version: <b id="kvV">1.37</b><input class="input" type="range" min="28" max="38" value="37" id="kv"></label>
  </div>
  <div class="pipe-out" id="vOut"></div>
</div>`;
function initSkew(el) {
  const $ = s => el.querySelector(s);
  const draw = () => {
    const top = SKEW[$("#hv").value], k = +$("#kv").value;
    $("#kvV").textContent = "1." + k;
    const range = `1.${top - 3}.x – 1.${top}.x`;
    $("#vOut").innerHTML = k > top
      ? `<span style="color:var(--amber)">⚠ Cluster 1.${k} is newer than Helm ${$("#hv").value}'s client (1.${top}). No forward-compatibility guarantee: upgrade Helm.</span>`
      : k < top - 3
      ? `<span style="color:var(--red)">✗ Unsupported: Helm ${$("#hv").value} supports ${range}. Use an older Helm or upgrade the cluster.</span>`
      : `<span style="color:var(--green)">✓ Supported: Helm ${$("#hv").value} is tested with ${range}.</span>`;
  };
  el.querySelectorAll("select,input").forEach(i => i.oninput = i.onchange = draw);
  draw();
}

K8S_RENDER({
  id: "helm-install", group: "intro", minutes: 15,
  title: 'Installing <span class="grad-text">Helm</span> & quickstart',
  lead: "Helm is a single binary on your machine. Install it, point it at a cluster through your kubeconfig, and you can deploy a chart in a minute.",
  parts: [["Install", "Script, package managers, binary"], ["Version skew", "Which Helm for which cluster"], ["Quickstart", "First release in 5 commands"]],
  sections: [
    { id: "install", title: "Install the Helm client", toc: "Install",
      lead: "Every method installs the same <code>helm</code> binary. The official script and release binaries are built by the Helm project; package-manager builds are community-maintained.",
      blocks: [
        { type: "tabs", tabs: [
          { label: "Script (Linux/macOS)", blocks: [{ type: "term", title: "get-helm-4", lines: [
            "$ curl -fsSL -o get_helm.sh https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-4",
            "$ chmod 700 get_helm.sh",
            "$ ./get_helm.sh",
            "Downloading https://get.helm.sh/helm-v4.3.0-darwin-arm64.tar.gz",
            "✓ helm installed into /usr/local/bin/helm"
          ] }, { type: "callout", kind: "tip", html: "Read the script before running it. It's short, and piping unknown scripts into a shell is a habit worth avoiding." }] },
          { label: "macOS", blocks: [{ type: "code", title: "Homebrew", code: "brew install helm" }] },
          { label: "Windows", blocks: [{ type: "code", title: "pick one", code: `winget install Helm.Helm
choco install kubernetes-helm
scoop install helm` }] },
          { label: "Debian/Ubuntu", blocks: [{ type: "code", title: "apt", code: `HELM_BUILDKITE_APT_KEY_ID="DDF78C3E6EBB2D2CC223C95C62BA89D07698DBC6"
sudo apt-get install curl gpg apt-transport-https --yes
curl -fsSL https://packages.buildkite.com/helm-linux/helm-debian/gpgkey > "\${TMPDIR:-/tmp}/helm.gpg"
# stop if the key isn't the one the Helm docs publish
if [ "$(gpg --show-keys --with-colons "\${TMPDIR:-/tmp}/helm.gpg" | awk -F: '$1 == "fpr" {print $10}' | head -n 1)" != "\${HELM_BUILDKITE_APT_KEY_ID}" ]; then echo "ERROR: Unexpected Helm APT key ID"; exit 1; fi
cat "\${TMPDIR:-/tmp}/helm.gpg" | gpg --dearmor | sudo tee /usr/share/keyrings/helm.gpg > /dev/null
echo "deb [signed-by=/usr/share/keyrings/helm.gpg] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main" | sudo tee /etc/apt/sources.list.d/helm-stable-debian.list
sudo apt-get update
sudo apt-get install helm` }] },
          { label: "Fedora", blocks: [{ type: "code", title: "dnf", code: "sudo dnf install helm" }] },
          { label: "Binary", blocks: [{ type: "p", html: "Download a release archive from GitHub (<code>helm/helm</code> releases), unpack it and move <code>helm</code> onto your PATH. Releases are signed; verify the checksum before use." }] }
        ] },
        { type: "term", title: "verify", lines: [
          "$ helm version",
          'version.BuildInfo{Version:"v4.3.0", GitCommit:"…", GitTreeState:"clean", GoVersion:"…", KubeClientVersion:"v1.37"}',
          "$ kubectl config current-context",
          "kind-dev",
          "✓ helm uses the same kubeconfig and context as kubectl"
        ] }
      ] },
    { id: "skew", title: "Version skew", toc: "Version skew",
      lead: "Each Helm release is compiled against one Kubernetes client version. Helm 4 supports that minor and the three before it (n-3), and makes no promises for newer clusters.",
      blocks: [
        { type: "custom", html: vHtml, init: initSkew },
        { type: "table", head: ["Helm", "Supported Kubernetes"], rows: [["4.3.x", "1.37.x – 1.34.x"], ["4.2.x", "1.36.x – 1.33.x"], ["4.1.x", "1.35.x – 1.32.x"], ["4.0.x", "1.34.x – 1.31.x"]] },
        { type: "callout", kind: "info", html: "Helm keeps a release branch only for the latest minor. Security fixes land there, so stay on the newest 4.x patch." }
      ] },
    { id: "quick", title: "Quickstart", toc: "Quickstart",
      blocks: [
        { type: "steps", steps: [
          { title: "Add a chart repository", where: "your machine", why: "Helm 3 and 4 ship with no default repository. Add one, then refresh its index.", code: `helm repo add bitnami https://charts.bitnami.com/bitnami
helm repo update` },
          { title: "Find a chart", where: "your machine", why: "Search the repositories you added (local data) or Artifact Hub (<code>helm search hub</code>).", code: `helm search repo bitnami/mysql
helm show values bitnami/mysql | less` },
          { title: "Install it", where: "cluster", whereClass: "green", why: "The release name is yours to choose; <code>--generate-name</code> picks one. NOTES from the chart print at the end.", code: `helm install db bitnami/mysql -n data --create-namespace` },
          { title: "Inspect the release", where: "cluster", whereClass: "green", why: "Status shows the revision and notes; <code>helm get manifest</code> shows exactly what was applied.", code: `helm list -n data
helm status db -n data
helm get manifest db -n data | head` },
          { title: "Uninstall", where: "cluster", whereClass: "green", why: "Removes every resource the release created and its history. Add <code>--keep-history</code> to keep the record.", code: `helm uninstall db -n data` }
        ] }
      ] }
  ],
  summary: {
    takeaways: [
      ["💻", "Client only", "Install one binary; it uses your kubeconfig."],
      ["📏", "n-3 skew", "Helm 4.3 supports Kubernetes 1.34–1.37."],
      ["🗄️", "No default repo", "helm repo add before installing by repo/chart name."],
      ["🔍", "Look before installing", "helm show values and helm template show what you'll get."]
    ],
    cheat: `helm version
helm env                       # paths and env vars Helm uses
helm repo add <name> <url> && helm repo update
helm search repo <keyword>
helm install <release> <repo>/<chart> -n <ns> --create-namespace
helm uninstall <release> -n <ns>`,
    quiz: [
      ["Which clusters does Helm 4.3 support?", ["1.37 only", "1.34–1.37", "1.31–1.34", "Any version"], 1, "Built against 1.37, supports n-3."],
      ["After installing Helm, which repositories are configured?", ["stable", "bitnami", "None", "Artifact Hub"], 2, "Add repositories yourself with helm repo add."],
      ["How does Helm know which cluster to talk to?", ["helm init", "Your kubeconfig and current context", "A Tiller address", "HELM_CLUSTER"], 1, "Same as kubectl; --kube-context overrides."]
    ]
  }
});
</script>
</body>
</html>
