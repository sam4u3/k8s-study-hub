<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBAC and Admission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/glass.css">
<link rel="stylesheet" href="../../assets/topic.css">
</head>
<body>
<div id="app"></div>
<script src="../../assets/glass.js"></script>
<script src="../registry.js"></script>
<script src="../../assets/topic.js"></script>
<script>
// RBAC evaluator with example bindings.
const BINDINGS = [
  { subj: "system:serviceaccount:app:demo-sa", kind: "ClusterRoleBinding", role: "my-rules", ns: "*", rules: [["apps", ["deployments", "daemonsets"], ["create"]]] },
  { subj: "system:serviceaccount:dev1:demo2-sa", kind: "RoleBinding", role: "demo2-deployment-creator", ns: "dev1", rules: [["apps", ["deployments"], ["create"]]] },
  { subj: "system:serviceaccount:default:deployment-manager", kind: "RoleBinding", role: "deployment-creator", ns: "default", rules: [["apps", ["deployments"], ["create", "delete", "get", "list", "patch", "update", "watch"]]] },
  { subj: "system:serviceaccount:default:deployment-manager", kind: "RoleBinding", role: "secret-manager", ns: "default", rules: [["", ["secrets"], ["create", "delete", "get", "list", "patch", "update", "watch"]]] },
  { subj: "jane", kind: "RoleBinding", role: "pod-reader", ns: "default", rules: [["", ["pods"], ["get", "list", "watch"]]] }
];
const GROUP = { pods: "", secrets: "", services: "", deployments: "apps", daemonsets: "apps" };
const rbacHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>--as<select class="input" id="rS">${[...new Set(BINDINGS.map(b => b.subj))].map(s => `<option>${s}</option>`).join("")}</select></label>
  </div>
  <div class="sim-row">
    <label>Verb<select class="input" id="rV">${["create", "get", "list", "delete", "update"].map(v => `<option>${v}</option>`).join("")}</select></label>
    <label>Resource<select class="input" id="rR">${Object.keys(GROUP).map(v => `<option>${v}</option>`).join("")}</select></label>
    <label>Namespace<select class="input" id="rN">${["app", "dev1", "default", "kube-system"].map(v => `<option>${v}</option>`).join("")}</select></label>
    <button class="btn primary" id="rGo">kubectl auth can-i</button>
  </div>
  <div class="pipe-out" id="rOut"></div>
</div>`;
function initRbac(el) {
  const $ = s => el.querySelector(s);
  const go = () => {
    const s = $("#rS").value, v = $("#rV").value, r = $("#rR").value, n = $("#rN").value, g = GROUP[r];
    let html = `<span class="faint">$ kubectl auth can-i ${v} ${r} -n ${n} --as=${s}</span><br>`;
    const mine = BINDINGS.filter(b => b.subj === s);
    let ok = null;
    mine.forEach(b => {
      const nsOk = b.ns === "*" || b.ns === n;
      const rule = b.rules.find(x => x[0] === g && x[1].includes(r) && x[2].includes(v));
      html += `<span class="muted">· ${b.kind} → ${b.role} (${b.ns === "*" ? "all namespaces" : "ns " + b.ns}): ${!nsOk ? "namespace doesn't match" : rule ? '<b style="color:var(--green)">rule matches</b>' : "no matching rule"}</span><br>`;
      if (nsOk && rule) ok = b;
    });
    html += ok ? `<b style="color:var(--green)">yes</b>` : `<b style="color:var(--red)">no</b> <span class="faint">— RBAC is deny-by-default; nothing granted it</span>`;
    $("#rOut").innerHTML = html;
  };
  el.querySelectorAll("select").forEach(x => x.onchange = go);
  $("#rGo").onclick = go;
  $("#rS").value = "system:serviceaccount:app:demo-sa"; go();
}

// ValidatingAdmissionPolicy simulator (replicas <= 5 in env=test namespaces).
const vapHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>Replicas: <b id="vRv">6</b><input class="input" type="range" min="1" max="10" value="6" id="vR"></label>
    <label>Namespace label environment<select class="input" id="vL"><option value="test">test</option><option value="prod">prod</option><option value="">(none)</option></select></label>
    <label>Operation<select class="input" id="vO"><option>CREATE</option><option>UPDATE</option></select></label>
  </div>
  <div class="pipe-out" id="vOut"></div>
</div>`;
function initVap(el) {
  const $ = s => el.querySelector(s);
  const go = () => {
    const r = +$("#vR").value, l = $("#vL").value;
    $("#vRv").textContent = r;
    let h = `<span class="faint">$ kubectl create deploy nginx --image=nginx --replicas=${r}   # ns labelled environment=${l || "∅"}</span><br>`;
    if (l !== "test") h += `<span class="muted">binding matchResources: namespaceSelector environment=test → <b>not matched</b>, policy skipped</span><br><span style="color:var(--green)">deployment.apps/nginx created</span>`;
    else {
      h += `<span class="muted">binding matched · CEL: object.spec.replicas (${r}) &lt;= 5 → <b>${r <= 5}</b></span><br>`;
      h += r <= 5 ? `<span style="color:var(--green)">deployment.apps/nginx created</span>` : `<span style="color:var(--red)">error: deployments.apps "nginx" is forbidden: ValidatingAdmissionPolicy 'demo-policy.example.com' with binding 'demo-binding-test.example.com' denied request: failed expression: object.spec.replicas &lt;= 5</span>`;
    }
    $("#vOut").innerHTML = h;
  };
  el.querySelectorAll("input,select").forEach(x => x.oninput = go);
  go();
}

K8S_RENDER({
  id: "security-rbac", group: "security", minutes: 30,
  title: '<span class="grad-text">RBAC</span>, ServiceAccounts & admission policies',
  lead: "Every API request answers three questions: who are you (authentication), may you do this (authorisation, RBAC), and is this object acceptable (admission). This topic covers the last two and workload identities.",
  parts: [["RBAC model", "4 objects, 1 rule shape"], ["Evaluator", "Try can-i live"], ["ServiceAccounts", "Tokens and curl"], ["Admission", "CEL policies"]],
  sections: [
    { id: "model", title: "The RBAC model", toc: "RBAC model",
      lead: "RBAC is additive and deny-by-default. There are no deny rules: if nothing grants it, it's forbidden.",
      blocks: [
        { type: "table", head: ["", "Namespaced", "Cluster-wide"], rows: [
          ["<b>What</b> (permissions)", "<code>Role</code>", "<code>ClusterRole</code>"],
          ["<b>Who gets it</b> (binding)", "<code>RoleBinding</code> → grants in one namespace", "<code>ClusterRoleBinding</code> → grants everywhere"],
          ["Combo trick", "RoleBinding → <b>ClusterRole</b>: reuse a cluster-defined role, but only inside that namespace", ""]
        ] },
        { type: "yaml", title: "Role: deployment-creator", lines: [
          ["apiVersion: rbac.authorization.k8s.io/v1", ""],
          ["kind: Role", "Namespaced permission set."],
          ["metadata:", ""],
          ["  namespace: default", "Only meaningful in this namespace."],
          ["  name: deployment-creator", ""],
          ["rules:", "A list of rules. Permissions are the union of all rules."],
          ["- apiGroups: [\"apps\"]", "<b>API group</b> of the resource. Core resources (pods, secrets, services) use <code>\"\"</code>."],
          ["  resources: [\"deployments\"]", "Plural resource names; subresources look like <code>pods/log</code>, <code>deployments/scale</code>."],
          ["  verbs: [\"create\", \"delete\", \"get\", \"list\", \"patch\", \"update\", \"watch\"]", "<b>Verbs</b> map to HTTP: get/list/watch = GET, create = POST, update = PUT, patch = PATCH, delete = DELETE."]
        ] },
        { type: "cards", cols: 3, items: [
          ["👤", "Subjects", "<code>User</code> (from certs/OIDC), <code>Group</code>, or <code>ServiceAccount</code> (namespaced identity for Pods)."],
          ["🧩", "Built-in ClusterRoles", "<code>cluster-admin</code>, <code>admin</code>, <code>edit</code>, <code>view</code>. Bind <code>view</code> with a RoleBinding for read-only access to one namespace."],
          ["⚠️", "Escalation guard", "You can't grant permissions you don't have, unless you hold <code>escalate</code>/<code>bind</code> verbs."]
        ] }
      ] },
    { id: "eval", title: "RBAC evaluator", toc: "Evaluator",
      lead: "Example subjects and bindings: a ClusterRole for one ServiceAccount, namespaced Roles for others, and a user. Ask the authoriser a question.",
      blocks: [
        { type: "custom", html: rbacHtml, init: initRbac },
        { type: "code", title: "ClusterRole + ServiceAccount", code: `kubectl create ns app
kubectl create sa demo-sa -n app
kubectl create clusterrole my-rules --verb=create \\
  --resource=deployments,daemonsets --api-group=apps
kubectl create clusterrolebinding demo-sa-global-binding \\
  --clusterrole=my-rules --serviceaccount=app:demo-sa

kubectl auth can-i create deployment -n app --as=system:serviceaccount:app:demo-sa   # yes
kubectl auth can-i delete deployment -n app --as=system:serviceaccount:app:demo-sa   # no
kubectl auth can-i --list --as=system:serviceaccount:app:demo-sa -n app` }
      ] },
    { id: "sa", title: "ServiceAccounts: identities for Pods", toc: "ServiceAccounts",
      lead: "Humans are Users; workloads are ServiceAccounts. Every namespace has a <code>default</code> SA, and every Pod runs as one.",
      blocks: [
        { type: "flow", nodes: [
          ["🆔", "SA", "Create a ServiceAccount", "<code>kubectl create sa demo2-sa -n dev1</code>. Its username is <code>system:serviceaccount:dev1:demo2-sa</code>."],
          ["🔗", "Bind", "Bind a Role", "RoleBinding grants it <code>create deployments</code> in dev1 only."],
          ["🎫", "Token", "Get a token", "<code>kubectl create token demo2-sa -n dev1</code> issues a short-lived, audience-bound JWT via the TokenRequest API. Pods get one automatically, projected at <code>/var/run/secrets/kubernetes.io/serviceaccount/token</code> and rotated."],
          ["📨", "Call API", "Use it as a Bearer token", "Any HTTP client can now call the API server: <code>Authorization: Bearer $TOKEN</code>."],
          ["🛡️", "RBAC", "Allowed or Forbidden", "Creating a Deployment succeeds; creating a Secret returns 403 because nothing granted it."]
        ] },
        { type: "code", title: "call the API with a ServiceAccount token", code: `TOKEN=$(kubectl create token demo2-sa -n dev1)
APISERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')

# 403 Forbidden: demo2-sa may not create secrets
curl -k -X POST $APISERVER/api/v1/namespaces/dev1/secrets \\
  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \\
  -d '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"demo-secret"}}'

# 201 Created: allowed by the Role
curl -k -X POST $APISERVER/apis/apps/v1/namespaces/dev1/deployments \\
  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \\
  -d '{"apiVersion":"apps/v1","kind":"Deployment","metadata":{"name":"nginx-from-sa"},
       "spec":{"replicas":1,"selector":{"matchLabels":{"app":"nginx"}},
       "template":{"metadata":{"labels":{"app":"nginx"}},"spec":{"containers":[{"name":"nginx","image":"nginx"}]}}}}'` },
        { type: "callout", kind: "warn", html: "<code>curl -k</code> skips TLS verification: fine in a lab, never in scripts. Use <code>--cacert ca.crt</code>. Also set <code>automountServiceAccountToken: false</code> on Pods that never call the API, so a compromised container has no token to steal." },
        { type: "callout", kind: "tip", html: "In-cluster pattern: a Pod reads ConfigMaps through the API using its SA, after a Role <code>config-reader</code> (get/list/watch configmaps) is bound to <code>default</code> SA." }
      ] },
    { id: "admission", title: "Admission: is this object acceptable?", toc: "Admission",
      lead: "After RBAC says 'yes', admission controllers can still mutate or reject the object. ValidatingAdmissionPolicy (GA in 1.30) lets you write rules in CEL, no webhook server needed.",
      blocks: [
        { type: "pipeline", stages: [["AuthN", "who"], ["AuthZ", "RBAC"], ["Mutating admission", "defaults, injections"], ["Schema validation", "OpenAPI"], ["Validating admission", "VAP / webhooks"], ["etcd", "persist"]],
          scenarios: [
            { label: "create 3 replicas", out: '<span style="color:var(--green)">✓ 201 Created</span>' },
            { label: "create 6 replicas (ns env=test)", path: [0, 1, 2, 3, 4], fail: 4, out: '<span style="color:var(--red)">✗ denied by ValidatingAdmissionPolicy: object.spec.replicas &lt;= 5</span>' },
            { label: "SA creates a Secret", path: [0, 1], fail: 1, out: '<span style="color:var(--red)">✗ 403 Forbidden by RBAC (admission never runs)</span>' }
          ] },
        { type: "code", title: "admission.yaml", code: `apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: "demo-policy.example.com"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:   ["apps"]
      apiVersions: ["v1"]
      operations:  ["CREATE", "UPDATE"]
      resources:   ["deployments"]
  validations:
  - expression: "object.spec.replicas <= 5"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: "demo-binding-test.example.com"
spec:
  policyName: "demo-policy.example.com"
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        environment: test` },
        { type: "h3", text: "Try the policy" },
        { type: "custom", html: vapHtml, init: initVap },
        { type: "callout", kind: "info", html: "Policy = the rule; Binding = where it applies and what to do (<code>Deny</code>, <code>Warn</code>, <code>Audit</code>). Start with <code>Warn</code> in production to see impact before enforcing." }
      ] }
  ],
  summary: {
    takeaways: [
      ["🚫", "Deny by default", "RBAC only adds permissions; no deny rules."],
      ["🧱", "Role vs ClusterRole", "Binding type decides the scope where it applies."],
      ["🤖", "ServiceAccounts for Pods", "system:serviceaccount:<ns>:<name>; short-lived projected tokens."],
      ["🔍", "kubectl auth can-i", "--as and --list to test any subject."],
      ["🧮", "CEL admission", "ValidatingAdmissionPolicy enforces rules without webhooks."],
      ["🔐", "Least privilege", "Disable token automount where unused; avoid cluster-admin."]
    ],
    cheat: `kubectl create role r --verb=get,list --resource=pods -n ns
kubectl create rolebinding rb --role=r --serviceaccount=ns:sa -n ns
kubectl create clusterrolebinding crb --clusterrole=view --user=jane
kubectl auth can-i create deploy -n ns --as=system:serviceaccount:ns:sa
kubectl auth can-i --list --as=jane -n dev
kubectl create token sa -n ns --duration=10m
kubectl get validatingadmissionpolicies,validatingadmissionpolicybindings`,
    quiz: [
      ["A RoleBinding referencing a ClusterRole grants permissions…", ["Cluster-wide", "Only in the RoleBinding's namespace", "Nowhere", "Only to Users"], 1, "Binding scope wins: a RoleBinding is namespaced."],
      ["apiGroups value for pods and secrets?", ["\"core\"", "\"\" (empty string)", "\"v1\"", "\"apps\""], 1, "The core group has no name."],
      ["Username of SA demo-sa in namespace app?", ["demo-sa", "app:demo-sa", "system:serviceaccount:app:demo-sa", "sa/app/demo-sa"], 2, "Use it with --as and in RoleBinding subjects."],
      ["RBAC allows a request but VAP says replicas <= 5 is false. Result?", ["Created with 5 replicas", "Rejected at validating admission", "Created with a warning always", "RBAC overrides"], 1, "Admission runs after authorisation; Deny rejects."],
      ["Best way to get a short-lived SA token today?", ["Create a Secret of type service-account-token", "kubectl create token <sa>", "Read etcd", "Use the node kubelet.conf"], 1, "TokenRequest API issues bound, expiring tokens."]
    ]
  }
});
</script>
</body>
</html>
