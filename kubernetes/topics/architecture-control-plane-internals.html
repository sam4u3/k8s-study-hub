<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control-Plane Internals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<body>
<div id="app"></div>
<script src="../../assets/glass.js"></script>
<script src="../registry.js"></script>

<script>
// API Priority & Fairness simulator: a noisy client floods; does the system stay responsive?
const apfHtml = `
<div class="sim glass">
  <div class="sim-row">
    <label>noisy CI bot requests/s: <b id="aNV">400</b><input class="input" type="range" min="0" max="1000" step="50" value="400" id="aN"></label>
    <label><span><input type="checkbox" id="aOn" checked> API Priority and Fairness enabled</span></label>
  </div>
  <div id="aLv" style="display:grid;gap:8px"></div>
  <div class="pipe-out" id="aOut"></div>
</div>`;
function initApf(el) {
  const $ = s => el.querySelector(s);
  const go = () => {
    const n = +$("#aN").value, on = $("#aOn").checked; $("#aNV").textContent = n;
    const LV = [["exempt", "system:masters, health checks", 0, 10], ["system", "kubelets, node heartbeats", 120, 60], ["leader-election", "scheduler/controller leases", 40, 10], ["workload-high", "controllers in kube-system", 120, 80], ["workload-low", "ServiceAccounts (CI bot here)", 100, 30 + n], ["global-default", "everything else (humans)", 60, 40]];
    const cap = 600; const totalLoad = LV.reduce((a, l) => a + l[3], 0);
    $("#aLv").innerHTML = LV.map(([name, who, share, load]) => {
      let served, state;
      if (!on) { const f = Math.min(1, cap / totalLoad); served = load * f; state = f < 1 ? "slow" : "ok"; }
      else if (share === 0) { served = load; state = "ok"; }
      else { served = Math.min(load, share); state = load > share ? (name === "workload-low" ? "queued" : "slow") : "ok"; }
      const pct = load ? Math.round(served / load * 100) : 100;
      return `<div style="display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font:12px var(--mono)"><span>${name}<br><span class="faint" style="font-size:10.5px">${who}</span></span>
        <div style="height:12px;background:rgba(255,255,255,.06);border-radius:6px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:${pct > 95 ? "var(--green)" : pct > 60 ? "var(--amber)" : "var(--red)"};transition:width .5s"></i></div><span>${pct}% served</span></div>`;
    }).join("");
    $("#aOut").innerHTML = !on && totalLoad > cap ? `<span style="color:var(--red)">✗ without APF the bot starves everyone: node heartbeats slow down, nodes may go NotReady, leader election can be lost</span>` :
      on && 30 + n > 100 ? `<span style="color:var(--green)">✓ the bot's own priority level queues/rejects its excess (HTTP 429), while kubelets, controllers and humans keep their share</span>` : `<span class="muted">load within capacity</span>`;
  };
  el.querySelectorAll("input").forEach(i => i.oninput = i.onchange = go); go();
}

// Leader election with a Lease
const leaseHtml = `
<div class="sim glass">
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px" id="lCands"></div>
  <div class="ctrl"><button class="btn small" id="lKill">Kill current leader</button><button class="btn small" id="lReset">Reset</button></div>
  <div class="pipe-out" id="lOut"></div>
</div>`;
function initLease(el) {
  const $ = s => el.querySelector(s); let t = [], leader, dead;
  if (innerWidth < 760) $("#lCands").style.gridTemplateColumns = "1fr";
  const draw = () => { $("#lCands").innerHTML = ["cp1", "cp2", "cp3"].map(c => `<div class="box" style="border-color:${c === leader ? "var(--green)" : "var(--border)"};opacity:${dead.includes(c) ? .35 : 1}"><b>kube-scheduler-${c}</b><div style="margin-top:6px">${dead.includes(c) ? '<span class="pill r">down</span>' : c === leader ? '<span class="pill g glow">leader · renewing</span>' : '<span class="pill b">standby · watching lease</span>'}</div></div>`).join(""); };
  const reset = () => { t.forEach(clearTimeout); t = []; leader = "cp1"; dead = []; draw(); $("#lOut").innerHTML = 'Lease kube-system/kube-scheduler: holderIdentity=cp1, leaseDurationSeconds=15, renewTime updated every ~2s'; };
  $("#lKill").onclick = () => {
    if (!leader) return; dead.push(leader); const old = leader; leader = null; draw();
    $("#lOut").innerHTML = `${old} stopped renewing…`;
    let s = 0; const tick = () => { s += 5; $("#lOut").innerHTML = `${old} stopped renewing… ${s}s since last renewTime`; if (s < 15) t.push(setTimeout(tick, 500)); else { leader = ["cp1", "cp2", "cp3"].find(c => !dead.includes(c)); draw(); $("#lOut").innerHTML += leader ? `<br><span style="color:var(--green)">✓ lease expired → ${leader} acquired it (holderIdentity=${leader}, leaseTransitions++)</span>` : '<br><span style="color:var(--red)">✗ no candidates left: no scheduling happens</span>'; } };
    t.push(setTimeout(tick, 500));
  };
  $("#lReset").onclick = reset; reset();
}

K8S_RENDER({
  id: "arch-internals", group: "architecture", minutes: 25,
  title: 'Control-plane <span class="grad-text">internals</span>',
  lead: "How the control plane protects and coordinates itself: fair queuing so one client can't take down the API server, Leases for heartbeats and leader election, watch caches, and the plugin framework the scheduler is built from.",
  parts: [["API Priority & Fairness", "Overload protection"], ["Leases", "Heartbeats & leader election"], ["Watches & caches", "How clients stay in sync"], ["Scheduler framework", "Plugins and extension points"], ["Multiple schedulers", "Custom schedulers"]],
  sections: [
    { id: "apf", title: "API Priority and Fairness", toc: "API Priority & Fairness",
      lead: "Stable since v1.29. Requests are classified by <b>FlowSchemas</b> into <b>PriorityLevelConfigurations</b>, each with a share of the server's concurrency. Within a level, flows (e.g. per user) are fair-queued so one noisy client only hurts itself.",
      blocks: [
        { type: "custom", html: apfHtml, init: initApf },
        { type: "term", title: "inspect APF", lines: [
          "$ kubectl get flowschemas",
          "$ kubectl get prioritylevelconfigurations",
          "$ kubectl get --raw /debug/api_priority_and_fairness/dump_priority_levels",
          "$ kubectl get --raw /metrics | grep apiserver_flowcontrol_rejected_requests_total",
          "✓ rejected requests get HTTP 429; client-go retries with backoff"
        ] }
      ] },
    { id: "leases", title: "Leases: heartbeats and leader election", toc: "Leases",
      blocks: [
        { type: "cards", cols: 3, items: [
          ["💓", "Node heartbeats", "Each kubelet renews a Lease in <code>kube-node-lease</code> every ~10 s. Cheap compared to updating the whole Node status. Missing renewals → node controller marks the node NotReady after the grace period (node-monitor-grace-period, 50 s by default in recent releases)."],
          ["👑", "Leader election", "With 3 control-plane nodes, only one scheduler and one controller-manager act. They hold a Lease in <code>kube-system</code>; standbys take over when it expires."],
          ["🗳️", "Coordinated leader election", "Beta since v1.33: picks leaders that run the oldest compatible version during upgrades, avoiding new code acting on old API data."]
        ] },
        { type: "h3", text: "Failover" },
        { type: "custom", html: leaseHtml, init: initLease },
        { type: "callout", kind: "tip", html: "Your own controllers can use the same mechanism (client-go <code>leaderelection</code>, controller-runtime <code>LeaderElection: true</code>). Run 2+ replicas and only the lease holder reconciles." }
      ] },
    { id: "watch", title: "Watches and the watch cache", toc: "Watches & caches",
      blocks: [
        { type: "flow", nodes: [
          ["📋", "LIST", "Client lists once", "Gets all objects plus a <code>resourceVersion</code>. With the streaming WatchList feature (beta) the initial state arrives as watch events, saving memory."],
          ["📡", "WATCH", "Then watches from that version", "Long-lived HTTP stream of ADDED/MODIFIED/DELETED events."],
          ["🗄️", "Cache", "API server watch cache", "kube-apiserver keeps recent objects and events in memory per resource, so thousands of watchers don't hit etcd."],
          ["⏪", "410 Gone", "Too old? Relist", "If the client's resourceVersion has been compacted, it gets <code>410 Gone</code> and must LIST again."],
          ["🧠", "Informers", "Informers & listers", "client-go informers wrap all this: local cache + event handlers + work queues. Every controller is built on them."]
        ] }
      ] },
    { id: "framework", title: "The scheduling framework", toc: "Scheduler framework",
      lead: "kube-scheduler is a pipeline of plugins at well-defined extension points. Every placement feature you've used (taints, affinity, topology spread, volume binding, DRA) is a plugin.",
      blocks: [
        { type: "pipeline", stages: [["QueueSort", "order the queue"], ["PreFilter", "precompute"], ["Filter", "feasible nodes"], ["PostFilter", "preemption"], ["Score", "rank nodes"], ["Reserve", "assume resources"], ["Permit", "approve / wait"], ["Bind", "write nodeName"]],
          scenarios: [
            { label: "Normal Pod", path: [0, 1, 2, 4, 5, 6, 7], notes: ["PrioritySort", "NodeResourcesFit precompute", "TaintToleration, NodeAffinity, NodeResourcesFit, VolumeBinding…", "NodeResourcesBalancedAllocation, ImageLocality, InterPodAffinity…", "VolumeBinding reserves PVs", "allowed", "DefaultBinder"], out: '<span style="color:var(--green)">✓ bound</span>' },
            { label: "No node fits, high priority", path: [0, 1, 2, 3], notes: ["", "", "0 feasible nodes", "DefaultPreemption picks victims"], out: '<span style="color:var(--amber)">⚔ lower-priority Pods evicted; Pod nominated to node, retried next cycle</span>' },
            { label: "Gang Pod waiting for its group", path: [0, 1, 2, 4, 5, 6], fail: 6, notes: ["", "", "", "", "", ""], out: '<span style="color:var(--amber)">⏸ Permit returns Wait until all group members can be placed (gang scheduling plugins / Workload API)</span>' }
          ] },
        { type: "code", title: "KubeSchedulerConfiguration: tune a profile", code: `apiVersion: kubescheduler.config.k8s.io/v1
kind: KubeSchedulerConfiguration
profiles:
- schedulerName: default-scheduler
  pluginConfig:
  - name: NodeResourcesFit
    args:
      scoringStrategy:
        type: MostAllocated          # bin-pack instead of spreading (saves nodes)
        resources:
        - {name: cpu, weight: 1}
        - {name: memory, weight: 1}
- schedulerName: batch-scheduler     # second profile in the same binary
  plugins:
    score:
      disabled:
      - name: ImageLocality` }
      ] },
    { id: "multi", title: "Multiple schedulers", toc: "Multiple schedulers",
      blocks: [
        { type: "p", html: "A Pod picks its scheduler with <code>spec.schedulerName</code>. Use extra <b>profiles</b> in kube-scheduler for different scoring, or run a separate scheduler (Volcano, YuniKorn, Kueue's integration, a custom one) for batch/AI workloads that need queues, fairness and gang scheduling." },
        { type: "code", title: "use a profile", code: `apiVersion: v1
kind: Pod
metadata:
  name: batch-task
spec:
  schedulerName: batch-scheduler     # unknown name → Pod stays Pending forever
  containers:
  - name: work
    image: busybox:1.36
    command: ["sleep", "60"]` },
        { type: "callout", kind: "warn", html: "Two schedulers placing Pods on the same nodes don't see each other's in-flight decisions and can overcommit. Prefer profiles in one kube-scheduler, or give each scheduler its own nodes." }
      ] }
  ],
  summary: {
    takeaways: [
      ["🚦", "APF protects the API", "FlowSchemas → priority levels; noisy clients get 429s."],
      ["💓", "Leases", "Node heartbeats and leader election."],
      ["👑", "One active leader", "Standbys take over after the lease expires."],
      ["📡", "LIST + WATCH", "Watch cache in the API server; 410 Gone means relist."],
      ["🧩", "Scheduler = plugins", "Filter, Score, Reserve, Permit, Bind…"],
      ["🗂️", "Profiles", "Different scheduling behaviour via schedulerName."]
    ],
    cheat: `kubectl get flowschemas,prioritylevelconfigurations
kubectl get lease -n kube-system
kubectl get lease -n kube-node-lease
kubectl get --raw /metrics | grep apiserver_flowcontrol
kubectl get pods -o custom-columns=NAME:.metadata.name,SCHED:.spec.schedulerName`,
    quiz: [
      ["A CI bot floods the API server. With APF…", ["Everything slows equally", "The bot's flow is queued/rejected while others keep their share", "etcd crashes", "The bot is banned"], 1, "Fair queuing isolates flows."],
      ["How does a standby scheduler know it should take over?", ["Health checks via SSH", "The Lease isn't renewed before it expires", "etcd alarm", "kubectl"], 1, "Lease-based leader election."],
      ["What does 410 Gone on a watch mean?", ["Object deleted", "Your resourceVersion is too old; relist", "RBAC denied", "API removed"], 1, "History was compacted."],
      ["Which extension point performs preemption?", ["Filter", "PostFilter", "Score", "Bind"], 1, "DefaultPreemption is a PostFilter plugin."]
    ]
  }
});
</script>
</body>
